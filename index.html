    ${po.lastAmendRejection?`<div class="notice bad"><i class="ti ti-x"></i><div><b>Last amendment request rejected:</b> ${esc(po.lastAmendRejection)}</div></div>`:''}
    ${po.cancelReason?`<div class="notice bad"><i class="ti ti-ban"></i><div><b>Cancelled:</b> ${esc(po.cancelReason)}</div></div>`:''}
    ${poAmendHtml(po)}
    ${pcaPanelHtml(po.pcaCheck||live).replace('PCA check:','PCA check ('+(amending?'released version':'frozen at submission')+', PCA v'+(po.pcaVersion||'?')+'):')}
    ${po.overPcaJustification?`<div class="notice warn"><i class="ti ti-message-exclamation"></i><div><b>Buyer’s over-PCA justification:</b> ${esc(po.overPcaJustification)}</div></div>`:''}
    <div class="table-wrap"><table><thead><tr><th>#</th><th>Item</th><th>HSN</th><th class="num">Qty</th><th class="num">Net rate (${esc(c)})</th>${c==='INR'?'<th class="num">GST</th>':''}<th class="num">Amount</th><th class="num">PCA rate ₹</th><th>PCA check</th></tr></thead><tbody>${lines}</tbody></table></div>
    ${(po.cancelledLines||[]).length?`<div class="muted" style="margin-top:6px">Cancelled by amendment: ${po.cancelledLines.map(l=>esc(l.description)+' (Amd '+(l.cancelledInAmd||'?')+')').join('; ')}</div>`:''}
    ${(po.driveFiles||[]).length?`<div class="card" style="margin-top:12px"><div class="card-header"><span><i class="ti ti-brand-google-drive"></i> Filed in Drive (ProMS folder)</span></div><div style="padding:8px 12px">${po.driveFiles.map(f=>`<div>${f.amd?'Amendment '+f.amd:'Original'} — ${f.print?`<a target="_blank" href="${esc(f.print)}">printable copy</a>`:''} ${f.snapshot?`· <a target="_blank" href="${esc(f.snapshot)}">data snapshot</a>`:''} <span class="muted">${fmtDateTime(f.at)}</span></div>`).join('')}</div></div>`:''}
    ${amds.length?`<div class="card" style="margin-top:12px"><div class="card-header"><span>Amendment history</span></div><table><thead><tr><th>No.</th><th>Date</th><th>Reason</th><th>Changes</th><th class="num">Value</th></tr></thead><tbody>${amds.map(x=>`<tr><td>${x.no}</td><td>${fmtDate(x.date)}</td><td>${esc(x.reason)}</td><td>${(x.changes||[]).map(esc).join('<br>')}</td><td class="num">${inr2(x.valueBefore)} → ${inr2(x.valueAfter)}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${quotes?`<div class="card" style="margin-top:12px"><div class="card-header"><span>Quotation comparison ${esc(cs.csNo)} (${a.validCount} complete quote${a.validCount===1?'':'s'})</span><button class="btn sm" onclick="printCS('${cs.id}')"><i class="ti ti-printer"></i>CS</button></div>
      <table><thead><tr><th>Vendor</th><th>Ref</th><th class="num">Ex-GST landed ₹</th><th class="num">Lines</th><th></th></tr></thead><tbody>${quotes}</tbody></table>
      ${cs.justification?`<div class="notice info" style="margin-top:10px"><i class="ti ti-message"></i><div><b>Selection justification:</b> ${esc(cs.justification)}</div></div>`:''}</div>`:''}
    <div class="card"><div class="card-header"><span>Approval trail</span></div>${auditList(po.audit)}</div>
    ${canL1||canL2?`<div class="form-group"><label>Approver remarks</label><textarea id="apprRemarks" placeholder="${canL2?'Remarks on approving over-PCA spend':'Optional remarks'}"></textarea></div>`:''}
    <div class="btn-row" style="justify-content:flex-end">
      <button class="btn" onclick="closeModal()">Close</button>
      ${verOpts}
      <button class="btn" onclick="printPOById('${po.id}')"><i class="ti ti-printer"></i>${po.status==='RELEASED'||amending?'Print / PDF':'Preview'}</button>
      ${po.status==='RELEASED'?`<button class="btn" onclick="exportPOxlsx('${po.id}')"><i class="ti ti-file-spreadsheet"></i>Excel</button><button class="btn" onclick="acceptanceModal('${po.id}')"><i class="ti ti-signature"></i>Vendor acceptance</button>`:''}
      ${po.status==='RELEASED'&&isBuyer()?`<button class="btn primary" onclick="startAmendment('${po.id}')"><i class="ti ti-edit"></i>Amend PO</button>`:''}
      ${po.status==='REJECTED'&&isBuyer()?`<button class="btn primary" onclick="revisePO('${po.id}')"><i class="ti ti-edit"></i>Revise &amp; resubmit</button>`:''}
      ${['PENDING_PRATIM','PENDING_UPDESH','AMEND_PRATIM','AMEND_UPDESH'].includes(po.status)&&isBuyer()&&(po.createdBy===me()||po.pendingAmendment?.requestedBy===me())?`<button class="btn bad" onclick="withdrawPO('${po.id}')"><i class="ti ti-arrow-back"></i>Withdraw${amending?' amendment':''}</button>`:''}
      ${po.status==='RELEASED'&&isUpdesh()?`<button class="btn bad" onclick="cancelPO('${po.id}')"><i class="ti ti-ban"></i>Cancel PO</button>`:''}
      ${canL1||canL2?`<button class="btn bad" onclick="rejectPO('${po.id}')"><i class="ti ti-x"></i>Reject</button><button class="btn ok" onclick="approvePO('${po.id}')"><i class="ti ti-check"></i>${canL1&&pendOver&&!isUpdesh()?'Approve → send to Updesh':amending?'Approve amendment':'Approve & release'}</button>`:''}
    </div></div>`);
}
function printPOById(id){const po=poData.find(x=>x.id===id);if(!po)return;const v=el('verSel')?.value;printPO(po,v===''||v==null?undefined:Number(v))}
async function approvePO(id){
  const po=poData.find(x=>x.id===id);if(!po)return;const rem=g('apprRemarks');
  const FV=firebase.firestore.FieldValue;
  try{
  if(AMEND_STATES.includes(po.status)){
    const p=po.pendingAmendment;if(!p)return showToast('No pending amendment on this PO','error');
    const over=!!p.pcaCheck?.overPca;
    if(po.status==='AMEND_PRATIM'&&canApproveL1()){
      if(over&&!isUpdesh()){
        await db.collection(PM_PO).doc(id).update({status:'AMEND_UPDESH','pendingAmendment.approvals':FV.arrayUnion(clean({level:'AMEND_PRATIM',by:me(),byName:myName(),at:nowIso(),remarks:rem||''})),updatedAt:nowIso(),audit:FV.arrayUnion(audit(null,`Amendment ${p.amendmentNo} approved by ${myName()} (L1) — over PCA, escalated to Updesh${rem?' — '+rem:''}`))});
        closeModal();return showToast('Amendment sent to Updesh');
      }
      if(over&&!rem)return showToast('Add remarks when approving an over-PCA amendment','error');
    }else if(po.status==='AMEND_UPDESH'&&canApproveL2()){
      if(!rem)return showToast('Add remarks when approving an over-PCA amendment','error');
    }else return showToast('You cannot approve this amendment at its current stage','error');
    const patch=amendmentApplyPatch(po,rem,po.status);
    patch.audit=FV.arrayUnion(audit(null,`Amendment ${p.amendmentNo} approved & released by ${myName()} — ${inr(p.valueBefore)} → ${inr(p.valueAfter)}${rem?' — '+rem:''}`));
    await db.collection(PM_PO).doc(id).update(patch);closeModal();setTimeout(()=>archivePoToDrive(id).catch(e=>console.warn('Drive filing skipped:',e.message)),1800);return showToast(`Amendment ${p.amendmentNo} released`);
  }
  let next,act;
  if(po.status==='PENDING_PRATIM'&&canApproveL1()){
    if(po.pcaCheck?.overPca&&!isUpdesh()){next='PENDING_UPDESH';act='Approved by '+myName()+' (L1) — over PCA, escalated to Updesh'}
    else{next='RELEASED';act=`Approved & released by ${myName()}${po.pcaCheck?.overPca?' (L1 + over-PCA approval)':''}`}
  }else if(po.status==='PENDING_UPDESH'&&canApproveL2()){
    if(!rem)return showToast('Add remarks when approving an over-PCA PO','error');next='RELEASED';act='Over-PCA spend approved & released by '+myName();
  }else return showToast('You cannot approve this PO at its current stage','error');
  const patch={status:next,approvals:FV.arrayUnion(clean({level:po.status,by:me(),byName:myName(),at:nowIso(),remarks:rem||''})),audit:FV.arrayUnion(audit(null,act+(rem?' — '+rem:'')))};
  if(next==='RELEASED'){patch.releasedAt=nowIso();patch.releasedBy=me()}
  await db.collection(PM_PO).doc(id).update(patch);closeModal();showToast(next==='RELEASED'?'PO released':'Sent to Updesh');
  if(next==='RELEASED')setTimeout(()=>archivePoToDrive(id).catch(e=>console.warn('Drive filing skipped:',e.message)),1800);
  }catch(e){console.error(e);showToast('Approval failed: '+e.message,'error')}
}
async function rejectPO(id){
  const po=poData.find(x=>x.id===id);if(!po)return;
  const rem=g('apprRemarks')||prompt('Reason for rejection?');if(!rem)return showToast('Rejection needs a reason','error');
  const FV=firebase.firestore.FieldValue;
  if(AMEND_STATES.includes(po.status)){
    const n=po.pendingAmendment?.amendmentNo;
    await db.collection(PM_PO).doc(id).update({status:'RELEASED',pendingAmendment:null,lastAmendRejection:`Amendment ${n}: ${rem}`,updatedAt:nowIso(),audit:FV.arrayUnion(audit(null,`Amendment ${n} rejected by ${myName()} — ${rem}. PO remains released as before.`))});
    closeModal();return showToast('Amendment rejected — PO unchanged');
  }
  await db.collection(PM_PO).doc(id).update({status:'REJECTED',rejectedReason:rem,rejectedBy:me(),rejectedAt:nowIso(),audit:FV.arrayUnion(audit(null,'Rejected by '+myName()+' — '+rem))});closeModal();showToast('PO rejected — returned to buyer')}
async function withdrawPO(id){
  const po=poData.find(x=>x.id===id);if(!po)return;const FV=firebase.firestore.FieldValue;
  if(AMEND_STATES.includes(po.status)){
    if(!confirm('Withdraw this amendment request? The PO stays released as it was.'))return;
    await db.collection(PM_PO).doc(id).update({status:'RELEASED',pendingAmendment:null,updatedAt:nowIso(),audit:FV.arrayUnion(audit(null,`Amendment ${po.pendingAmendment?.amendmentNo} withdrawn by ${myName()}`))});closeModal();return showToast('Amendment withdrawn');
  }
  if(!confirm('Withdraw this PO from approval? It moves to Rejected so you can revise it.'))return;
  await db.collection(PM_PO).doc(id).update({status:'REJECTED',rejectedReason:'Withdrawn by buyer for revision',audit:FV.arrayUnion(audit(null,'Withdrawn by '+myName()))});closeModal()}
async function cancelPO(id){
  const po=poData.find(x=>x.id===id);if(!po||po.status!=='RELEASED')return showToast('Only a released PO (with no pending amendment) can be cancelled','error');
  const r=prompt('Reason for cancelling this RELEASED PO? (quantities return to BOQ balance)');if(!r)return;
  await db.collection(PM_PO).doc(id).update({status:'CANCELLED',cancelReason:r,cancelledAt:nowIso(),cancelledBy:me(),audit:firebase.firestore.FieldValue.arrayUnion(audit(null,'Cancelled by '+myName()+' — '+r))});
  if(po.csId)await db.collection(PM_CS).doc(po.csId).update({status:'FINALIZED',audit:firebase.firestore.FieldValue.arrayUnion(audit(null,`PO ${po.poNumber} cancelled — CS back to finalised`))}).catch(()=>{});
  closeModal();showToast('PO cancelled')}

function renderApprovals(){
  const mine=myApprovalQueue();
  const others=poData.filter(p=>['PENDING_PRATIM','PENDING_UPDESH','AMEND_PRATIM','AMEND_UPDESH'].includes(p.status)&&!mine.includes(p));
  const rejected=poData.filter(p=>p.status==='REJECTED');
  el('tab-approvals').innerHTML=`<div class="notice info"><i class="ti ti-route"></i><div><b>Approval route:</b> Buyer submits → <b>Pratim</b> approves → released. If the PO (or an amendment to it) exceeds PCA it goes on to <b>Updesh</b> before release. Updesh can approve at either stage. A pending amendment never changes the released PO until it is approved.</div></div>
    <div class="card"><div class="card-header"><span>Awaiting my approval (${mine.length})</span></div>${poTable(mine)}</div>
    ${others.length?`<div class="card"><div class="card-header"><span>Pending with others (${others.length})</span></div>${poTable(others)}</div>`:''}
    ${rejected.length?`<div class="card"><div class="card-header"><span>Rejected — awaiting buyer revision (${rejected.length})</span></div>${poTable(rejected)}</div>`:''}`;
}


</script>
