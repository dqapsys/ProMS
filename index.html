function startAmendment(id){
  const po=poData.find(x=>x.id===id);if(!po)return;
  if(po.status!=='RELEASED')return showToast('Only a released PO can be amended (another change may already be pending)','error');
  poDraft=clean({...po,id:po.id,amendOf:po.id,amendReason:'',specialTerms:po.specialTerms||[],cancelledLines:po.cancelledLines||[],scope:po.scope||'',shipState:po.shipState||settings.company.state,priceVariation:po.priceVariation||'Not Applicable'});
  ['pcaCheck','audit','approvals','revisionHistory','amendments','pendingAmendment'].forEach(k=>delete poDraft[k]);
  closeModal();renderPoEditor();
}
function addAmendLineModal(){
  const d=poDraft,pid=d.projectId,pm=pmProj(pid),have=new Set(d.lines.map(l=>l.boqId));
  const opts=(pm.boq||[]).filter(b=>!have.has(b.id)&&boqBalance(pid,b,d.id)>0);
  openSubModal(`<div class="card-header"><span>Add PECS item to PO ${esc(d.poNumber)}</span><button class="btn sm" onclick="closeSubModal()"><i class="ti ti-x"></i></button></div><div class="dialog-body">
    ${opts.length?`<div class="form-group"><label>PECS item (with balance qty)</label><select id="alBoq">${opts.map(b=>`<option value="${b.id}">${esc(b.description)} — bal ${fmt(boqBalance(pid,b,d.id),2)} ${esc(b.unit)}</option>`).join('')}</select></div>
    <div class="form-row"><div class="form-group"><label class="req">Qty</label><input id="alQty" type="number" step="any"></div><div class="form-group"><label class="req">Rate (${esc(d.currency)})</label><input id="alRate" type="number" step="any"></div><div class="form-group"><label>Disc %</label><input id="alDisc" type="number" step="any" value="0"></div><div class="form-group"><label>GST %</label><input id="alGst" type="number" step="any" value="${(d.lines[0]?.gstPct)??num(settings.defaultGstPct)}"></div></div>
    <div class="notice warn"><i class="ti ti-info-circle"></i><div>Items added by amendment should be backed by a vendor quotation/offer; attach it to the project’s Procurement folder and mention it in the amendment reason.</div></div>
    <div class="btn-row" style="justify-content:flex-end"><button class="btn" onclick="closeSubModal()">Cancel</button><button class="btn primary" onclick="addAmendLine()">Add</button></div>`:'<div class="empty">No other PECS items have balance quantity.</div>'}</div>`);
}
function addAmendLine(){
  const d=poDraft,b=boqItem(d.projectId,g('alBoq')),q=num(g('alQty')),r=num(g('alRate'));
  if(!b||q<=0||r<=0)return showToast('Item, qty and rate are required','error');
  if(q>boqBalance(d.projectId,b,d.id)+1e-9)return showToast('Qty exceeds PECS balance','error');
  d.lines.push({boqId:b.id,pcaKey:b.pcaKey||'',description:b.description,make:b.make||'',unit:b.unit||'Nos',hsn:b.hsn||'',qty:q,rate:r,discPct:num(g('alDisc')),gstPct:num(g('alGst'))});
  closeSubModal();renderPoEditor();
}
function diffAmend(old,nw){
  const no=(old.amendmentNo||0)+1,changes=[],oldBy={},newBy={};
  (old.lines||[]).forEach(l=>oldBy[l.boqId]=l);(nw.lines||[]).forEach(l=>newBy[l.boqId]=l);
  const cancelled=[...(old.cancelledLines||[])];
  const lines=(nw.lines||[]).map(l=>{const o=oldBy[l.boqId];
    if(!o){changes.push(`Added: ${l.description} × ${fmt(l.qty,2)} ${l.unit||''} @ ${fmt(lineNetRate(l),2)}`);return{...l,amendNo:no,history:[]}}
    const same=num(o.qty)===num(l.qty)&&num(o.rate)===num(l.rate)&&num(o.discPct)===num(l.discPct)&&num(o.gstPct)===num(l.gstPct)&&(o.hsn||'')===(l.hsn||'')&&o.description===l.description&&(o.make||'')===(l.make||'');
    if(same)return{...l,amendNo:o.amendNo||0,history:o.history||[]};
    const parts=[];if(num(o.qty)!==num(l.qty))parts.push(`qty ${fmt(o.qty,2)} → ${fmt(l.qty,2)}`);
    if(num(o.rate)!==num(l.rate)||num(o.discPct)!==num(l.discPct))parts.push(`net rate ${fmt(lineNetRate(o),2)} → ${fmt(lineNetRate(l),2)}`);
    if(num(o.gstPct)!==num(l.gstPct))parts.push(`GST ${fmt(o.gstPct,1)}% → ${fmt(l.gstPct,1)}%`);if(!parts.length)parts.push('details updated');
    changes.push(`${l.description}: ${parts.join(', ')}`);
    return{...l,amendNo:no,history:[...(o.history||[]),{amendNo:o.amendNo||0,qty:o.qty,rate:o.rate,discPct:o.discPct||0,gstPct:o.gstPct}]}});
  (old.lines||[]).forEach(o=>{if(!newBy[o.boqId]){changes.push(`Cancelled: ${o.description} (was ${fmt(o.qty,2)} ${o.unit||''})`);cancelled.push({...o,cancelledInAmend:no})}});
  [['paymentTerms','Payment terms'],['deliveryPeriod','Delivery period'],['deliveryFrom','Delivery from'],['deliveryTo','Delivery by'],['warranty','Warranty'],['priceBasis','Delivery terms'],['freightTerms','Freight terms'],['insurance','Insurance'],['inspection','Inspection'],['shipTo','Delivery address'],['shipState','Delivery state'],['billTo','Bill-to'],['scope','Scope'],['priceVariation','Price variation'],['orderExpiry','Order expiry'],['specialNotes','Special instructions'],['contactPerson','Contact person']].forEach(([k,lbl])=>{
    const a=String(old[k]||''),b=String(nw[k]||'');if(a!==b)changes.push(`${lbl} changed`+(a.length<70&&b.length<70?`: “${a||'-'}” → “${b||'-'}”`:''))});
  if(num(old.freight)!==num(nw.freight))changes.push(`Freight ${fmt(old.freight,2)} → ${fmt(nw.freight,2)}`);
  if(num(old.otherCharges)!==num(nw.otherCharges))changes.push(`Other charges ${fmt(old.otherCharges,2)} → ${fmt(nw.otherCharges,2)}`);
  if(num(old.fxRate)!==num(nw.fxRate))changes.push(`Exchange rate ${old.fxRate} → ${nw.fxRate}`);
  if(JSON.stringify(old.specialTerms||[])!==JSON.stringify(nw.specialTerms||[]))changes.push('Special terms & conditions changed');
  return{changes,lines,cancelledLines:cancelled,no};
}
async function submitAmendment(){
  const d=poDraft,old=poData.find(x=>x.id===d.amendOf);if(!old)return showToast('Original PO not found','error');
  if(old.status!=='RELEASED')return showToast('This PO is no longer in Released state','error');
  const err=validatePoDraft(d);if(err)return showToast(err,'error');
  const reason=String(d.amendReason||'').trim();if(reason.length<10)return showToast('Enter the reason for amendment (min. 10 characters)','error');
  const nw=buildPoDoc(d),df=diffAmend(old,nw);
  if(!df.changes.length)return showToast('Nothing has changed — no amendment needed','error');
  if(nw.pcaCheck.overPca&&String(d.overPcaJustification||'').trim().length<15)return showToast('Over-PECS justification required (min. 15 characters)','error');
  if(!confirm(`Submit Amendment ${df.no} on ${old.poNumber}?\nValue ${inr2(old.totals.grand)} → ${inr2(nw.totals.grand)}\n${df.changes.length} change(s)\n${nw.pcaCheck.overPca?'⚠ Over PECS — Pratim → Updesh':'Within PECS — Pratim'}`))return;
  showLoad('Submitting amendment…');
  try{
    const p={};PO_VERSION_FIELDS.forEach(k=>{if(nw[k]!==undefined)p[k]=nw[k]});
    Object.assign(p,{lines:df.lines,cancelledLines:df.cancelledLines,amendmentNo:df.no,amendmentDate:today(),poDate:old.poDate,vendorSnapshot:old.vendorSnapshot||nw.vendorSnapshot,companySnapshot:old.companySnapshot||nw.companySnapshot,
      reason,changes:df.changes,valueBefore:old.totals.grand,valueAfter:nw.totals.grand,requestedBy:me(),requestedByName:myName(),requestedAt:nowIso(),approvals:[]});
    await db.collection(PM_PO).doc(old.id).update({status:'AMEND_PRATIM',pendingAmendment:clean(p),updatedAt:nowIso(),
      audit:firebase.firestore.FieldValue.arrayUnion(audit(null,`Amendment ${df.no} submitted — ${inr(old.totals.grand)} → ${inr(nw.totals.grand)}${nw.pcaCheck.overPca?' — OVER PCA':''} — ${reason}`))});
    poDraft=null;closeModal();hideLoad();showToast(`Amendment ${df.no} submitted for approval`);renderAll(true);
  }catch(e){hideLoad();console.error(e);showToast('Submit failed: '+e.message,'error')}
}
// patch applied when the final approver releases a pending amendment
function amendmentApplyPatch(po,remarks,level){
  const p=po.pendingAmendment;const before={};PO_VERSION_FIELDS.forEach(k=>{if(po[k]!==undefined)before[k]=po[k]});
  const apprNames=[...(p.approvals||[]).map(a=>a.byName),myName()].filter((x,i,a)=>a.indexOf(x)===i).join(', ');
  const rec=clean({no:p.amendmentNo,date:p.amendmentDate,reason:p.reason,changes:p.changes,valueBefore:p.valueBefore,valueAfter:p.valueAfter,requestedBy:p.requestedBy,requestedByName:p.requestedByName,requestedAt:p.requestedAt,approvedAt:nowIso(),approvedByNames:apprNames,before});
  const patch={status:'RELEASED',pendingAmendment:null,amendmentNo:p.amendmentNo,amendmentDate:p.amendmentDate,updatedAt:nowIso(),
    amendments:firebase.firestore.FieldValue.arrayUnion(rec),
    approvals:firebase.firestore.FieldValue.arrayUnion(clean({level,by:me(),byName:myName(),at:nowIso(),remarks:remarks||'',forAmend:p.amendmentNo}))};
  PO_VERSION_FIELDS.forEach(k=>{if(k!=='amendmentNo'&&k!=='amendmentDate'&&p[k]!==undefined)patch[k]=clean(p[k])});
  return patch;
}

function poStatusStamp(po,isOld){
  if(isOld)return['SUPERSEDED','#8D6E63','SUPERSEDED'];
  const st=po.status;
  if(st==='RELEASED'||st==='AMEND_PRATIM'||st==='AMEND_UPDESH')return['AUTHORISED','#1B5E20',''];
  if(st==='PENDING_PRATIM'||st==='PENDING_UPDESH')return['PENDING APPROVAL','#E65100','NOT APPROVED'];
  if(st==='REJECTED')return['REJECTED','#B71C1C','REJECTED'];
  if(st==='CANCELLED')return['CANCELLED','#B71C1C','CANCELLED'];
  return['DRAFT','#546E7A',po.amendDraft?'AMENDMENT DRAFT':'DRAFT'];
}

}

    const hist=(l.history||[]).map(h=>`<tr class="old"><td><span class="code">${i+1}</span> - <span class="strike">${esc(l.description)}</span> <span class="pill g">superseded</span><div class="small">HSN ${esc(l.hsn||'')} · was qty ${fmt(h.qty,2)} @ ${fmt(h.rate,2)}</div></td><td class="n">${h.amendNo||0}</td><td class="n strike">${fmt(h.qty,2)}</td><td class="n strike">${fmt(h.rate,2)}</td><td class="n strike">${fmt(lineNetRate(h),2)}</td>${foreign?'':`<td class="n">${fmt(h.gstPct,1)}%</td>`}<td class="n">0.00</td></tr>`).join('');
    const chg=cur&&(l.amendNo||0)===cur;
    const main=`<tr class="${chg&&!isOld?'chg':''}"><td><span class="code">${i+1}</span> - ${esc(l.description)}${l.make?`<div class="small">Make / Model : ${esc(l.make)}</div>`:''}${chg?` <span class="pill">${(l.history||[]).length?'revised':'added'} in Amd ${cur}</span>`:''}<div class="chips"><span>HSN : ${esc(l.hsn||'-')}${foreign?'':' - GST '+fmt(l.gstPct,1)+'%'}</span><span>UOM : ${esc(l.unit||'')}</span></div></td>
      <td class="n">${l.amendNo||0}</td><td class="n">${fmt(l.qty,2)}</td><td class="n">${fmt(l.rate,2)}</td><td class="n">${fmt(lineNetRate(l),2)}</td>${foreign?'':`<td class="n">${fmt(l.gstPct,1)}%</td>`}<td class="n"><b>${fmt(r2(num(l.qty)*lineGross(l,foreign)),2)}</b></td></tr>`;
    return hist+main;
  };
  const cancelled=(m.cancelledLines||[]).map(l=>`<tr class="old"><td><span class="strike">${esc(l.description)}</span> <span class="pill r">cancelled in Amd ${l.cancelledInAmend}</span><div class="small">HSN ${esc(l.hsn||'')} · was qty ${fmt(l.qty,2)} @ ${fmt(l.rate,2)}</div></td><td class="n">${l.cancelledInAmend}</td><td class="n strike">${fmt(l.qty,2)}</td><td class="n strike">${fmt(l.rate,2)}</td><td class="n strike">${fmt(lineNetRate(l),2)}</td>${foreign?'':`<td class="n">${fmt(l.gstPct,1)}%</td>`}<td class="n">0.00</td></tr>`).join('');
  const matTbl=`<table class="tbl"><thead><tr><th style="width:${foreign?50:44}%">Code - Description</th><th class="n" style="width:7%">Amend. No</th><th class="n" style="width:9%">Quantity</th><th class="n" style="width:11%">Basic Rate</th><th class="n" style="width:11%">Net Rate${foreign?'':' (ex-GST)'}</th>${foreign?'':'<th class="n" style="width:6%">GST</th>'}<th class="n" style="width:12%">Total Value${foreign?'':' (incl. GST)'}</th></tr></thead><tbody>${lines.map(rowsFor).join('')}${cancelled}</tbody></table>`;
  const grandRow=`<div class="words">In Words : ${foreign?esc(cur$)+' '+fmt(t.grand,2)+' only':amountInWords(t.grand)} <span style="float:right">Grand Total : ${fmt(t.grand,2)}</span></div>`;
  const abstract=sec(isSvc?'Service Abstract':'Material Abstract',matTbl+grandRow,'brk');

  // ── payment / pricing / essentials / quotation ──
  const payLines=String(m.paymentTerms||'').split(/\n+/).filter(Boolean);
  const payment=sec('Payment Terms',`<div class="pad" style="padding:5px 8px">${payLines.map((x,i)=>`<div><b>1.${i+1}</b> &nbsp; ${esc(x)}</div>`).join('')||'-'}</div>`);
  const prow=(k,val,b)=>`<tr><td${b?' style="font-weight:700"':''}>${esc(k)}</td><td class="n"${b?' style="font-weight:700"':''}>${val}</td></tr>`;
  const taxRows=foreign?'':(t.interState?Object.keys(t.taxBy||{}).map(r=>prow('IGST @ '+r+'%',fmt(t.taxBy[r],2))):Object.keys(t.taxBy||{}).flatMap(r=>[prow('CGST @ '+fmt(r/2,1)+'%',fmt(t.taxBy[r]/2,2)),prow('SGST @ '+fmt(r/2,1)+'%',fmt(t.taxBy[r]/2,2))])).join('');
  const pricing=sec('Pricing Details',`<table class="tbl"><thead><tr><th>Category</th><th class="n" style="width:22%">Value (${esc(cur$)})</th></tr></thead><tbody>
    ${prow((isSvc?'Service value':'Material value')+' (after discount, excl. GST)',fmt(t.basic,2))}${num(m.freight)?prow('Packing & Forwarding / Freight Charges',fmt(m.freight,2)):''}${num(m.otherCharges)?prow(m.otherChargesLabel||'Others',fmt(m.otherCharges,2)):''}
    ${prow('Taxable Value',fmt(t.taxable,2))}${taxRows}${prow('Grand Total',fmt(t.grand,2),true)}</tbody></table>`);
  const ess=[['Price Variation',m.priceVariation||'Not Applicable'],['Delivery Terms',m.priceBasis],['Freight',m.freightTerms],['Transit Insurance',m.insurance],['Inspection',m.inspection],['Warranty',m.warranty],['Order Expiry Date',m.orderExpiry?fmtD(m.orderExpiry):'-'],['Special Instructions',m.specialNotes]].filter(r=>r[1]);
  const essentials2=sec('Essentials Details',`<table class="tbl"><thead><tr><th style="width:36%">Attribute Details</th><th>Attribute Value</th></tr></thead><tbody>${ess.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table>`);
  const quote=sec('Quotation Details',`<table class="tbl"><thead><tr><th>Comparison (CS) No.</th><th>Vendor Quotation Ref</th><th>Quotation Date</th><th>PECS Line</th></tr></thead><tbody>${lines.map((l,i)=>`<tr><td>${esc(po.csNo||'')}</td><td>${esc(po.quoteRef||'')}</td><td>${fmtD(po.quoteDate)}</td><td>${i+1} - ${esc(l.description).slice(0,60)}</td></tr>`).join('')}</tbody></table>`);

  // ── annexures ──
  const sched=lines.map((l,i)=>{const sch=l.schedule&&l.schedule.length?l.schedule:[{qty:l.qty,from:l.deliverFrom||m.deliveryFrom||m.poDate,to:l.deliverTo||m.deliveryTo,remarks:''}];
    const win=m.deliveryFrom||m.deliveryTo||l.deliverFrom||l.deliverTo?null:m.deliveryPeriod;
    return`<table class="tbl" style="margin-bottom:5px"><thead><tr><th>Code - Description</th><th class="n" style="width:12%">Quantity</th><th style="width:10%">UOM</th><th style="width:26%">Deliver Between</th></tr></thead><tbody>
      <tr><td><span class="code">${i+1}</span> - ${esc(l.description)}</td><td class="n">${fmt(l.qty,2)}</td><td>${esc(l.unit||'')}</td><td>${win?esc(win):fmtD(l.deliverFrom||m.deliveryFrom||m.poDate)+' to '+fmtD(l.deliverTo||m.deliveryTo)}</td></tr>
      <tr><td colspan="4" style="padding:0"><table style="width:100%"><thead><tr><th style="background:var(--pl2);color:var(--pd);font-size:7.7px;padding:2px 5px;text-align:left;width:22%">Schedule Number</th><th class="n" style="background:var(--pl2);color:var(--pd);font-size:7.7px;padding:2px 5px;width:14%">Quantity</th><th style="background:var(--pl2);color:var(--pd);font-size:7.7px;padding:2px 5px;text-align:left;width:30%">Deliver Between</th><th style="background:var(--pl2);color:var(--pd);font-size:7.7px;padding:2px 5px;text-align:left">Remarks</th></tr></thead><tbody>
      ${sch.map((s,k)=>`<tr><td style="padding:2px 5px">${k+1}</td><td class="n" style="padding:2px 5px">${fmt(s.qty,2)}</td><td style="padding:2px 5px">${win?esc(win):fmtD(s.from)+' to '+fmtD(s.to)}</td><td style="padding:2px 5px">${esc(s.remarks||'')}</td></tr>`).join('')}</tbody></table></td></tr></tbody></table>`}).join('');
  const annDelivery=sec('ANNEXURE : Delivery Schedule',sched,'brk');
  const taxLines=lines.map((l,i)=>{const amt=r2(num(l.qty)*lineNetRate(l)),tax=r2(amt*num(l.gstPct)/100);
    const comp=t.interState?`IGST ${fmt(l.gstPct,1)}%`:`CGST ${fmt(l.gstPct/2,1)}% + SGST ${fmt(l.gstPct/2,1)}%`;
    return`<tr><td><span class="code">${i+1}</span> - ${esc(l.description)}<div class="small">HSN ${esc(l.hsn||'-')}</div></td><td>${esc(v.state||'')}</td><td>${esc(m.shipState||c.state||'')}</td><td>${comp}</td><td class="n">${fmt(amt,2)}</td><td class="n">${fmt(tax,2)}</td></tr>`}).join('');
  const extraTax=(num(m.freight)||num(m.otherCharges))?(()=>{const base=num(m.freight)+num(m.otherCharges),tax=r2(base*num(m.freightGstPct)/100);return`<tr><td>Freight / Other charges</td><td>${esc(v.state||'')}</td><td>${esc(m.shipState||c.state||'')}</td><td>${t.interState?'IGST '+fmt(m.freightGstPct,1)+'%':'CGST+SGST '+fmt(m.freightGstPct,1)+'%'}</td><td class="n">${fmt(base,2)}</td><td class="n">${fmt(tax,2)}</td></tr>`})():'';
  const annTax=foreign?'':sec('ANNEXURE : Item-wise Tax Details',`<table class="tbl"><thead><tr><th style="width:38%">Code - Description</th><th>Source</th><th>Destination</th><th>Tax Component</th><th class="n">Taxable Value</th><th class="n">Tax Value</th></tr></thead><tbody>${taxLines}${extraTax}<tr><td colspan="5" class="n"><b>Total Tax Value :</b></td><td class="n"><b>${fmt(t.gst,2)}</b></td></tr></tbody></table>`);
  const hist=[...amds].sort((a,b)=>a.no-b.no).filter(a=>!isOld||a.no<=cur);
  if(po.amendDraft)hist.push({no:cur,date:today(),reason:po._amendReason,valueBefore:po._valueBefore,valueAfter:t.grand,changes:po._changes||[]});
  const annAmend=hist.length?sec('ANNEXURE : Amendment History',`<table class="tbl"><thead><tr><th style="width:9%">Amend. No</th><th style="width:12%">Date</th><th>Reason &amp; changes</th><th class="n" style="width:15%">Value before</th><th class="n" style="width:15%">Value after</th></tr></thead><tbody>${hist.map(a=>`<tr><td class="n" style="text-align:left"><b>${a.no}</b></td><td>${fmtD(a.date)}</td><td>${esc(a.reason||'')}${(a.changes||[]).length?`<ul style="margin:2px 0 0 14px;padding:0">${a.changes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="small">${a.requestedByName?'Requested by '+esc(a.requestedByName):''}${a.approvedByNames?' · Approved by '+esc(a.approvedByNames):''}</div></td><td class="n">${fmt(a.valueBefore,2)}</td><td class="n">${fmt(a.valueAfter,2)}</td></tr>`).join('')}</tbody></table>`):'';
  const st=(m.specialTerms||[]).filter(x=>String(x.value||'').trim()||String(x.attr||'').trim());
  const stRows=st.map((x,i)=>`<tr><td style="width:5%">${i+1}</td><td style="width:24%"><b>${esc(x.attr||'')}</b></td><td>${esc(x.value||'').replace(/\n/g,'<br>')}</td></tr>`).join('');
  const annGeneral=(m.tnc||[]).length?sec('General Terms & Conditions',`<div style="padding:4px 8px"><ol class="terms">${m.tnc.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`):'';
  const annSpecial=sec('Special Terms & Conditions',`<table class="tbl"><thead><tr><th>No.</th><th>Heading</th><th>Terms specific to this order</th></tr></thead><tbody>${stRows||'<tr><td colspan="3" class="small">No special terms for this order.</td></tr>'}</tbody></table>${acc?.remarks&&accOk?`<div class="note"><b>Vendor acceptance remarks :</b> ${esc(acc.remarks)}</div>`:''}`);
  const annTerms=annGeneral+annSpecial+`<div class="note" style="margin-top:6px"><b>Note :</b> ${esc(settings.poNote||DEFAULT_SETTINGS.poNote)}</div>`;
  const approvals=(po.approvals||[]).filter(a=>(a.forAmend||0)<=cur).map(a=>`${esc(a.byName)} (${fmtD(a.at)})`).join(' · ');
  const signs=`<div class="sign"><div class="box">Vendor acceptance (sign &amp; seal)<br><span class="small">Name / Date :</span></div><div class="box" style="text-align:right">For <b>${esc(c.name)}</b><br><br>${esc(m.signatory||po.signatory||settings.signatory||'Authorised Signatory')}${approvals&&!isOld?`<div class="small">Approved electronically : ${approvals}</div>`:''}</div></div>`;
  const tail=`<div class="foot">This is a computer-generated ${isSvc?'Service':'Purchase'} Order issued from DQAP ProMS.</div>`;

  const body=page1+abstract+payment+pricing+essentials2+quote+annDelivery+annTax+annAmend+annTerms+signs+tail;
  const doc=`${wm?`<div class="wm">${wm}</div>`:''}<table class="frame"><thead><tr><td>${header}</td></tr></thead><tbody><tr><td>${body}</td></tr></tbody><tfoot><tr><td style="height:1px"></td></tr></tfoot></table>`;
  const css=(PO_PRINT_CSS+PO_VARIANT_CSS[style]).replace('${GEN}',gen.replace(/"/g,''));
  return{html:`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc((po.poNumber||(isSvc?'SO':'PO')).replace(/\//g,'_'))}${cur?'_Amd'+cur:''}</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>${css}</style></head><body class="v-${style}"><div class="toolbar"><button onclick="window.print()">Print / Save as PDF</button><span>${esc(po.poNumber||'')} · Amendment ${cur}${isOld?' (superseded version)':''}</span></div>${doc}</body></html>`,title:`${esc((po.poNumber||(isSvc?'SO':'PO')).replace(/\//g,'_'))}${cur?'_Amd'+cur:''}`};
}
function printPO(po,ver,style){
  if(!po)return;const r=poPrintHtml(po,ver,style);if(!r)return;
  const w=window.open('','_blank');if(!w)return showToast('Allow pop-ups to print','error');
  w.document.write(r.html);w.document.close();return w;
}

function renderVendors(){

  ${list.length?`<div class="table-wrap"><table><thead><tr><th>Vendor</th><th>GSTIN</th><th>State</th><th>Contact</th><th>Category</th><th class="num">Active POs</th><th class="num">Value</th><th></th></tr></thead><tbody>${list.map(v=>{const s=stat(v.id);return`<tr><td><b>${esc(v.name)}</b>${v.inactive?' <span class="badge s-open">inactive</span>':''}<div class="muted">${esc(v.city||'')}</div></td><td>${esc(v.gstin||'-')}</td><td>${esc(v.state||'-')}</td><td>${esc(v.contactName||'')}<div class="muted">${esc(v.phone||'')} ${esc(v.email||'')}</div></td><td>${esc(v.category||'')}</td><td class="num">${s.n}</td><td class="num">${inr(s.v)}</td><td>${isBuyer()?`<button class="btn sm" onclick="vendorModal('${v.id}')"><i class="ti ti-edit"></i></button>`:''}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No vendors yet</div>'}</div>`;

function vendorModal(id,quoteIdx){
  const v=id?vendorById(id):{};const f=(k,lbl,req)=>`<div class="form-group"><label class="${req?'req':''}">${lbl}</label><input id="vf_${k}" value="${esc(v[k]||'')}"></div>`;

    <div class="form-row">${f('name','Vendor name',1)}${f('gstin','GSTIN')}</div>
    <div class="form-row"><div class="form-group" style="grid-column:1/-1"><label>Address</label><input id="vf_address" value="${esc(v.address||'')}"></div></div>
    <div class="form-row">${f('city','City')}<div class="form-group"><label class="req">State</label><select id="vf_state"><option value="">—</option>${IN_STATES.map(s=>`<option ${s===v.state?'selected':''}>${s}</option>`).join('')}</select></div>${f('pincode','PIN')}</div>
    <div class="form-row">${f('pan','PAN')}${f('contactName','Contact person')}${f('phone','Phone')}${f('email','Email')}</div>
    <div class="form-row">${f('category','Category (OEM / distributor / sub-contractor…)')}${f('defaultPayTerms','Default payment terms')}</div>
    ${id?`<label style="display:flex;gap:6px;align-items:center;margin-bottom:10px"><input type="checkbox" id="vf_inactive" ${v.inactive?'checked':''}> Inactive (hide from new quotes)</label>`:''}
    <div class="btn-row" style="justify-content:flex-end"><button class="btn" onclick="closeSubModal()">Cancel</button><button class="btn primary" onclick="saveVendor(${id?`'${id}'`:'null'},${quoteIdx==null?'null':quoteIdx})"><i class="ti ti-device-floppy"></i>Save</button></div></div>`);
}
async function saveVendor(id,quoteIdx){
  const keys=['name','gstin','address','city','state','pincode','pan','contactName','phone','email','category','defaultPayTerms'];const d={};keys.forEach(k=>d[k]=g('vf_'+k));
  d.gstin=d.gstin.toUpperCase();d.pan=d.pan.toUpperCase();
  if(!d.name||!d.state)return showToast('Vendor name and state are required','error');
  if(d.gstin&&!/^[0-9]{2}[A-Z0-9]{10}[0-9A-Z]{3}$/.test(d.gstin))return showToast('GSTIN format looks wrong (15 characters)','error');
  if(vendorsData.some(v=>v.id!==id&&(norm(v.name)===norm(d.name)||(d.gstin&&v.gstin===d.gstin))))return showToast('A vendor with this name/GSTIN already exists','error');
  if(id)d.inactive=!!el('vf_inactive')?.checked;
  d.updatedAt=nowIso();d.updatedBy=me();
  let newId=id;
  if(id)await db.collection(PM_VEND).doc(id).update(d);else{d.createdAt=nowIso();d.createdBy=me();newId=(await db.collection(PM_VEND).add(d)).id}
  closeSubModal();showToast('Vendor saved');

async function approvePO(id){
  const po=poData.find(x=>x.id===id);if(!po)return;const rem=g('apprRemarks');

    patch.audit=FV.arrayUnion(audit(null,`Amendment ${p.amendmentNo} approved & released by ${myName()} — ${inr(p.valueBefore)} → ${inr(p.valueAfter)}${rem?' — '+rem:''}`));
    await db.collection(PM_PO).doc(id).update(patch);closeModal();setTimeout(()=>archivePoToDrive(id).catch(e=>console.warn('Drive filing skipped:',e.message)),1800);return showToast(`Amendment ${p.amendmentNo} released`);
  }
  let next,act;

    if(po.pcaCheck?.overPca&&!isUpdesh()){next='PENDING_UPDESH';act='Approved by '+myName()+' (L1) — over PECS, escalated to Updesh'}
    else{next='RELEASED';act=`Approved & released by ${myName()}${po.pcaCheck?.overPca?' (L1 + over-PECS approval)':''}`}
  }else if(po.status==='PENDING_UPDESH'&&canApproveL2()){
    if(!rem)return showToast('Add remarks when approving an over-PECS PO','error');next='RELEASED';act='Over-PECS spend approved & released by '+myName();
  }else return showToast('You cannot approve this PO at its current stage','error');
  const patch={status:next,approvals:FV.arrayUnion(clean({level:po.status,by:me(),byName:myName(),at:nowIso(),remarks:rem||''})),audit:FV.arrayUnion(audit(null,act+(rem?' — '+rem:'')))};
  if(next==='RELEASED'){patch.releasedAt=nowIso();patch.releasedBy=me()}
  await db.collection(PM_PO).doc(id).update(patch);closeModal();showToast(next==='RELEASED'?'PO released':'Sent to Updesh');
  if(next==='RELEASED')setTimeout(()=>archivePoToDrive(id).catch(e=>console.warn('Drive filing skipped:',e.message)),1800);
  }catch(e){console.error(e);showToast('Approval failed: '+e.message,'error')}
}
async function rejectPO(id){
  const po=poData.find(x=>x.id===id);if(!po)return;
  const rem=g('apprRemarks')||prompt('Reason for rejection?');if(!rem)return showToast('Rejection needs a reason','error');
  const FV=firebase.firestore.FieldValue;
  if(AMEND_STATES.includes(po.status)){
    const n=po.pendingAmendment?.amendmentNo;
    await db.collection(PM_PO).doc(id).update({status:'RELEASED',pendingAmendment:null,lastAmendRejection:`Amendment ${n}: ${rem}`,updatedAt:nowIso(),audit:FV.arrayUnion(audit(null,`Amendment ${n} rejected by ${myName()} — ${rem}. PO remains released as before.`))});
    closeModal();return showToast('Amendment rejected — PO unchanged');
  }
  await db.collection(PM_PO).doc(id).update({status:'REJECTED',rejectedReason:rem,rejectedBy:me(),rejectedAt:nowIso(),audit:FV.arrayUnion(audit(null,'Rejected by '+myName()+' — '+rem))});closeModal();showToast('PO rejected — returned to buyer')}
async function withdrawPO(id){
  const po=poData.find(x=>x.id===id);if(!po)return;const FV=firebase.firestore.FieldValue;
  if(AMEND_STATES.includes(po.status)){
    if(!confirm('Withdraw this amendment request? The PO stays released as it was.'))return;
    await db.collection(PM_PO).doc(id).update({status:'RELEASED',pendingAmendment:null,updatedAt:nowIso(),audit:FV.arrayUnion(audit(null,`Amendment ${po.pendingAmendment?.amendmentNo} withdrawn by ${myName()}`))});closeModal();return showToast('Amendment withdrawn');
  }
  if(!confirm('Withdraw this PO from approval? It moves to Rejected so you can revise it.'))return;
  await db.collection(PM_PO).doc(id).update({status:'REJECTED',rejectedReason:'Withdrawn by buyer for revision',audit:FV.arrayUnion(audit(null,'Withdrawn by '+myName()))});closeModal()}
async function cancelPO(id){
  const po=poData.find(x=>x.id===id);if(!po||po.status!=='RELEASED')return showToast('Only a released PO (with no pending amendment) can be cancelled','error');
  const r=prompt('Reason for cancelling this RELEASED PO? (quantities return to PECS balance)');if(!r)return;
  await db.collection(PM_PO).doc(id).update({status:'CANCELLED',cancelReason:r,cancelledAt:nowIso(),cancelledBy:me(),audit:firebase.firestore.FieldValue.arrayUnion(audit(null,'Cancelled by '+myName()+' — '+r))});
  if(po.csId)await db.collection(PM_CS).doc(po.csId).update({status:'FINALIZED',audit:firebase.firestore.FieldValue.arrayUnion(audit(null,`PO ${po.poNumber} cancelled — CS back to finalised`))}).catch(()=>{});
  closeModal();showToast('PO cancelled')}

function renderApprovals(){
  const mine=myApprovalQueue();
  const others=poData.filter(p=>['PENDING_PRATIM','PENDING_UPDESH','AMEND_PRATIM','AMEND_UPDESH'].includes(p.status)&&!mine.includes(p));
  const rejected=poData.filter(p=>p.status==='REJECTED');
  const pecsQ=Object.values(pmData).filter(x=>x.pecsPending).map(x=>({pm:x,p:projectById(x.id)||{}}));
  const pecsCard=pecsQ.length?`<div class="card"><div class="card-header"><span><i class="ti ti-trending-down"></i> PECS below sales-PCA margin — awaiting Updesh (${pecsQ.length})</span></div><div class="table-wrap"><table><thead><tr><th>Project</th><th>PECS version</th><th class="num">PECS GM %</th><th class="num">Sales PCA GM %</th><th>Submitted by</th><th></th></tr></thead><tbody>${pecsQ.map(({pm,p})=>`<tr><td><b>${esc(p.number||pm.projectNumber||'')}</b><div class="muted">${esc(p.name||pm.projectName||'')}</div></td><td>v${pm.pecsPending.version}</td><td class="num flag">${pctS(pm.pecsPending.gmPct,2)}</td><td class="num">${pctS(pm.pecsPending.salesGmPct,2)}</td><td>${esc(pm.pecsPending.uploadedByName||'')}</td><td><button class="btn sm" onclick="activeProjectId='${pm.id}';projSubTab='pecs';switchTab('project')"><i class="ti ti-eye"></i>${isUpdesh()?'Review':'View'}</button></td></tr>`).join('')}</tbody></table></div></div>`:'';
  el('tab-approvals').innerHTML=`<div class="notice info"><i class="ti ti-route"></i><div><b>Approval route:</b> A PECS with gross margin below the sales PCA goes straight to <b>Updesh</b> (equal or higher needs no approval). POs: Buyer submits → <b>Pratim</b> approves → released. If the PO (or an amendment to it) exceeds PECS it goes on to <b>Updesh</b> before release. Updesh can approve at either stage. A pending amendment never changes the released PO until it is approved.</div></div>
    ${pecsCard}
    <div class="card"><div class="card-header"><span>Awaiting my approval (${mine.length})</span></div>${poTable(mine)}</div>
    ${others.length?`<div class="card"><div class="card-header"><span>Pending with others (${others.length})</span></div>${poTable(others)}</div>`:''}
    ${rejected.length?`<div class="card"><div class="card-header"><span>Rejected — awaiting buyer revision (${rejected.length})</span></div>${poTable(rejected)}</div>`:''}`;
}
