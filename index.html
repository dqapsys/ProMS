<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DQAP ProMS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%23006994' width='64' height='64' rx='12'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='700' font-size='22' fill='white' text-anchor='middle'%3EPO%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--p:#006994;--pd:#004A68;--pl:#E4F1FA;--bg:#F4F6FA;--card:#fff;--t1:#111;--t2:#666;--bd:rgba(0,0,0,.11);--bds:rgba(0,0,0,.22);--rad:10px;--ok:#1B5E20;--okl:#E8F5E9;--warn:#E65100;--warnl:#FFF3E0;--bad:#B71C1C;--badl:#FFEBEE}
    body{font-family:'DM Sans','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t1);font-size:13px}
    .container{max-width:1480px;margin:0 auto;padding:20px}
    .header{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;padding:22px;border-radius:var(--rad);margin-bottom:16px;display:flex;justify-content:space-between;gap:16px;align-items:center}
    .header h1{font-size:26px;margin-bottom:5px;display:flex;align-items:center;gap:10px;font-weight:700}
    .header p{opacity:.9;font-size:13px}.userbox{background:rgba(255,255,255,.18);padding:11px 14px;border-radius:8px;min-width:210px}.userbox .lbl{font-size:10px;opacity:.85;margin-bottom:5px;text-transform:uppercase;letter-spacing:.7px}.userbox .nm{font-size:13px;font-weight:700}
    .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tab-btn{padding:9px 14px;border-radius:7px;border:1px solid var(--bds);background:var(--card);color:var(--t1);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;display:flex;align-items:center;gap:6px;font-family:inherit}.tab-btn:hover{border-color:var(--p);background:var(--pl)}.tab-btn.active{background:var(--p);color:#fff;border-color:var(--p)}
    .tab-btn .cnt{background:var(--bad);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;line-height:16px}
    .subtabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px;flex-wrap:wrap}.subtab{padding:8px 13px;border:none;background:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;color:var(--t2);border-bottom:2px solid transparent;display:flex;gap:5px;align-items:center}.subtab.active{color:var(--p);border-bottom-color:var(--p)}
    .tab-content{display:none}.tab-content.active{display:block}.card{background:var(--card);border-radius:var(--rad);border:.5px solid var(--bd);padding:16px;margin-bottom:14px}.card-header{font-size:13px;font-weight:700;margin:-16px -16px 14px;padding:12px 16px;border-bottom:.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}.stat{background:var(--card);border-radius:var(--rad);border:.5px solid var(--bd);padding:13px;display:flex;gap:11px;align-items:center}.stat-icon{width:36px;height:36px;background:var(--pl);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--p);font-size:19px;flex-shrink:0}.stat-value{font-size:20px;font-weight:700;color:var(--p)}.stat-label{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.4px}
    .stat.alert .stat-icon{background:var(--badl);color:var(--bad)}.stat.alert .stat-value{color:var(--bad)}
    table{width:100%;border-collapse:collapse}th{padding:8px 9px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;background:#f5f5f5;border-bottom:.5px solid var(--bd);color:var(--t2);white-space:nowrap}td{padding:8px 9px;border-bottom:.5px solid var(--bd);vertical-align:top}tr:hover td{background:#fafafa}.table-wrap{overflow-x:auto}
    td.num,th.num{text-align:right;white-space:nowrap}
    .btn{padding:7px 12px;border-radius:7px;border:.5px solid var(--bds);background:transparent;color:var(--t1);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:5px;font-family:inherit;white-space:nowrap}.btn:hover{background:#f0f0f0}.btn.primary{background:var(--p);color:#fff;border-color:var(--p)}.btn.primary:hover{background:var(--pd)}.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.ok:hover{background:#14461a}.btn.bad{color:var(--bad);border-color:#EF9A9A}.btn.sm{padding:5px 9px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    input,select,textarea{font-family:inherit;width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;background:#fafafa;color:var(--t1);font-size:12.5px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p);background:#fff}textarea{min-height:70px;resize:vertical}
    input[type="checkbox"],input[type="radio"]{width:16px;height:16px;padding:0;margin:0;flex-shrink:0;accent-color:var(--p)}
    input.cell{padding:5px 6px;font-size:12px;min-width:70px;text-align:right}
    .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}.form-group label{display:block;font-size:10.5px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}.req::after{content:' *';color:var(--bad)}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
    .s-open{background:#ECEFF1;color:#455A64}.s-pratim{background:#E3F2FD;color:#006994}.s-updesh{background:#F3E5F5;color:#6A1B9A}.s-ok{background:var(--okl);color:var(--ok)}.s-rej{background:var(--badl);color:var(--bad)}.s-warn{background:var(--warnl);color:var(--warn)}.s-done{background:#EDE7F6;color:#4527A0}
    .muted{color:var(--t2);font-size:11px}.strong{font-weight:700}.right{text-align:right}.hidden{display:none!important}.empty{text-align:center;color:var(--t2);padding:30px 12px}
    .flag{color:var(--bad);font-weight:700}.okc{color:var(--ok);font-weight:700}
    tr.over td{background:#FFF5F5}tr.over:hover td{background:#FFEDED}
    td.l1{background:#E8F5E9!important;font-weight:700;color:var(--ok)}
    th.sel,td.sel{box-shadow:inset 0 0 0 2px var(--p)}
    .notice{border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}.notice i{font-size:16px;margin-top:1px}.notice.bad{background:var(--badl);color:var(--bad);border:1px solid #F5C2C2}.notice.warn{background:var(--warnl);color:#8a3b00;border:1px solid #FFD8A8}.notice.ok{background:var(--okl);color:var(--ok);border:1px solid #BFE3C3}.notice.info{background:var(--pl);color:var(--pd);border:1px solid #BCD9EC}
    .quote-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;margin-bottom:12px}.quote-card{border:1px solid var(--bd);border-radius:9px;padding:12px;background:#fcfcfd}.quote-card .form-row{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.quote-card h4{font-size:12.5px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .modal{position:fixed;inset:0;background:rgba(13,29,38,.55);z-index:5000;display:flex;align-items:center;justify-content:center;padding:24px}.dialog{background:var(--card);width:min(1280px,100%);max-height:calc(100vh - 48px);overflow-y:auto;border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.3)}.dialog.narrow{width:min(640px,100%)}.dialog .card-header{position:sticky;top:0;z-index:2;background:#fff;margin:0;padding:14px 16px}.dialog-body{padding:16px}
    .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}.detail-item{background:#fafafa;border:1px solid var(--bd);border-radius:8px;padding:9px 10px}.detail-item .lbl{color:var(--t2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}.detail-item .val{font-weight:600;line-height:1.45;overflow-wrap:anywhere}
    .audit-row{display:grid;grid-template-columns:150px 140px 1fr;gap:10px;border-bottom:.5px solid var(--bd);padding:7px 0;font-size:12px}
    .bar{height:8px;background:#eceff1;border-radius:6px;overflow:hidden;min-width:90px}.bar>span{display:block;height:100%;background:var(--p)}.bar.over>span{background:var(--bad)}
    .toast{position:fixed;right:18px;bottom:18px;background:#1A237E;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:600;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:420px}.toast.error{background:var(--bad)}.toast.success{background:var(--ok)}
    .error-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.error-card{background:#fff;border-radius:12px;border:.5px solid var(--bd);box-shadow:0 10px 30px rgba(0,0,0,.12);max-width:520px;padding:26px;text-align:center}.error-card h2{color:var(--bad);margin-bottom:8px}
    .loading{position:fixed;inset:0;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;z-index:9000;font-weight:700;color:var(--p)}
    .proj-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.proj-head select{max-width:520px}
    .pill{display:inline-block;padding:1px 7px;border-radius:5px;background:#eef2f5;font-size:10.5px;font-weight:600;color:#455A64}
    @media(max-width:720px){.container{padding:12px}.header{align-items:flex-start;flex-direction:column}.audit-row{grid-template-columns:1fr}.card{padding:12px}.card-header{margin:-12px -12px 12px;padding:10px 12px}.modal{padding:8px}}
  </style>
</head>
<body>
<div id="appContainer" class="container" style="display:none">
  <div class="header">
    <div><h1><i class="ti ti-shopping-cart"></i> ProMS</h1><p>Procurement Management — BOQ, PCA baseline, 3-quote comparison, PO issue &amp; approvals</p></div>
    <div class="userbox"><div class="lbl">Logged in as</div><div class="nm" id="currentUser">-</div></div>
  </div>
  <div class="tabs" id="mainTabs">
    <button class="tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')"><i class="ti ti-layout-dashboard"></i>Dashboard</button>
    <button class="tab-btn" data-tab="project" onclick="switchTab('project')"><i class="ti ti-building-factory-2"></i>Project Procurement</button>
    <button class="tab-btn" data-tab="approvals" onclick="switchTab('approvals')"><i class="ti ti-checkup-list"></i>PO Approvals <span class="cnt hidden" id="apprCnt"></span></button>
    <button class="tab-btn" data-tab="register" onclick="switchTab('register')"><i class="ti ti-file-invoice"></i>PO Register</button>
    <button class="tab-btn" data-tab="vendors" onclick="switchTab('vendors')"><i class="ti ti-truck-delivery"></i>Vendors</button>
    <button class="tab-btn" data-tab="settings" id="settingsTabBtn" onclick="switchTab('settings')" style="display:none"><i class="ti ti-settings"></i>Settings</button>
  </div>
  <section id="tab-dashboard" class="tab-content active"></section>
  <section id="tab-project" class="tab-content"></section>
  <section id="tab-approvals" class="tab-content"></section>
  <section id="tab-register" class="tab-content"></section>
  <section id="tab-vendors" class="tab-content"></section>
  <section id="tab-settings" class="tab-content"></section>
</div>
<div id="modalRoot"></div>
<input type="file" id="fileBoq" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleBoqFile(this)">
<input type="file" id="filePca" accept=".xlsx,.xls" style="display:none" onchange="handlePcaFile(this)">

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function r2(n){return Math.round((Number(n)||0)*100)/100}
function fmt(n,dec=0){return Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec})}
function inr(n){return '₹'+fmt(n,0)}

function showToast(msg,type='success'){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast '+(type==='error'?'error':'success');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3800)}

function safeId(s){return String(s||'').trim().replace(/[\/\\#?\s.]+/g,'_')||'NA'}
// Indian-system amount in words (Rupees … and … Paise Only)
function amountInWords(amount){
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=n=>n<20?a[n]:b[Math.floor(n/10)]+(n%10?' '+a[n%10]:'');
  const three=n=>(n>=100?a[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?two(n%100):'');
  const words=n=>{if(n===0)return'Zero';let s='';const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
    if(cr)s+=(cr>=100?words(cr):two(cr))+' Crore ';if(lk)s+=two(lk)+' Lakh ';if(th)s+=two(th)+' Thousand ';if(n)s+=three(n);return s.trim()};
  const rupees=Math.floor(Math.abs(amount)),paise=Math.round((Math.abs(amount)-rupees)*100);
  return 'Rupees '+words(rupees)+(paise?' and '+two(paise)+' Paise':'')+' Only';
}

// ═══════════════════════════════════════════════════════════════════════
// PCA WORKBOOK PARSER  (DQAP PCA format: Summary + 7 detail sheets)
// Header-text driven so it survives column moves between PCA versions.
// ═══════════════════════════════════════════════════════════════════════
const NON_PROCURABLE_RX=/\b(gst|igst|cgst|sgst|tax|finance cost|interest|margin)\b/i;
function sheetRows(ws){return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true})}
function cellText(v){return String(v??'').replace(/\s+/g,' ').trim()}
function mapHeader(row){
  const m={};
  (row||[]).forEach((c,i)=>{
    const t=cellText(c).toLowerCase();if(!t)return;
    if(/^s\.?\s*no|^sr/.test(t)&&m.sno==null)m.sno=i;
    else if(/description|^scope|^item/.test(t)&&m.desc==null)m.desc=i;
    else if(/^make|specification|^model|part\s*no|^vendor/.test(t)&&m.make==null)m.make=i;
    else if((/^unit$|^uom/.test(t))&&m.unit==null)m.unit=i;
    else if(/^qty|^quantity/.test(t)&&m.qty==null)m.qty=i;
    else if(/^currency/.test(t))m.cur=i;
    else if(/unit rate.*foreign/.test(t))m.fxRate=i;
    else if(/exchange/.test(t))m.fx=i;
    else if(/^duty\s*%/.test(t))m.duty=i;
    else if(/^rate/.test(t)&&m.rate==null)m.rate=i;
    else if(/^amount/.test(t)&&/₹|inr|rs/.test(t))m.amount=i;
    else if(/^amount/.test(t)&&m.amount==null&&!/foreign/.test(t))m.amount=i;
    else if(/^remark/.test(t)&&m.rem==null)m.rem=i;
    else if(/categor|^head|^group|^type/.test(t)&&m.cat==null)m.cat=i;
  });
  return m;
}
function findHeaderRow(rows,maxScan=20){
  for(let i=0;i<Math.min(rows.length,maxScan);i++){const m=mapHeader(rows[i]);if(m.desc!=null&&(m.qty!=null||m.amount!=null))return{idx:i,map:m}}
  return null;
}
function parsePcaWorkbook(wb,fileName){
  const items=[],heads=[],meta={};
  const summaryHeads={};
  wb.SheetNames.forEach(name=>{
    const ws=wb.Sheets[name];const rows=sheetRows(ws);const lname=name.toLowerCase();
    if(lname.includes('summary')){
      rows.forEach(r=>{
        const label=cellText(r[0]).toLowerCase();const vals=(r||[]).slice(1).filter(v=>v!=null&&cellText(v)!=='');
        const first=vals[0];
        if(/rfp|tender ref/.test(label))meta.ref=cellText(first);
        else if(/^project description/.test(label))meta.description=cellText(first);
        else if(/^customer/.test(label))meta.customer=cellText(first);
        else if(/^end customer/.test(label))meta.endCustomer=cellText(first);
        else if(/^location/.test(label))meta.location=cellText(first);
        else if(/^total input cost/.test(label))meta.totalInputCost=num(vals.find(v=>typeof v==='number'));
        else if(/^gross profit\s*\(%\)|^gross profit +\(%\)/.test(label.replace(/\s+/g,' ')))meta.gpPct=num(first);
        else if(/^selling price/.test(label))meta.sellingPrice=num(first);
        else if(/^approval status/.test(label))meta.approvalStatus=cellText(first);
        // cost-head table: S.No | Cost Head | Amount | % | | Source Worksheet
        if(typeof r[0]==='number'&&r[1]&&typeof r[2]==='number'){
          const src=cellText(r[5]).match(/'([^']+)'/);summaryHeads[(src?src[1]:cellText(r[1])).toLowerCase()]={label:cellText(r[1]),amount:r[2]};
        }
      });
      return;
    }
    const isMgmt=/mgmt|management|supervision|manpower/.test(lname);
    const isOther=/other cost/.test(lname);
    if(isOther){
      let section='';
      rows.forEach((r,ri)=>{
        const a=r?.[0];const at=cellText(a);
        const next=rows[ri+1];
        if(at&&typeof a!=='number'&&next&&/^s\.?\s*no/i.test(cellText(next[0]))){section=at;return}
        if(typeof a==='number'){
          const hdr=findHeaderRow(rows.slice(Math.max(0,ri-6),ri),6);const m=hdr?hdr.map:{desc:1,amount:3,rem:4};
          const amt=num(r[m.amount??3]);if(!amt)return;
          const desc=cellText(r[m.desc??1])||section||'Other cost';
          const basis=cellText(r[2]);
          items.push({key:safeId(name)+'_r'+(ri+1),head:name,sheet:name,row:ri+1,description:desc+(cellText(r[m.desc??1])&&section?` (${section})`:''),make:basis,unit:'Lot',qty:1,rate:r2(amt),amount:r2(amt),procurable:!NON_PROCURABLE_RX.test(desc+' '+section)});
        }
      });
      return;
    }
    if(isMgmt){
      // Internal manpower — not procured through POs. Capture total only (Summary value preferred below).
      let total=0;for(let i=0;i<rows.length;i++){const r=rows[i];if(/^total/i.test(cellText(r?.[0]))){const n=(r||[]).filter(v=>typeof v==='number');total=n.length?n[n.length-1]:0;break}}
      heads.push({name,sheet:name,total:r2(total),procurable:false});return;
    }
    const hdr=findHeaderRow(rows);
    if(!hdr)return;
    const m=hdr.map;
    for(let i=hdr.idx+1;i<rows.length;i++){
      const r=rows[i]||[];const a=cellText(r[0]);
      if(/total/i.test(a))break;
      const desc=cellText(r[m.desc]),make=m.make!=null?cellText(r[m.make]):'';
      const qty=num(r[m.qty]);
      let rate=m.rate!=null?r[m.rate]:null;
      if(typeof rate!=='number'){ // formula without cached value → rebuild
        if(m.fxRate!=null)rate=num(r[m.fxRate])*num(r[m.fx]||1)*(1+num(r[m.duty]));else rate=num(rate);
      }
      let amount=m.amount!=null?r[m.amount]:null;if(typeof amount!=='number')amount=qty*rate;
      if(!desc&&!make)continue;
      if(!qty&&!amount)continue;
      items.push({key:safeId(name)+'_r'+(i+1),head:name,sheet:name,row:i+1,description:desc||make,make,unit:m.unit!=null?cellText(r[m.unit]):'',qty,rate:r2(rate),amount:r2(amount),
        currency:m.cur!=null?(cellText(r[m.cur])||'INR'):'INR',fxUnitRate:m.fxRate!=null?num(r[m.fxRate]):null,exRate:m.fx!=null?num(r[m.fx]):null,dutyPct:m.duty!=null?num(r[m.duty]):null,
        baseRateInr:m.fxRate!=null&&m.fx!=null?r2(num(r[m.fxRate])*num(r[m.fx])):null,remarks:m.rem!=null?cellText(r[m.rem]):'',procurable:!NON_PROCURABLE_RX.test(desc)});
    }
  });
  // head totals — prefer Summary sheet values, fall back to item sums
  const byHead={};items.forEach(it=>{byHead[it.head]=(byHead[it.head]||0)+it.amount});
  Object.keys(byHead).forEach(h=>{
    const s=summaryHeads[h.toLowerCase()];
    heads.push({name:h,sheet:h,label:s?.label||h,total:r2(byHead[h]),summaryTotal:s?r2(s.amount):null,procurable:true});
  });
  heads.forEach(h=>{if(!h.label){const s=summaryHeads[h.name.toLowerCase()];h.label=s?.label||h.name;if(s){h.summaryTotal=r2(s.amount);if(!h.total)h.total=h.summaryTotal}}});
  // Summary heads with no matching detail sheet (renamed sheets etc.) — keep them visible as non-itemised
  Object.keys(summaryHeads).forEach(k=>{if(!heads.some(h=>h.name.toLowerCase()===k)){const s=summaryHeads[k];heads.push({name:s.label,sheet:'',label:s.label,total:r2(s.amount),summaryTotal:r2(s.amount),procurable:false,notItemised:true})}});
  const procBudget=r2(items.filter(i=>i.procurable).reduce((s,i)=>s+i.amount,0));
  if(!meta.totalInputCost)meta.totalInputCost=r2(heads.reduce((s,h)=>s+(h.summaryTotal??h.total),0));
  return{fileName,meta,heads,items,procBudget};
}

// ═══════════════════════════════════════════════════════════════════════
// BOQ PARSER (simple item list: S.No | Description | Make/Model | Unit | Qty | Category | Remarks)
// ═══════════════════════════════════════════════════════════════════════
function parseBoqWorkbook(wb){
  for(const name of wb.SheetNames){
    const rows=sheetRows(wb.Sheets[name]);const hdr=findHeaderRow(rows,25);if(!hdr||hdr.map.qty==null)continue;
    const m=hdr.map,out=[];
    for(let i=hdr.idx+1;i<rows.length;i++){
      const r=rows[i]||[];const desc=cellText(r[m.desc]);if(!desc)continue;if(/^total/i.test(desc)||/^total/i.test(cellText(r[0])))continue;
      out.push({sno:m.sno!=null?cellText(r[m.sno]):String(out.length+1),description:desc,make:m.make!=null?cellText(r[m.make]):'',unit:m.unit!=null?cellText(r[m.unit]):'Nos',qty:num(r[m.qty]),category:m.cat!=null?cellText(r[m.cat]):'',remarks:m.rem!=null?cellText(r[m.rem]):''});
    }
    if(out.length)return out;
  }
  return[];
}
function downloadBoqTemplate(){
  const ws=XLSX.utils.aoa_to_sheet([['S.No','Item / Description','Make / Model / Part No','Unit','Qty','Category','Remarks'],[1,'MX Photo/Heat Sensor','4098-5255','Nos',18,'OEM Domestic',''],[2,'2 Pair x 1.5 Sq. mm unarmoured FRLS cable','','Mtr',400,'Local 3rd Party','']]);
  ws['!cols']=[{wch:6},{wch:48},{wch:24},{wch:8},{wch:8},{wch:18},{wch:24}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'BOQ');

// ═══════════════════════════════════════════════════════════════════════
// BOQ ↔ PCA auto-matching
// ═══════════════════════════════════════════════════════════════════════
const STOP=new Set(['the','and','of','for','with','x','nos','no','set','to','in','a','an','mm','sq']);
function toks(s){return norm(s).replace(/[^a-z0-9]+/g,' ').split(' ').filter(t=>t.length>=2&&!STOP.has(t))}
function codeKey(s){return norm(s).replace(/[^a-z0-9]/g,'')}
function codes(s){return new Set(norm(s).split(/[\s,;()]+/).map(t=>t.replace(/[^a-z0-9]/g,'')).filter(t=>t.length>=3&&/\d/.test(t)))}
function matchScore(boq,pca){
  const bm=codeKey(boq.make),pm=codeKey(pca.make);
  if(bm&&pm&&bm.length>=4&&bm===pm)return 1;
  const CA=codes(boq.description+' '+boq.make),CB=codes(pca.description+' '+pca.make);
  let codeHit=false;CA.forEach(c=>{if(CB.has(c))codeHit=true});
  if(codeHit)return 1;
  const A=new Set(toks(boq.description+' '+boq.make)),B=new Set(toks(pca.description+' '+pca.make));
  if(!A.size||!B.size)return 0;
  let inter=0;A.forEach(t=>{if(B.has(t))inter++});
  let sc=inter/(A.size+B.size-inter);
  if(CA.size&&CB.size)sc*=0.5; // both carry part numbers and none match → likely a different variant
  return Math.min(1,sc);
}
function autoMatch(boqItems,pca,overwrite){
  if(!pca)return boqItems;
  const cand=pca.items.filter(i=>i.procurable);
  return boqItems.map(b=>{
    if(b.pcaKey&&!overwrite&&cand.some(c=>c.key===b.pcaKey))return b;
    let best=null,bs=0;cand.forEach(c=>{const s=matchScore(b,c);if(s>bs){bs=s;best=c}});
    return{...b,pcaKey:bs>=0.4?best.key:'',matchScore:r2(bs),matchMode:bs>=0.4?'auto':''};
  });
}

// ═══════════════════════════════════════════════════════════════════════
// Aggregations used by comparison, PO check and dashboards
// ═══════════════════════════════════════════════════════════════════════
function pmProj(pid){return pmData[pid]||{boq:[],pca:null}}
function pcaItem(pid,key){return(pmProj(pid).pca?.items||[]).find(i=>i.key===key)}
function boqItem(pid,id){return(pmProj(pid).boq||[]).find(i=>i.id===id)}
function lineNetRate(l){return r2(num(l.rate)*(1-num(l.discPct)/100))}
function activePOs(pid,excludeId){return poData.filter(p=>p.projectId===pid&&ACTIVE_PO.includes(p.status)&&p.id!==excludeId)}
function orderedByBoq(pid,excludeId){const m={};activePOs(pid,excludeId).forEach(po=>(po.lines||[]).forEach(l=>{m[l.boqId]=(m[l.boqId]||0)+num(l.qty)}));return m}
function orderedByPca(pid,excludeId){
  const m={};activePOs(pid,excludeId).forEach(po=>{const fx=num(po.fxRate)||1;(po.lines||[]).forEach(l=>{if(!l.pcaKey)return;const x=m[l.pcaKey]||(m[l.pcaKey]={qty:0,value:0});x.qty+=num(l.qty);x.value+=num(l.qty)*lineNetRate(l)*fx})});return m;
}
function poInrValue(po){return r2((po.totals?.basic||0)*(num(po.fxRate)||1)+(num(po.freight)+num(po.otherCharges))*(num(po.fxRate)||1))}
function projectOrderedTotal(pid,excludeId){return r2(activePOs(pid,excludeId).reduce((s,po)=>s+poInrValue(po),0))}

// ═══════════════════════════════════════════════════════════════════════
// PCA CHECK — the core control. Evaluated when a PO is drafted, re-evaluated
// (and frozen into the PO) at submission. All values ex-GST, in ₹.
// ═══════════════════════════════════════════════════════════════════════
function evaluatePca(pid,lines,opts={}){
  const pm=pmProj(pid),pca=pm.pca,tol=1+num(settings.pcaTolerancePct)/100,fx=num(opts.fxRate)||1;
  const flags=[],lineResults=[];
  const prior=orderedByPca(pid,opts.excludePoId);
  const addTo={};
  lines.forEach(l=>{if(l.pcaKey){const x=addTo[l.pcaKey]||(addTo[l.pcaKey]={qty:0,value:0});x.qty+=num(l.qty);x.value+=num(l.qty)*lineNetRate(l)*fx}});
  if(!pca){flags.push({type:'NO_PCA',msg:'No PCA uploaded for this project — PO cannot be validated against costing'})}
  lines.forEach(l=>{
    const res={boqId:l.boqId,pcaKey:l.pcaKey||'',flags:[]};
    const rateInr=r2(lineNetRate(l)*fx);res.poRateInr=rateInr;
    const pi=pca&&l.pcaKey?pca.items.find(i=>i.key===l.pcaKey):null;
    if(pca&&!pi){const f={type:'NOT_IN_PCA',boqId:l.boqId,item:l.description,msg:`“${l.description}” is not linked to any PCA line`,overAmt:r2(rateInr*num(l.qty))};flags.push(f);res.flags.push(f)}
    if(pi){
      // Foreign-currency PO against an import line → compare ex-duty CIF rate (duty is paid separately to customs, not to the vendor)
      const foreignPo=fx!==1||(opts.currency&&opts.currency!=='INR');
      const benchRate=foreignPo&&pi.baseRateInr?pi.baseRateInr:pi.rate,benchAmt=r2(benchRate*pi.qty);
      res.pcaRate=benchRate;res.pcaQty=pi.qty;res.pcaAmount=benchAmt;res.benchBasis=benchRate!==pi.rate?'ex-duty':'landed';
      const p=prior[pi.key]||{qty:0,value:0},t=addTo[pi.key];
      res.cumQty=r2(p.qty+t.qty);res.cumValue=r2(p.value+t.value);res.priorQty=r2(p.qty);
      if(rateInr>benchRate*tol+0.005){const f={type:'RATE',boqId:l.boqId,item:l.description,msg:`Rate ${inr2(rateInr)} exceeds PCA rate ${inr2(benchRate)}${res.benchBasis==='ex-duty'?' (ex-duty)':''} (+${benchRate?fmt((rateInr/benchRate-1)*100,1):'∞'}%)`,overAmt:r2((rateInr-benchRate)*num(l.qty))};flags.push(f);res.flags.push(f)}
      if(res.cumQty>pi.qty+1e-9){const f={type:'QTY',boqId:l.boqId,item:l.description,msg:`Cumulative qty ${fmt(res.cumQty,2)} exceeds PCA qty ${fmt(pi.qty,2)} (already ordered ${fmt(p.qty,2)})`,overAmt:r2((res.cumQty-pi.qty)*rateInr)};flags.push(f);res.flags.push(f)}
      if(res.cumValue>benchAmt*tol+0.5){const f={type:'VALUE',boqId:l.boqId,item:l.description,msg:`Cumulative value ${inr(res.cumValue)} exceeds PCA amount ${inr(benchAmt)}`,overAmt:r2(res.cumValue-benchAmt)};if(!res.flags.length){flags.push(f)}res.flags.push(f)}
    }
    lineResults.push(res);
  });
  // project-level procurement budget
  const budget={procBudget:pca?.procBudget||0,orderedBefore:projectOrderedTotal(pid,opts.excludePoId),thisPo:r2(num(opts.thisPoValueInr))};
  budget.after=r2(budget.orderedBefore+budget.thisPo);
  if(pca&&budget.after>budget.procBudget*tol+0.5)flags.push({type:'BUDGET',msg:`Total procurement ${inr(budget.after)} will exceed PCA procurement budget ${inr(budget.procBudget)}`,overAmt:r2(budget.after-budget.procBudget)});
  const overAmt=r2(flags.filter(f=>f.type!=='BUDGET').reduce((s,f)=>s+num(f.overAmt),0));
  return{evaluatedAt:nowIso(),tolerancePct:num(settings.pcaTolerancePct),overPca:flags.length>0,flags,lines:lineResults,budget,overAmt};
}

// ═══════════════════════════════════════════════════════════════════════
// Google Drive (existing Cloud Run uploader) → project's "Procurement" folder
// Also registers the file against the project in DORBIT PMO documents.
// ═══════════════════════════════════════════════════════════════════════
// ── ProMS in Google Drive (hybrid model) ───────────────────────────────
// Each PMO project already has a Drive tree (created by DORBIT). ProMS keeps its documents in a
// "ProMS" folder inside it:  NN. ProMS / 01. BOQ · 02. PCA · 03. Quotations / <CS no> · 04. Purchase Orders / <PO no>
// Firestore keeps only small state records; Drive keeps files + a JSON snapshot of every issued PO version.
const PROMS_SUBS=[['boq','01. BOQ'],['pca','02. PCA'],['quotes','03. Quotations'],['po','04. Purchase Orders']];
const safeName=x=>String(x||'').replace(/[\\/:*?"<>|]+/g,'_').trim();
async function driveCall(body){
  const r=await fetch(DRIVE_UPLOAD_API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||('Drive service error '+r.status))}
  return r.json();
}
const folderUrl=id=>id?`https://drive.google.com/drive/folders/${id}`:'';
const _driveLock={};
function oneAtATime(key,fn){const prev=_driveLock[key]||Promise.resolve();const run=prev.catch(()=>{}).then(fn);_driveLock[key]=run;return run}
// Find or create the project's ProMS folder and its four sub-folders. Cached on the ProMS project record.
function ensureProMsFolders(pid){
  return oneAtATime('root_'+pid,async()=>{
    const p=projectById(pid);if(!p?.driveFolderId)throw new Error('This project has no Drive folder yet — create the project Drive folders from DORBIT PMO first');
    let drive=pmProj(pid).drive;
    if(drive?.rootId&&PROMS_SUBS.every(([k])=>drive.subs?.[k]))return drive;
    // PMO checklist: read fresh so we never overwrite a concurrent PMO edit with a stale list
    const snap=await db.collection(PROJ_COL).doc(pid).get();const list=(snap.data()?.driveChecklist||[]).slice();
    let root=list.find(x=>/\bproms\b/i.test(x.label||''));
    if(!root){
      const label=String(list.length+1).padStart(2,'0')+'. ProMS';
      const d=await driveCall({action:'createSingleFolder',parentFolderId:p.driveFolderId,name:label});
      root={key:'proms',label,folderId:d.folderId,subfolders:[]};list.push(root);
      await db.collection(PROJ_COL).doc(pid).update({driveChecklist:list});
    }
    const subs={...(drive?.subs||{})};
    for(const[k,label]of PROMS_SUBS){if(!subs[k]){const d=await driveCall({action:'createSingleFolder',parentFolderId:root.folderId,name:label});subs[k]=d.folderId}}
    drive={rootId:root.folderId,rootKey:root.key||'proms',rootLink:folderUrl(root.folderId),subs,named:drive?.named||{}};
    await savePm(pid,{drive});return drive;
  });
}
// per-document sub-folder, e.g. CS/P-2627-07/01 under "03. Quotations", PO no. under "04. Purchase Orders"
function ensureSubFolder(pid,kind,sub){
  return oneAtATime('sub_'+pid+kind+sub,async()=>{
    const drive=await ensureProMsFolders(pid);if(!sub)return drive.subs[kind];
    const key=kind+'__'+safeName(sub).replace(/\s+/g,'_');const have=pmProj(pid).drive?.named?.[key];if(have)return have;
    const d=await driveCall({action:'createSingleFolder',parentFolderId:drive.subs[kind],name:safeName(sub)});
    await savePm(pid,{drive:{named:{[key]:d.folderId}}});
    pmBase[pid]={...(pmBase[pid]||{}),drive:{...(pmBase[pid]?.drive||{}),named:{...(pmBase[pid]?.drive?.named||{}),[key]:d.folderId}}};
    return d.folderId;
  });
}
const toBase64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
// upload a File/Blob into ProMS/<kind>[/<sub>]
async function uploadToProms(file,pid,kind,opts={}){
  if(!file)return null;
  if(file.size>MAX_UPLOAD_BYTES)throw new Error('File exceeds 15MB limit');
  const folderId=await ensureSubFolder(pid,kind,opts.sub);
  const base=opts.name||file.name||'file';const fileName=opts.tag&&!opts.name?`${opts.tag} - ${base}`:base;
  const data=await driveCall({action:'uploadProjectDoc',fileName,mimeType:file.type||opts.mime||'application/octet-stream',fileBase64:await toBase64(file),targetFolderId:folderId,uploadedByName:myName()});
  const rec={fileName:data.fileName||fileName,webViewLink:data.webViewLink||'',uploadedBy:me(),uploadedByName:myName(),uploadedAt:nowIso(),sizeKB:Math.round((data.sizeBytes||file.size||0)/1024),source:'ProMS'};
  const drive=pmProj(pid).drive;
  if(drive?.rootKey&&drive.rootKey!=='proms_legacy'&&!opts.noRegister){try{await db.collection(PROJ_COL).doc(pid).update({[`projectDocuments.${drive.rootKey}`]:firebase.firestore.FieldValue.arrayUnion(rec)})}catch(e){console.warn('PMO doc register failed',e)}}
  return rec;
}
// JSON snapshot (a complete, human-readable copy of a record) into Drive
function snapshotToDrive(pid,kind,sub,fileName,obj){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  return uploadToProms(blob,pid,kind,{sub,name:fileName,mime:'application/json',noRegister:true});
}
// compatibility wrapper
function uploadToProcurementFolder(file,pid,tag){return uploadToProms(file,pid,/pca/i.test(tag||'')?'pca':/boq/i.test(tag||'')?'boq':'quotes',{tag})}
// On release (or amendment release) file the PO in Drive: printable copy + JSON snapshot of this version
async function archivePoToDrive(poId){
  const po=poData.find(x=>x.id===poId);if(!po||po.status!=='RELEASED')return;
  const amd=po.amendmentNo||0;if((po.driveFiles||[]).some(f=>f.amd===amd))return;
  const base=`${safeName(po.poNumber)}${amd?' Amd '+amd:''}`;
  const html=poPrintHtml(po,undefined);
  const a=await uploadToProms(new Blob([html.html],{type:'text/html'}),po.projectId,'po',{sub:po.poNumber,name:base+' (print me to PDF).html',mime:'text/html',noRegister:true});
  const b=await snapshotToDrive(po.projectId,'po',po.poNumber,base+' - data snapshot.json',{po:{...po,driveFiles:undefined},archivedAt:nowIso(),archivedBy:me()});
  await db.collection(PM_PO).doc(poId).update({driveFiles:firebase.firestore.FieldValue.arrayUnion(clean({amd,at:nowIso(),by:me(),print:a.webViewLink,snapshot:b.webViewLink,folder:folderUrl(pmProj(po.projectId).drive?.named?.['po__'+safeName(po.poNumber).replace(/\s+/g,'_')]||'')}))});
}
function readWorkbook(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>{try{res(XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true}))}catch(err){rej(err)}};r.onerror=rej;r.readAsArrayBuffer(file)})}

// PERSISTENCE HELPERS
// ═══════════════════════════════════════════════════════════════════════
async function savePm(pid,patch,action){
  const p=projectById(pid);patch={...patch};
  // BOQ and PCA are stored as their own documents (each well under Firestore's 1 MiB limit)
  const heavy=[];
  if('boq' in patch){heavy.push(db.collection(PM_DATA).doc(pid+'_boq').set(clean({projectId:pid,kind:'boq',items:patch.boq||[],updatedAt:nowIso(),updatedBy:me()})));delete patch.boq}
  if('pca' in patch){heavy.push(db.collection(PM_DATA).doc(pid+'_pca').set(clean({projectId:pid,kind:'pca',pca:patch.pca||null,updatedAt:nowIso(),updatedBy:me()})));delete patch.pca}
  const data={...patch,projectId:pid,projectNumber:p?.number||'',projectName:p?.name||'',updatedAt:nowIso(),updatedBy:me()};
  if(action)data.audit=firebase.firestore.FieldValue.arrayUnion(audit(null,action));
  await Promise.all([...heavy,db.collection(PM_PROJ).doc(pid).set(data,{merge:true})]);
}

}

async function handleBoqFile(input){
  const f=input.files[0];if(!f||!activeProjectId)return;
  try{
    const wb=await readWorkbook(f);const items=parseBoqWorkbook(wb);
    if(!items.length)return showToast('No item rows found. Need a header row with Description and Qty columns.','error');
    const pm=pmProj(activeProjectId),existing=pm.boq||[];
    let mode='replace';
    if(existing.length){
      const ordered=orderedByBoq(activeProjectId);const locked=existing.filter(b=>ordered[b.id]);
      const ans=prompt(`BOQ already has ${existing.length} lines${locked.length?` (${locked.length} already ordered — these are always kept)`:''}.\nType A to APPEND the ${items.length} new lines, or R to REPLACE un-ordered lines:`,'A');
      if(!ans)return;mode=/^r/i.test(ans)?'replace':'append';
    }
    let fresh=items.map(it=>({...it,id:uid('b')}));
    fresh=autoMatch(fresh,pm.pca);
    let boq;
    if(mode==='append')boq=[...existing,...fresh];
    else{const ordered=orderedByBoq(activeProjectId);boq=[...existing.filter(b=>ordered[b.id]),...fresh]}
    showLoad('Saving BOQ…');
    await savePm(activeProjectId,{boq,boqFile:f.name,boqUploadedAt:nowIso()},`BOQ ${mode==='append'?'appended':'uploaded'}: ${items.length} lines from ${f.name}`);
    uploadToProms(f,activeProjectId,'boq',{tag:'BOQ'}).catch(e=>console.warn('BOQ drive copy skipped:',e.message));
    hideLoad();projSubTab='boq';renderProject();showToast(`${items.length} BOQ lines saved`);
  }catch(e){hideLoad();console.error(e);showToast('BOQ upload failed: '+e.message,'error')}
}

async function saveBoqLine(){

async function deleteBoqLine(id){

  if(orderedByBoq(activeProjectId)[id])return showToast('Line already has POs — cannot delete','error');
  if(csData.some(c=>c.projectId===activeProjectId&&c.status!=='CANCELLED'&&(c.items||[]).some(i=>i.boqId===id)))return showToast('Line is used in an open comparison — cancel that first','error');
  if(!confirm('Delete BOQ line “'+b.description+'”?'))return;
  await savePm(activeProjectId,{boq:pm.boq.filter(x=>x.id!==id)},`BOQ line deleted: ${b.description}`);

async function setBoqLink(id,key){
  const pm=pmProj(activeProjectId);const boq=(pm.boq||[]).map(b=>b.id===id?{...b,pcaKey:key,matchMode:key?'manual':'',matchScore:key?1:0}:b);

async function rematchBoq(){

  const over=confirm('Re-run auto-link for ALL lines?\nOK = overwrite existing links · Cancel = only fill unlinked lines');
  const boq=autoMatch(pm.boq||[],pm.pca,over).map(b=>b.matchMode==='manual'&&!over?b:b);
  await savePm(activeProjectId,{boq},`BOQ auto-linked to PCA (${over?'overwrite':'fill blanks'}) — ${boq.filter(b=>b.pcaKey).length}/${boq.length} linked`);showToast('Auto-link done');

function exportBoq(pid){

    </div>

async function confirmPca(){

    const version=(pm.pca?.version||0)+1;

// ═══════════════════════════════════════════════════════════════════════
// QUOTATIONS / COMPARATIVE STATEMENT (CS)
// Value comparison is ex-GST landed INR (basic − discount + freight) × FX,
// because GST is recoverable as ITC. Only quotes covering every line are
// eligible to be overall L1.
// ═══════════════════════════════════════════════════════════════════════
function openSubModal(html){closeSubModal();const d=document.createElement('div');d.id='subModal';d.className='modal';d.style.zIndex=6000;d.innerHTML=`<div class="dialog narrow">${html}</div>`;d.onclick=e=>{if(e.target===d)closeSubModal()};document.body.appendChild(d)}
function closeSubModal(){el('subModal')?.remove()}
function vendorById(id){return vendorsData.find(v=>v.id===id)}
function quoteLine(q,boqId){return(q.rates||{})[boqId]||{}}
function quoteTotals(q,items){
  let basic=0,quoted=0;
  items.forEach(it=>{const r=quoteLine(q,it.boqId);if(num(r.rate)>0){quoted++;basic+=num(it.qty)*num(r.rate)*(1-num(r.discPct)/100)}});
  basic=r2(basic);const freight=r2(num(q.freight)),fx=num(q.fxRate)||1,gst=(q.currency||'INR')==='INR'?r2((basic+freight)*num(q.gstPct)/100):0;
  return{basic,freight,gst,grand:r2(basic+freight+gst),landedInr:r2((basic+freight)*fx),complete:quoted===items.length&&items.length>0,quoted};
}
function csAnalysis(cs){
  const items=cs.items||[],quotes=(cs.quotes||[]).filter(q=>q.vendorName||q.vendorId);
  const totals={};quotes.forEach(q=>totals[q.id]=quoteTotals(q,items));
  const eligible=quotes.filter(q=>totals[q.id].complete);
  let l1=null;eligible.forEach(q=>{if(!l1||totals[q.id].landedInr<totals[l1.id].landedInr)l1=q});
  const lineL1={};items.forEach(it=>{let best=null,bv=Infinity;quotes.forEach(q=>{const r=quoteLine(q,it.boqId);if(num(r.rate)>0){const v=num(r.rate)*(1-num(r.discPct)/100)*(num(q.fxRate)||1);if(v<bv){bv=v;best=q.id}}});lineL1[it.boqId]=best});
  return{quotes,totals,l1Id:l1?.id||'',lineL1,validCount:eligible.length};
}

function projQuotes(p,pm,list){

    return`<tr><td><b>${esc(c.csNo||'')}</b><div class="muted">${esc(c.title||'')}</div></td><td class="num">${(c.items||[]).length}</td><td class="num">${a.quotes.length}${a.quotes.length<MIN_QUOTES?' <span class="flag">!</span>':''}</td>
      <td>${l1?esc(l1.vendorName)+'<div class="muted">'+inr(a.totals[l1.id].landedInr)+'</div>':'-'}</td><td>${sel?esc(sel.vendorName)+(sel.id!==a.l1Id?' <span class="badge s-warn">not L1</span>':''):'-'}</td>
      <td>${statusBadge(c.status,CS_STATUS)}</td><td>${fmtDate(c.createdAt)}<div class="muted">${esc(userLabel(c.createdBy))}</div></td>
      <td><div class="btn-row"><button class="btn sm" onclick="openCsEditor('${c.id}')"><i class="ti ${c.status==='OPEN'&&isBuyer()?'ti-edit':'ti-eye'}"></i>${c.status==='OPEN'&&isBuyer()?'Edit':'View'}</button>
        ${c.status==='FINALIZED'&&isBuyer()?`<button class="btn sm primary" onclick="startPoFromCs('${c.id}')"><i class="ti ti-file-plus"></i>Raise PO</button>`:''}
        <button class="btn sm" onclick="printCS('${c.id}')" title="Print comparative statement"><i class="ti ti-printer"></i></button></div></td></tr>`}).join('');
  const pending=(pm.boq||[]).filter(b=>boqBalance(p.id,b)>0).length;
  return`<div class="card"><div class="card-header"><span>Quotation comparisons (min. ${MIN_QUOTES} quotes per purchase)</span>

    ${!(pm.boq||[]).length?'<div class="notice info"><i class="ti ti-info-circle"></i><div>Upload the BOQ first — comparisons are built from BOQ lines.</div></div>':`<div class="muted" style="margin-bottom:8px">${pending} BOQ line(s) still have balance quantity to order.</div>`}
    ${rows?`<div class="table-wrap"><table><thead><tr><th>CS No.</th><th class="num">Items</th><th class="num">Quotes</th><th>L1 (ex-GST landed)</th><th>Selected vendor</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No comparisons yet</div>'}</div>`;
}

function blankQuote(){return{id:uid('q'),vendorId:'',vendorName:'',ref:'',date:today(),validity:'',currency:'INR',fxRate:1,payTerms:'',delivery:'',warranty:'',freight:0,gstPct:num(settings.defaultGstPct)||18,remarks:'',rates:{}}}

    ${!ed?`<div class="notice info"><i class="ti ti-lock"></i><div>Status: <b>${esc(CS_STATUS[c.status]||c.status)}</b> — read-only.${c.status==='FINALIZED'&&isBuyer()?' <a href="#" onclick="reopenCs();return false">Re-open for changes</a>':''}</div></div>`:''}

function csNoticeHtml(a){return a.validCount<MIN_QUOTES?`<div class="notice warn"><i class="ti ti-alert-triangle"></i><div>${a.validCount} of ${MIN_QUOTES} required complete quotes (every line priced). You can still finalise with a written justification — it is shown to approvers on the PO.</div></div>`:''}
function csFootHtml(c,a,totRow){totRow=totRow||(k=>c.quotes.map(q=>{const t=a.totals[q.id];return`<td class="num ${k==='landedInr'&&q.id===a.l1Id?'l1':''}">${t?(k==='landedInr'?inr(t[k]):fmt(t[k],2)):'-'}</td>`}).join(''));

  <tr><td colspan="3" class="right muted">Lines quoted</td>${c.quotes.map(q=>{const t=a.totals[q.id];return`<td class="num muted">${t?t.quoted+'/'+c.items.length:'-'}</td>`}).join('')}</tr>`}
function csRefreshCalc(){

function csAttach(qi,input){const f=input.files[0];if(!f)return;if(f.size>MAX_UPLOAD_BYTES)return showToast('File exceeds 15MB','error');window._csFiles=window._csFiles||{};window._csFiles[csDraft.quotes[qi].id]=f;csDraft.quotes[qi]._fileName=f.name;renderCsEditor()}

function csRemoveQuote(qi){if(!confirm('Remove this quote column?'))return;const q=csDraft.quotes[qi];if(csDraft.selectedQuoteId===q.id)csDraft.selectedQuoteId='';csDraft.quotes.splice(qi,1);renderCsEditor()}
async function nextCsNo(pid){const p=projectById(pid);const n=csData.filter(c=>c.projectId===pid).length+1;return`CS/${p?.number||'NA'}/${String(n).padStart(2,'0')}`}
async function saveCs(finalize){
  const c=csDraft,a=csAnalysis(c);
  const named=c.quotes.filter(q=>q.vendorId);
  if(c.quotes.some(q=>!q.vendorId&&Object.values(q.rates||{}).some(r=>num(r.rate)>0)))return showToast('Pick a vendor for every quote that has rates','error');
  const ids=named.map(q=>q.vendorId);if(new Set(ids).size!==ids.length)return showToast('Same vendor entered twice — each quote must be from a different vendor','error');
  if(finalize){
    const sel=c.quotes.find(q=>q.id===c.selectedQuoteId);
    if(!sel)return showToast('Select the vendor to finalise','error');
    if(!a.totals[sel.id]?.complete)return showToast('Selected quote must price every line','error');
    if(!sel.ref)return showToast('Enter the selected vendor’s quotation reference','error');
    if((sel.id!==a.l1Id||a.validCount<MIN_QUOTES)&&String(c.justification||'').trim().length<15)return showToast('Write a justification (min. 15 characters)','error');
  }
  showLoad(finalize?'Finalising…':'Saving…');
  try{
    if(!c.csNo&&!c.id)c.csNo=await nextCsNo(c.projectId);
    for(const q of c.quotes){const f=window._csFiles?.[q.id];if(f){try{const rec=await uploadToProms(f,c.projectId,'quotes',{sub:c.csNo||c.id,tag:`Quote ${q.vendorName||''} ${q.ref||''}`.trim()});q.attachment={fileName:rec.fileName,webViewLink:rec.webViewLink}}catch(e){showToast('Quote file not uploaded: '+e.message,'error')}delete window._csFiles[q.id]}delete q._fileName}
    c.quotes=c.quotes.filter(q=>q.vendorId||Object.keys(q.rates||{}).length);
    const sel=c.quotes.find(q=>q.id===c.selectedQuoteId);
    const data={projectId:c.projectId,projectNumber:projectById(c.projectId)?.number||'',projectName:projectById(c.projectId)?.name||'',title:c.title,items:c.items,quotes:c.quotes,

    else{data.csNo=c.csNo||await nextCsNo(c.projectId);data.status=data.status||'OPEN';data.createdAt=nowIso();data.createdBy=me();data.poIds=[];data.audit=[audit(null,'Comparison created: '+c.title),audit(null,act)];const ref=await db.collection(PM_CS).add(data);c.id=ref.id;c.csNo=data.csNo}

async function reopenCs(){const c=csDraft;if(!confirm('Re-open this comparison for edits? Vendor selection will be cleared.'))return;

function fyOf(dateStr){const d=new Date(dateStr||today());const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return`${String(y).slice(2)}-${String(y+1).slice(2)}`}
async function nextPoNumber(dateStr){
  const fy=fyOf(dateStr),ref=db.collection(PM_CNT).doc('po_'+fy.replace('-',''));
  const seq=await db.runTransaction(async tx=>{const d=await tx.get(ref);const n=(d.exists?num(d.data().seq):0)+1;tx.set(ref,{seq:n,fy,updatedAt:nowIso(),updatedBy:me()},{merge:true});return n});
  return`${settings.poPrefix||'DQAP/PO'}/${fy}/${String(seq).padStart(4,'0')}`;
}
function startPoFromCs(csId){
  const cs=csData.find(c=>c.id===csId);if(!cs)return;const q=(cs.quotes||[]).find(x=>x.id===cs.selectedQuoteId);if(!q)return showToast('No finalised vendor on this comparison','error');
  const pid=cs.projectId,p=projectById(pid),v=vendorById(q.vendorId)||{};
  const lines=cs.items.map(it=>{const b=boqItem(pid,it.boqId)||{},r=quoteLine(q,it.boqId),bal=boqBalance(pid,b);
    return{boqId:it.boqId,pcaKey:b.pcaKey||it.pcaKey||'',description:it.description,make:it.make||'',unit:it.unit||'Nos',hsn:b.hsn||'',qty:Math.max(0,Math.min(num(it.qty),bal)),rate:num(r.rate),discPct:num(r.discPct),gstPct:num(q.gstPct)}}).filter(l=>l.qty>0);
  if(!lines.length)return showToast('Nothing left to order on this comparison — BOQ balance is zero','error');
  const foreign=(q.currency||'INR')!=='INR';
  poDraft={id:null,csId,csNo:cs.csNo,projectId:pid,vendorId:q.vendorId,vendorName:q.vendorName,quoteRef:q.ref,quoteDate:q.date,currency:q.currency||'INR',fxRate:foreign?num(q.fxRate)||1:1,
    orderType:'PURCHASE',poDate:today(),lines,freight:num(q.freight),freightGstPct:num(q.gstPct),otherCharges:0,otherChargesLabel:'',
    paymentTerms:q.payTerms||v.defaultPayTerms||'',deliveryPeriod:q.delivery||'',warranty:q.warranty||'',priceBasis:foreign?'CIF / as per quotation':'F.O.R. site, inclusive of packing & forwarding',freightTerms:num(q.freight)?'Extra as above':'Inclusive',
    insurance:'Vendor’s scope till delivery at site',inspection:'At site on receipt',shipTo:[p?.name,projSites(p)].filter(Boolean).join(', '),billTo:settings.billTo||`${settings.company.name}\n${settings.company.address}`,
    contactPerson:myName(),specialNotes:'',tnc:[...(settings.tnc||[])],overPcaJustification:'',shipState:settings.company.state||'',scope:'',priceVariation:'Not Applicable',deliveryFrom:'',deliveryTo:'',orderExpiry:'',specialTerms:[]};
  closeModal();renderPoEditor();
}
function poCalc(d){
  const foreign=(d.currency||'INR')!=='INR',v=vendorById(d.vendorId)||{};
  const pos=d.shipState||settings.company.state||'';const inter=!foreign&&norm(v.state||'')&&norm(pos)&&norm(v.state)!==norm(pos);
  let basic=0,tax=0;const taxBy={};
  (d.lines||[]).forEach(l=>{const amt=r2(num(l.qty)*lineNetRate(l));l.amount=amt;basic+=amt;if(!foreign){const t=amt*num(l.gstPct)/100;tax+=t;taxBy[num(l.gstPct)]=(taxBy[num(l.gstPct)]||0)+t}});
  const ft=foreign?0:num(d.freight)*num(d.freightGstPct)/100,ot=foreign?0:num(d.otherCharges)*num(d.freightGstPct)/100;tax+=ft+ot;if(ft+ot)taxBy[num(d.freightGstPct)]=(taxBy[num(d.freightGstPct)]||0)+ft+ot;
  basic=r2(basic);tax=r2(tax);const taxable=r2(basic+num(d.freight)+num(d.otherCharges));
  return{basic,taxable,gst:tax,igst:inter?tax:0,cgst:!inter&&!foreign?r2(tax/2):0,sgst:!inter&&!foreign?r2(tax/2):0,interState:!!inter,taxBy,grand:r2(taxable+tax)};
}
function poTotalsHtml(d,t){const c=d.currency;const m=x=>c==='INR'?inr2(x):c+' '+fmt(x,2);

  <div class="detail-item"><div class="lbl">${c!=='INR'?'GST':t.interState?'IGST':'CGST + SGST'}</div><div class="val">${c!=='INR'?'N/A (import)':m(t.gst)}</div></div><div class="detail-item"><div class="lbl">Grand total</div><div class="val strong">${m(t.grand)}</div></div>
  ${c!=='INR'?`<div class="detail-item"><div class="lbl">INR equivalent (ex-duty)</div><div class="val">${inr(t.taxable*(num(d.fxRate)||1))}</div></div>`:''}</div>`}
function pcaPanelHtml(chk){

    <b>${chk.overPca?`PCA check: EXCEEDS PCA — ${chk.flags.length} flag(s), excess ≈ ${inr(chk.overAmt)}. Needs Updesh's approval after Pratim.`:'PCA check: within PCA. Needs Pratim’s approval.'}</b>
    ${chk.flags.length?`<ul style="margin:6px 0 0 18px">${chk.flags.map(f=>`<li>${esc(f.msg)}</li>`).join('')}</ul>`:''}
    <div class="muted" style="margin-top:6px">Project procurement: ordered before ${inr(b.orderedBefore)} + this PO ${inr(b.thisPo)} = ${inr(b.after)} vs PCA budget ${inr(b.procBudget)}${chk.tolerancePct?` (tolerance ${chk.tolerancePct}%)`:''}</div></div></div>`;

function poRecalc(){const d=poDraft;if(!d)return;const t=poCalc(d);
  const chk=evaluatePca(d.projectId,d.lines,{fxRate:d.fxRate,currency:d.currency,excludePoId:d.id,thisPoValueInr:(t.basic+num(d.freight)+num(d.otherCharges))*(num(d.fxRate)||1)});d._chk=chk;
  el('poTotals').innerHTML=poTotalsHtml(d,t);el('poPcaPanel').innerHTML=pcaPanelHtml(chk);el('poJustWrap').style.display=chk.overPca?'':'none';
  clearTimeout(window._poRr);window._poRr=setTimeout(()=>{if(!poDraft)return;const a=document.activeElement;const idx=a&&a.closest?[...document.querySelectorAll('#poBody input,#poBody textarea')].indexOf(a):-1;const pos=a?.selectionStart;renderPoEditor();if(idx>=0){const n=document.querySelectorAll('#poBody input,#poBody textarea')[idx];if(n){n.focus();try{if(pos!=null)n.setSelectionRange(pos,pos)}catch(e){}}}},700);
}
function validatePoDraft(d){
  if(!d.lines.length)return'PO has no lines';
  for(const l of d.lines){if(num(l.qty)<=0)return`Qty must be > 0 for “${l.description}”`;const b=boqItem(d.projectId,l.boqId);if(b){const bal=boqBalance(d.projectId,b,d.id);if(num(l.qty)>bal+1e-9)return`Qty for “${l.description}” exceeds BOQ balance ${fmt(bal,2)}`}}
  if(!d.poDate)return'PO date required';if(!d.paymentTerms)return'Payment terms required';if(!d.deliveryPeriod)return'Delivery period required';if(!String(d.shipTo||'').trim())return'Delivery address required';
  if(d.currency!=='INR'&&num(d.fxRate)<=1)return'Enter the exchange rate for the foreign-currency PO';

function revisePO(id){

  const doc=buildPoDoc(d);

  showLoad('Submitting PO…');
  try{
    doc.status='PENDING_PRATIM';doc.submittedAt=nowIso();doc.submittedBy=me();doc.submittedByName=myName();doc.approvals=[];doc.amendmentNo=0;doc.amendmentDate='';
    if(d.id){

      doc.revisionHistory=firebase.firestore.FieldValue.arrayUnion(clean({revision:old?.revision||0,grand:old?.totals?.grand||0,status:old?.status,rejectedReason:old?.rejectedReason||'',at:nowIso()}));
      doc.audit=firebase.firestore.FieldValue.arrayUnion(audit(null,`Revised & resubmitted (Rev ${doc.revision}) — ${inr(doc.totals.grand)}${doc.pcaCheck.overPca?' — OVER PCA':''}`));

      const ref=await db.collection(PM_PO).add(doc);

function startAmendment(id){
  const po=poData.find(x=>x.id===id);if(!po)return;
  if(po.status!=='RELEASED')return showToast('Only a released PO can be amended (another change may already be pending)','error');
  poDraft=clean({...po,id:po.id,amendOf:po.id,amendReason:'',specialTerms:po.specialTerms||[],cancelledLines:po.cancelledLines||[],scope:po.scope||'',shipState:po.shipState||settings.company.state,priceVariation:po.priceVariation||'Not Applicable'});
  ['pcaCheck','audit','approvals','revisionHistory','amendments','pendingAmendment'].forEach(k=>delete poDraft[k]);
  closeModal();renderPoEditor();
}
function addAmendLineModal(){
  const d=poDraft,pid=d.projectId,pm=pmProj(pid),have=new Set(d.lines.map(l=>l.boqId));
  const opts=(pm.boq||[]).filter(b=>!have.has(b.id)&&boqBalance(pid,b,d.id)>0);

    ${opts.length?`<div class="form-group"><label>BOQ item (with balance qty)</label><select id="alBoq">${opts.map(b=>`<option value="${b.id}">${esc(b.description)} — bal ${fmt(boqBalance(pid,b,d.id),2)} ${esc(b.unit)}</option>`).join('')}</select></div>
    <div class="form-row"><div class="form-group"><label class="req">Qty</label><input id="alQty" type="number" step="any"></div><div class="form-group"><label class="req">Rate (${esc(d.currency)})</label><input id="alRate" type="number" step="any"></div><div class="form-group"><label>Disc %</label><input id="alDisc" type="number" step="any" value="0"></div><div class="form-group"><label>GST %</label><input id="alGst" type="number" step="any" value="${(d.lines[0]?.gstPct)??num(settings.defaultGstPct)}"></div></div>
    <div class="notice warn"><i class="ti ti-info-circle"></i><div>Items added by amendment should be backed by a vendor quotation/offer; attach it to the project’s Procurement folder and mention it in the amendment reason.</div></div>
    <div class="btn-row" style="justify-content:flex-end"><button class="btn" onclick="closeSubModal()">Cancel</button><button class="btn primary" onclick="addAmendLine()">Add</button></div>`:'<div class="empty">No other BOQ lines have balance quantity.</div>'}</div>`);
}
function addAmendLine(){
  const d=poDraft,b=boqItem(d.projectId,g('alBoq')),q=num(g('alQty')),r=num(g('alRate'));
  if(!b||q<=0||r<=0)return showToast('Item, qty and rate are required','error');
  if(q>boqBalance(d.projectId,b,d.id)+1e-9)return showToast('Qty exceeds BOQ balance','error');
  d.lines.push({boqId:b.id,pcaKey:b.pcaKey||'',description:b.description,make:b.make||'',unit:b.unit||'Nos',hsn:b.hsn||'',qty:q,rate:r,discPct:num(g('alDisc')),gstPct:num(g('alGst'))});
  closeSubModal();renderPoEditor();
}
function diffAmend(old,nw){
  const no=(old.amendmentNo||0)+1,changes=[],oldBy={},newBy={};
  (old.lines||[]).forEach(l=>oldBy[l.boqId]=l);(nw.lines||[]).forEach(l=>newBy[l.boqId]=l);
  const cancelled=[...(old.cancelledLines||[])];
  const lines=(nw.lines||[]).map(l=>{const o=oldBy[l.boqId];
    if(!o){changes.push(`Added: ${l.description} × ${fmt(l.qty,2)} ${l.unit||''} @ ${fmt(lineNetRate(l),2)}`);return{...l,amendNo:no,history:[]}}
    const same=num(o.qty)===num(l.qty)&&num(o.rate)===num(l.rate)&&num(o.discPct)===num(l.discPct)&&num(o.gstPct)===num(l.gstPct)&&(o.hsn||'')===(l.hsn||'')&&o.description===l.description&&(o.make||'')===(l.make||'');
    if(same)return{...l,amendNo:o.amendNo||0,history:o.history||[]};
    const parts=[];if(num(o.qty)!==num(l.qty))parts.push(`qty ${fmt(o.qty,2)} → ${fmt(l.qty,2)}`);
    if(num(o.rate)!==num(l.rate)||num(o.discPct)!==num(l.discPct))parts.push(`net rate ${fmt(lineNetRate(o),2)} → ${fmt(lineNetRate(l),2)}`);
    if(num(o.gstPct)!==num(l.gstPct))parts.push(`GST ${fmt(o.gstPct,1)}% → ${fmt(l.gstPct,1)}%`);if(!parts.length)parts.push('details updated');
    changes.push(`${l.description}: ${parts.join(', ')}`);
    return{...l,amendNo:no,history:[...(o.history||[]),{amendNo:o.amendNo||0,qty:o.qty,rate:o.rate,discPct:o.discPct||0,gstPct:o.gstPct}]}});
  (old.lines||[]).forEach(o=>{if(!newBy[o.boqId]){changes.push(`Cancelled: ${o.description} (was ${fmt(o.qty,2)} ${o.unit||''})`);cancelled.push({...o,cancelledInAmend:no})}});
  [['paymentTerms','Payment terms'],['deliveryPeriod','Delivery period'],['deliveryFrom','Delivery from'],['deliveryTo','Delivery by'],['warranty','Warranty'],['priceBasis','Delivery terms'],['freightTerms','Freight terms'],['insurance','Insurance'],['inspection','Inspection'],['shipTo','Delivery address'],['shipState','Delivery state'],['billTo','Bill-to'],['scope','Scope'],['priceVariation','Price variation'],['orderExpiry','Order expiry'],['specialNotes','Special instructions'],['contactPerson','Contact person']].forEach(([k,lbl])=>{
    const a=String(old[k]||''),b=String(nw[k]||'');if(a!==b)changes.push(`${lbl} changed`+(a.length<70&&b.length<70?`: “${a||'-'}” → “${b||'-'}”`:''))});
  if(num(old.freight)!==num(nw.freight))changes.push(`Freight ${fmt(old.freight,2)} → ${fmt(nw.freight,2)}`);
  if(num(old.otherCharges)!==num(nw.otherCharges))changes.push(`Other charges ${fmt(old.otherCharges,2)} → ${fmt(nw.otherCharges,2)}`);
  if(num(old.fxRate)!==num(nw.fxRate))changes.push(`Exchange rate ${old.fxRate} → ${nw.fxRate}`);
  if(JSON.stringify(old.specialTerms||[])!==JSON.stringify(nw.specialTerms||[]))changes.push('Special terms & conditions changed');
  return{changes,lines,cancelledLines:cancelled,no};
}
async function submitAmendment(){
  const d=poDraft,old=poData.find(x=>x.id===d.amendOf);if(!old)return showToast('Original PO not found','error');
  if(old.status!=='RELEASED')return showToast('This PO is no longer in Released state','error');
  const err=validatePoDraft(d);if(err)return showToast(err,'error');
  const reason=String(d.amendReason||'').trim();if(reason.length<10)return showToast('Enter the reason for amendment (min. 10 characters)','error');
  const nw=buildPoDoc(d),df=diffAmend(old,nw);
  if(!df.changes.length)return showToast('Nothing has changed — no amendment needed','error');
  if(nw.pcaCheck.overPca&&String(d.overPcaJustification||'').trim().length<15)return showToast('Over-PCA justification required (min. 15 characters)','error');
  if(!confirm(`Submit Amendment ${df.no} on ${old.poNumber}?\nValue ${inr2(old.totals.grand)} → ${inr2(nw.totals.grand)}\n${df.changes.length} change(s)\n${nw.pcaCheck.overPca?'⚠ Over PCA — Pratim → Updesh':'Within PCA — Pratim'}`))return;
  showLoad('Submitting amendment…');
  try{
    const p={};PO_VERSION_FIELDS.forEach(k=>{if(nw[k]!==undefined)p[k]=nw[k]});
    Object.assign(p,{lines:df.lines,cancelledLines:df.cancelledLines,amendmentNo:df.no,amendmentDate:today(),poDate:old.poDate,vendorSnapshot:old.vendorSnapshot||nw.vendorSnapshot,companySnapshot:old.companySnapshot||nw.companySnapshot,
      reason,changes:df.changes,valueBefore:old.totals.grand,valueAfter:nw.totals.grand,requestedBy:me(),requestedByName:myName(),requestedAt:nowIso(),approvals:[]});
    await db.collection(PM_PO).doc(old.id).update({status:'AMEND_PRATIM',pendingAmendment:clean(p),updatedAt:nowIso(),
      audit:firebase.firestore.FieldValue.arrayUnion(audit(null,`Amendment ${df.no} submitted — ${inr(old.totals.grand)} → ${inr(nw.totals.grand)}${nw.pcaCheck.overPca?' — OVER PCA':''} — ${reason}`))});
    poDraft=null;closeModal();hideLoad();showToast(`Amendment ${df.no} submitted for approval`);renderAll(true);
  }catch(e){hideLoad();console.error(e);showToast('Submit failed: '+e.message,'error')}
}
// patch applied when the final approver releases a pending amendment
function amendmentApplyPatch(po,remarks,level){
  const p=po.pendingAmendment;const before={};PO_VERSION_FIELDS.forEach(k=>{if(po[k]!==undefined)before[k]=po[k]});
  const apprNames=[...(p.approvals||[]).map(a=>a.byName),myName()].filter((x,i,a)=>a.indexOf(x)===i).join(', ');
  const rec=clean({no:p.amendmentNo,date:p.amendmentDate,reason:p.reason,changes:p.changes,valueBefore:p.valueBefore,valueAfter:p.valueAfter,requestedBy:p.requestedBy,requestedByName:p.requestedByName,requestedAt:p.requestedAt,approvedAt:nowIso(),approvedByNames:apprNames,before});
  const patch={status:'RELEASED',pendingAmendment:null,amendmentNo:p.amendmentNo,amendmentDate:p.amendmentDate,updatedAt:nowIso(),
    amendments:firebase.firestore.FieldValue.arrayUnion(rec),
    approvals:firebase.firestore.FieldValue.arrayUnion(clean({level,by:me(),byName:myName(),at:nowIso(),remarks:remarks||'',forAmend:p.amendmentNo}))};
  PO_VERSION_FIELDS.forEach(k=>{if(k!=='amendmentNo'&&k!=='amendmentDate'&&p[k]!==undefined)patch[k]=clean(p[k])});

}

function poStatusStamp(po,isOld){
  if(isOld)return['SUPERSEDED','#8D6E63','SUPERSEDED'];
  const st=po.status;
  if(st==='RELEASED'||st==='AMEND_PRATIM'||st==='AMEND_UPDESH')return['AUTHORISED','#1B5E20',''];
  if(st==='PENDING_PRATIM'||st==='PENDING_UPDESH')return['PENDING APPROVAL','#E65100','NOT APPROVED'];
  if(st==='REJECTED')return['REJECTED','#B71C1C','REJECTED'];
  if(st==='CANCELLED')return['CANCELLED','#B71C1C','CANCELLED'];
  return['DRAFT','#546E7A',po.amendDraft?'AMENDMENT DRAFT':'DRAFT'];
}
// resolve which version of the PO to print: latest (default) or an earlier amendment number
function poVersionModel(po,ver){
  const cur=po.amendmentNo||0;
  if(ver!=null&&ver<cur){const a=(po.amendments||[]).find(x=>x.no===ver+1);if(a?.before)return{m:{...po,...a.before},isOld:true}}
  return{m:po,isOld:false};
}

function poPrintHtml(po,ver,style){

  const statDq=kv([['GST',esc(c.gstin||'')],['GST State',esc(c.state||'')],['PAN',esc(c.pan||'')]]);
  const statV=kv([['GST',esc(v.gstin||(foreign?'N/A (import)':''))],['GST State',esc(v.state||'')],['PAN',esc(v.pan||'')]]);
  const page1=`

    ${sec('Nature of Scope',`<div class="pad" style="padding:5px 7px;min-height:28px">${esc(m.scope||'').replace(/\n/g,'<br>')||'&nbsp;'}</div>`)}
    ${sec('Reason for Amendment',`<div class="pad" style="padding:5px 7px;min-height:34px">${cur?`<b>Amendment ${cur}${amdDate?' ('+fmtD(amdDate)+')':''}:</b> ${esc(reason)}${amdRec?.changes?.length?`<ul style="margin:3px 0 0 16px;padding:0">${amdRec.changes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}`:'<span class="small">Original issue — no amendment.</span>'}</div>`)}
    ${sec('Refer Annexure Details',`<div class="pad" style="padding:5px 7px">Delivery Schedule, Item-wise Tax Details${amds.length||po.amendDraft?', Amendment History':''}, General and Special Terms &amp; Conditions</div>`)}`;

  // ── material abstract ──
  const lines=m.lines||[];
  const rowsFor=(l,i)=>{
    const hist=(l.history||[]).map(h=>`<tr class="old"><td><span class="code">${i+1}</span> - <span class="strike">${esc(l.description)}</span> <span class="pill g">superseded</span><div class="small">HSN ${esc(l.hsn||'')} · was qty ${fmt(h.qty,2)} @ ${fmt(h.rate,2)}</div></td><td class="n">${h.amendNo||0}</td><td class="n strike">${fmt(h.qty,2)}</td><td class="n strike">${fmt(h.rate,2)}</td><td class="n strike">${fmt(lineNetRate(h),2)}</td>${foreign?'':`<td class="n">${fmt(h.gstPct,1)}%</td>`}<td class="n">0.00</td></tr>`).join('');
    const chg=cur&&(l.amendNo||0)===cur;

      <td class="n">${l.amendNo||0}</td><td class="n">${fmt(l.qty,2)}</td><td class="n">${fmt(l.rate,2)}</td><td class="n">${fmt(lineNetRate(l),2)}</td>${foreign?'':`<td class="n">${fmt(l.gstPct,1)}%</td>`}<td class="n"><b>${fmt(r2(num(l.qty)*lineGross(l,foreign)),2)}</b></td></tr>`;
    return hist+main;
  };
  const cancelled=(m.cancelledLines||[]).map(l=>`<tr class="old"><td><span class="strike">${esc(l.description)}</span> <span class="pill r">cancelled in Amd ${l.cancelledInAmend}</span><div class="small">HSN ${esc(l.hsn||'')} · was qty ${fmt(l.qty,2)} @ ${fmt(l.rate,2)}</div></td><td class="n">${l.cancelledInAmend}</td><td class="n strike">${fmt(l.qty,2)}</td><td class="n strike">${fmt(l.rate,2)}</td><td class="n strike">${fmt(lineNetRate(l),2)}</td>${foreign?'':`<td class="n">${fmt(l.gstPct,1)}%</td>`}<td class="n">0.00</td></tr>`).join('');
  const matTbl=`<table class="tbl"><thead><tr><th style="width:${foreign?50:44}%">Code - Description</th><th class="n" style="width:7%">Amend. No</th><th class="n" style="width:9%">Quantity</th><th class="n" style="width:11%">Basic Rate</th><th class="n" style="width:11%">Net Rate${foreign?'':' (ex-GST)'}</th>${foreign?'':'<th class="n" style="width:6%">GST</th>'}<th class="n" style="width:12%">Total Value${foreign?'':' (incl. GST)'}</th></tr></thead><tbody>${lines.map(rowsFor).join('')}${cancelled}</tbody></table>`;
  const grandRow=`<div class="words">In Words : ${foreign?esc(cur$)+' '+fmt(t.grand,2)+' only':amountInWords(t.grand)} <span style="float:right">Grand Total : ${fmt(t.grand,2)}</span></div>`;
  const abstract=sec(isSvc?'Service Abstract':'Material Abstract',matTbl+grandRow,'brk');

  // ── payment / pricing / essentials / quotation ──

  const payment=sec('Payment Terms',`<div class="pad" style="padding:5px 8px">${payLines.map((x,i)=>`<div><b>1.${i+1}</b> &nbsp; ${esc(x)}</div>`).join('')||'-'}</div>`);
  const prow=(k,val,b)=>`<tr><td${b?' style="font-weight:700"':''}>${esc(k)}</td><td class="n"${b?' style="font-weight:700"':''}>${val}</td></tr>`;
  const taxRows=foreign?'':(t.interState?Object.keys(t.taxBy||{}).map(r=>prow('IGST @ '+r+'%',fmt(t.taxBy[r],2))):Object.keys(t.taxBy||{}).flatMap(r=>[prow('CGST @ '+fmt(r/2,1)+'%',fmt(t.taxBy[r]/2,2)),prow('SGST @ '+fmt(r/2,1)+'%',fmt(t.taxBy[r]/2,2))])).join('');
  const pricing=sec('Pricing Details',`<table class="tbl"><thead><tr><th>Category</th><th class="n" style="width:22%">Value (${esc(cur$)})</th></tr></thead><tbody>

    ${prow('Taxable Value',fmt(t.taxable,2))}${taxRows}${prow('Grand Total',fmt(t.grand,2),true)}</tbody></table>`);
  const ess=[['Price Variation',m.priceVariation||'Not Applicable'],['Delivery Terms',m.priceBasis],['Freight',m.freightTerms],['Transit Insurance',m.insurance],['Inspection',m.inspection],['Warranty',m.warranty],['Order Expiry Date',m.orderExpiry?fmtD(m.orderExpiry):'-'],['Special Instructions',m.specialNotes]].filter(r=>r[1]);
  const essentials2=sec('Essentials Details',`<table class="tbl"><thead><tr><th style="width:36%">Attribute Details</th><th>Attribute Value</th></tr></thead><tbody>${ess.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table>`);
  const quote=sec('Quotation Details',`<table class="tbl"><thead><tr><th>Comparison (CS) No.</th><th>Vendor Quotation Ref</th><th>Quotation Date</th><th>BOQ Line</th></tr></thead><tbody>${lines.map((l,i)=>`<tr><td>${esc(po.csNo||'')}</td><td>${esc(po.quoteRef||'')}</td><td>${fmtD(po.quoteDate)}</td><td>${i+1} - ${esc(l.description).slice(0,60)}</td></tr>`).join('')}</tbody></table>`);

  // ── annexures ──
  const sched=lines.map((l,i)=>{const sch=l.schedule&&l.schedule.length?l.schedule:[{qty:l.qty,from:l.deliverFrom||m.deliveryFrom||m.poDate,to:l.deliverTo||m.deliveryTo,remarks:''}];
    const win=m.deliveryFrom||m.deliveryTo||l.deliverFrom||l.deliverTo?null:m.deliveryPeriod;
    return`<table class="tbl" style="margin-bottom:5px"><thead><tr><th>Code - Description</th><th class="n" style="width:12%">Quantity</th><th style="width:10%">UOM</th><th style="width:26%">Deliver Between</th></tr></thead><tbody>
      <tr><td><span class="code">${i+1}</span> - ${esc(l.description)}</td><td class="n">${fmt(l.qty,2)}</td><td>${esc(l.unit||'')}</td><td>${win?esc(win):fmtD(l.deliverFrom||m.deliveryFrom||m.poDate)+' to '+fmtD(l.deliverTo||m.deliveryTo)}</td></tr>
      <tr><td colspan="4" style="padding:0"><table style="width:100%"><thead><tr><th style="background:var(--pl2);color:var(--pd);font-size:7.7px;padding:2px 5px;text-align:left;width:22%">Schedule Number</th><th class="n" style="background:var(--pl2);color:var(--pd);font-size:7.7px;padding:2px 5px;width:14%">Quantity</th><th style="background:var(--pl2);color:var(--pd);font-size:7.7px;padding:2px 5px;text-align:left;width:30%">Deliver Between</th><th style="background:var(--pl2);color:var(--pd);font-size:7.7px;padding:2px 5px;text-align:left">Remarks</th></tr></thead><tbody>
      ${sch.map((s,k)=>`<tr><td style="padding:2px 5px">${k+1}</td><td class="n" style="padding:2px 5px">${fmt(s.qty,2)}</td><td style="padding:2px 5px">${win?esc(win):fmtD(s.from)+' to '+fmtD(s.to)}</td><td style="padding:2px 5px">${esc(s.remarks||'')}</td></tr>`).join('')}</tbody></table></td></tr></tbody></table>`}).join('');
  const annDelivery=sec('ANNEXURE : Delivery Schedule',sched,'brk');
  const taxLines=lines.map((l,i)=>{const amt=r2(num(l.qty)*lineNetRate(l)),tax=r2(amt*num(l.gstPct)/100);
    const comp=t.interState?`IGST ${fmt(l.gstPct,1)}%`:`CGST ${fmt(l.gstPct/2,1)}% + SGST ${fmt(l.gstPct/2,1)}%`;

  const extraTax=(num(m.freight)||num(m.otherCharges))?(()=>{const base=num(m.freight)+num(m.otherCharges),tax=r2(base*num(m.freightGstPct)/100);return`<tr><td>Freight / Other charges</td><td>${esc(v.state||'')}</td><td>${esc(m.shipState||c.state||'')}</td><td>${t.interState?'IGST '+fmt(m.freightGstPct,1)+'%':'CGST+SGST '+fmt(m.freightGstPct,1)+'%'}</td><td class="n">${fmt(base,2)}</td><td class="n">${fmt(tax,2)}</td></tr>`})():'';
  const annTax=foreign?'':sec('ANNEXURE : Item-wise Tax Details',`<table class="tbl"><thead><tr><th style="width:38%">Code - Description</th><th>Source</th><th>Destination</th><th>Tax Component</th><th class="n">Taxable Value</th><th class="n">Tax Value</th></tr></thead><tbody>${taxLines}${extraTax}<tr><td colspan="5" class="n"><b>Total Tax Value :</b></td><td class="n"><b>${fmt(t.gst,2)}</b></td></tr></tbody></table>`);
  const hist=[...amds].sort((a,b)=>a.no-b.no).filter(a=>!isOld||a.no<=cur);
  if(po.amendDraft)hist.push({no:cur,date:today(),reason:po._amendReason,valueBefore:po._valueBefore,valueAfter:t.grand,changes:po._changes||[]});
  const annAmend=hist.length?sec('ANNEXURE : Amendment History',`<table class="tbl"><thead><tr><th style="width:9%">Amend. No</th><th style="width:12%">Date</th><th>Reason &amp; changes</th><th class="n" style="width:15%">Value before</th><th class="n" style="width:15%">Value after</th></tr></thead><tbody>${hist.map(a=>`<tr><td class="n" style="text-align:left"><b>${a.no}</b></td><td>${fmtD(a.date)}</td><td>${esc(a.reason||'')}${(a.changes||[]).length?`<ul style="margin:2px 0 0 14px;padding:0">${a.changes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="small">${a.requestedByName?'Requested by '+esc(a.requestedByName):''}${a.approvedByNames?' · Approved by '+esc(a.approvedByNames):''}</div></td><td class="n">${fmt(a.valueBefore,2)}</td><td class="n">${fmt(a.valueAfter,2)}</td></tr>`).join('')}</tbody></table>`):'';
  const st=(m.specialTerms||[]).filter(x=>String(x.value||'').trim()||String(x.attr||'').trim());
  const stRows=st.map((x,i)=>`<tr><td style="width:5%">${i+1}</td><td style="width:24%"><b>${esc(x.attr||'')}</b></td><td>${esc(x.value||'').replace(/\n/g,'<br>')}</td></tr>`).join('');
  const annGeneral=(m.tnc||[]).length?sec('General Terms & Conditions',`<div style="padding:4px 8px"><ol class="terms">${m.tnc.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`):'';
  const annSpecial=sec('Special Terms & Conditions',`<table class="tbl"><thead><tr><th>No.</th><th>Heading</th><th>Terms specific to this order</th></tr></thead><tbody>${stRows||'<tr><td colspan="3" class="small">No special terms for this order.</td></tr>'}</tbody></table>${acc?.remarks&&accOk?`<div class="note"><b>Vendor acceptance remarks :</b> ${esc(acc.remarks)}</div>`:''}`);
  const annTerms=annGeneral+annSpecial+`<div class="note" style="margin-top:6px"><b>Note :</b> ${esc(settings.poNote||DEFAULT_SETTINGS.poNote)}</div>`;
  const approvals=(po.approvals||[]).filter(a=>(a.forAmend||0)<=cur).map(a=>`${esc(a.byName)} (${fmtD(a.at)})`).join(' · ');
  const signs=`<div class="sign"><div class="box">Vendor acceptance (sign &amp; seal)<br><span class="small">Name / Date :</span></div><div class="box" style="text-align:right">For <b>${esc(c.name)}</b><br><br>${esc(m.signatory||po.signatory||settings.signatory||'Authorised Signatory')}${approvals&&!isOld?`<div class="small">Approved electronically : ${approvals}</div>`:''}</div></div>`;
  const tail=`<div class="foot">This is a computer-generated ${isSvc?'Service':'Purchase'} Order issued from DQAP ProMS.</div>`;

  const body=page1+abstract+payment+pricing+essentials2+quote+annDelivery+annTax+annAmend+annTerms+signs+tail;
  const doc=`${wm?`<div class="wm">${wm}</div>`:''}<table class="frame"><thead><tr><td>${header}</td></tr></thead><tbody><tr><td>${body}</td></tr></tbody><tfoot><tr><td style="height:1px"></td></tr></tfoot></table>`;
  const css=(PO_PRINT_CSS+PO_VARIANT_CSS[style]).replace('${GEN}',gen.replace(/"/g,''));
  return{html:`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc((po.poNumber||(isSvc?'SO':'PO')).replace(/\//g,'_'))}${cur?'_Amd'+cur:''}</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>${css}</style></head><body class="v-${style}"><div class="toolbar"><button onclick="window.print()">Print / Save as PDF</button><span>${esc(po.poNumber||'')} · Amendment ${cur}${isOld?' (superseded version)':''}</span></div>${doc}</body></html>`,title:`${esc((po.poNumber||(isSvc?'SO':'PO')).replace(/\//g,'_'))}${cur?'_Amd'+cur:''}`};
}
function printPO(po,ver,style){
  if(!po)return;const r=poPrintHtml(po,ver,style);if(!r)return;
  const w=window.open('','_blank');if(!w)return showToast('Allow pop-ups to print','error');
  w.document.write(r.html);w.document.close();return w;
}

function registerList(){const q=norm(registerQuery);return poData.filter(p=>(!registerStatus||p.status===registerStatus)&&(!q||norm([p.poNumber,p.vendorName,p.projectNumber,p.projectName,p.client].join(' ')).includes(q)))}
function renderRegister(){
  const list=registerList();const tot=list.filter(p=>ACTIVE_PO.includes(p.status)).reduce((s,p)=>s+poInrValue(p),0);
  el('tab-register').innerHTML=`<div class="card"><div class="card-header"><span>PO register — ${list.length} PO(s) · active value ${inr(tot)} ex-GST</span>
    <div class="btn-row"><input style="width:240px" id="regQ" placeholder="Search PO no / vendor / project" value="${esc(registerQuery)}" oninput="registerQuery=this.value;clearTimeout(window._rq);window._rq=setTimeout(()=>{renderRegister();const f=el('regQ');f.focus();f.setSelectionRange(f.value.length,f.value.length)},300)">
    <select style="width:200px" onchange="registerStatus=this.value;renderRegister()"><option value="">All statuses</option>${Object.keys(PO_STATUS).map(k=>`<option value="${k}" ${k===registerStatus?'selected':''}>${PO_STATUS[k]}</option>`).join('')}</select>
    <button class="btn sm" onclick="exportRegister()"><i class="ti ti-file-spreadsheet"></i>Export</button></div></div>${poTable(list)}</div>`;
}
function exportRegister(){
  const aoa=[['PO No','Rev','PO Date','Project No','Project','Client','Vendor','Vendor GSTIN','Currency','FX','Basic','Freight+Other','GST','Grand Total','Ex-GST INR','PCA Status','PCA Flags','Status','Raised By','Released On','CS No']];
