<html lang="en">
<head>

  <title>DQAP ProMS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%23006994' width='64' height='64' rx='12'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='700' font-size='22' fill='white' text-anchor='middle'%3EPO%3C/text%3E%3C/svg%3E">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--p:#006994;--pd:#004A68;--pl:#E4F1FA;--bg:#F4F6FA;--card:#fff;--t1:#111;--t2:#666;--bd:rgba(0,0,0,.11);--bds:rgba(0,0,0,.22);--rad:10px;--ok:#1B5E20;--okl:#E8F5E9;--warn:#E65100;--warnl:#FFF3E0;--bad:#B71C1C;--oxide:#B5502F;--badl:#FFEBEE}
    body{font-family:'DM Sans','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t1);font-size:13px}
    .container{max-width:1480px;margin:0 auto;padding:20px}
    .header{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;padding:22px;border-radius:var(--rad);margin-bottom:16px;display:flex;justify-content:space-between;gap:16px;align-items:center}
    .header h1{font-size:26px;margin-bottom:5px;display:flex;align-items:center;gap:10px;font-weight:700}
    .header p{opacity:.9;font-size:13px}.userbox{background:rgba(255,255,255,.18);padding:11px 14px;border-radius:8px;min-width:210px}.userbox .lbl{font-size:10px;opacity:.85;margin-bottom:5px;text-transform:uppercase;letter-spacing:.7px}.userbox .nm{font-size:13px;font-weight:700}
    .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tab-btn{padding:9px 14px;border-radius:7px;border:1px solid var(--bds);background:var(--card);color:var(--t1);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;display:flex;align-items:center;gap:6px;font-family:inherit}.tab-btn:hover{border-color:var(--p);background:var(--pl)}.tab-btn.active{background:var(--oxide);color:#fff;border-color:var(--oxide)}
    .tab-btn .cnt{background:var(--bad);color:#fff;border-radius:10px;padding:0 6px;font-size:10px;line-height:16px}
    .subtabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px;flex-wrap:wrap}.subtab{padding:8px 13px;border:none;background:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;color:var(--t2);border-bottom:2px solid transparent;display:flex;gap:5px;align-items:center}.subtab.active{color:var(--oxide);border-bottom-color:var(--oxide)}
    .tab-content{display:none}.tab-content.active{display:block}.card{background:var(--card);border-radius:var(--rad);border:.5px solid var(--bd);padding:16px;margin-bottom:14px}.card-header{font-size:13px;font-weight:700;margin:-16px -16px 14px;padding:12px 16px;border-bottom:.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}.stat{background:var(--card);border-radius:var(--rad);border:.5px solid var(--bd);padding:13px;display:flex;gap:11px;align-items:center}.stat-icon{width:36px;height:36px;background:var(--pl);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--p);font-size:19px;flex-shrink:0}.stat-value{font-size:20px;font-weight:700;color:var(--p)}.stat-label{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.4px}
    .stat.alert .stat-icon{background:var(--badl);color:var(--bad)}.stat.alert .stat-value{color:var(--bad)}
    table{width:100%;border-collapse:collapse}th{padding:8px 9px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;background:#f5f5f5;border-bottom:.5px solid var(--bd);color:var(--t2);white-space:nowrap}td{padding:8px 9px;border-bottom:.5px solid var(--bd);vertical-align:top}tr:hover td{background:#fafafa}.table-wrap{overflow-x:auto}
    td.num,th.num{text-align:right;white-space:nowrap}
    .btn{padding:7px 12px;border-radius:7px;border:.5px solid var(--bds);background:transparent;color:var(--t1);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:5px;font-family:inherit;white-space:nowrap}.btn:hover{background:#f0f0f0}.btn.primary{background:var(--oxide);color:#fff;border-color:var(--oxide)}.btn.primary:hover{background:#944225}.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.ok:hover{background:#14461a}.btn.bad{color:var(--bad);border-color:#EF9A9A}.btn.sm{padding:5px 9px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    input,select,textarea{font-family:inherit;width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;background:#fafafa;color:var(--t1);font-size:12.5px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p);background:#fff}textarea{min-height:70px;resize:vertical}
    input[type="checkbox"],input[type="radio"]{width:16px;height:16px;padding:0;margin:0;flex-shrink:0;accent-color:var(--p)}
    input.cell{padding:5px 6px;font-size:12px;min-width:70px;text-align:right}
    .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}.form-group label{display:block;font-size:10.5px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}.req::after{content:' *';color:var(--bad)}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
    .s-open{background:#ECEFF1;color:#455A64}.s-pratim{background:#E3F2FD;color:#006994}.s-updesh{background:#F3E5F5;color:#6A1B9A}.s-ok{background:var(--okl);color:var(--ok)}.s-rej{background:var(--badl);color:var(--bad)}.s-warn{background:var(--warnl);color:var(--warn)}.s-done{background:#EDE7F6;color:#4527A0}
    .muted{color:var(--t2);font-size:11px}.strong{font-weight:700}.right{text-align:right}.hidden{display:none!important}.empty{text-align:center;color:var(--t2);padding:30px 12px}
    .flag{color:var(--bad);font-weight:700}.okc{color:var(--ok);font-weight:700}
    tr.over td{background:#FFF5F5}tr.over:hover td{background:#FFEDED}
    td.l1{background:#E8F5E9!important;font-weight:700;color:var(--ok)}
    th.sel,td.sel{box-shadow:inset 0 0 0 2px var(--p)}
    .notice{border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}.notice i{font-size:16px;margin-top:1px}.notice.bad{background:var(--badl);color:var(--bad);border:1px solid #F5C2C2}.notice.warn{background:var(--warnl);color:#8a3b00;border:1px solid #FFD8A8}.notice.ok{background:var(--okl);color:var(--ok);border:1px solid #BFE3C3}.notice.info{background:var(--pl);color:var(--pd);border:1px solid #BCD9EC}
    .quote-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;margin-bottom:12px}.quote-card{border:1px solid var(--bd);border-radius:9px;padding:12px;background:#fcfcfd}.quote-card .form-row{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.quote-card h4{font-size:12.5px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .modal{position:fixed;inset:0;background:rgba(13,29,38,.55);z-index:5000;display:flex;align-items:center;justify-content:center;padding:24px}.dialog{background:var(--card);width:min(1280px,100%);max-height:calc(100vh - 48px);overflow-y:auto;border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.3)}.dialog.narrow{width:min(640px,100%)}.dialog .card-header{position:sticky;top:0;z-index:2;background:#fff;margin:0;padding:14px 16px}.dialog-body{padding:16px}
    .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}.detail-item{background:#fafafa;border:1px solid var(--bd);border-radius:8px;padding:9px 10px}.detail-item .lbl{color:var(--t2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}.detail-item .val{font-weight:600;line-height:1.45;overflow-wrap:anywhere}
    .audit-row{display:grid;grid-template-columns:150px 140px 1fr;gap:10px;border-bottom:.5px solid var(--bd);padding:7px 0;font-size:12px}
    .bar{height:8px;background:#eceff1;border-radius:6px;overflow:hidden;min-width:90px}.bar>span{display:block;height:100%;background:var(--p)}.bar.over>span{background:var(--bad)}
    .toast{position:fixed;right:18px;bottom:18px;background:#1A237E;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:600;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:420px}.toast.error{background:var(--bad)}.toast.success{background:var(--ok)}
    .error-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.error-card{background:#fff;border-radius:12px;border:.5px solid var(--bd);box-shadow:0 10px 30px rgba(0,0,0,.12);max-width:520px;padding:26px;text-align:center}.error-card h2{color:var(--bad);margin-bottom:8px}
    .loading{position:fixed;inset:0;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;z-index:9000;font-weight:700;color:var(--p)}
    .proj-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.proj-head select{max-width:520px}
    .pill{display:inline-block;padding:1px 7px;border-radius:5px;background:#eef2f5;font-size:10.5px;font-weight:600;color:#455A64}
    @media(max-width:720px){.container{padding:12px}.header{align-items:flex-start;flex-direction:column}.audit-row{grid-template-columns:1fr}.card{padding:12px}.card-header{margin:-12px -12px 12px;padding:10px 12px}.modal{padding:8px}}
  </style>
</head>
<body>
<div id="appContainer" class="container" style="display:none">
  <div class="header">
    <div><h1><i class="ti ti-shopping-cart"></i> ProMS</h1><p>Procurement Management — PECS baseline, 3-quote comparison, PO issue &amp; approvals</p></div>
    <div class="userbox"><div class="lbl">Logged in as</div><div class="nm" id="currentUser">-</div></div>
  </div>
  <div class="tabs" id="mainTabs">
    <button class="tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')"><i class="ti ti-layout-dashboard"></i>Dashboard</button>
    <button class="tab-btn" data-tab="project" onclick="switchTab('project')"><i class="ti ti-building-factory-2"></i>Project Procurement</button>
    <button class="tab-btn" data-tab="approvals" onclick="switchTab('approvals')"><i class="ti ti-checkup-list"></i>PO Approvals <span class="cnt hidden" id="apprCnt"></span></button>
    <button class="tab-btn" data-tab="register" onclick="switchTab('register')"><i class="ti ti-file-invoice"></i>PO Register</button>
    <button class="tab-btn" data-tab="vendors" onclick="switchTab('vendors')"><i class="ti ti-truck-delivery"></i>Vendors</button>
    <button class="tab-btn" data-tab="settings" id="settingsTabBtn" onclick="switchTab('settings')" style="display:none"><i class="ti ti-settings"></i>Settings</button>
  </div>
  <section id="tab-dashboard" class="tab-content active"></section>
  <section id="tab-project" class="tab-content"></section>
  <section id="tab-approvals" class="tab-content"></section>
  <section id="tab-register" class="tab-content"></section>
  <section id="tab-vendors" class="tab-content"></section>
  <section id="tab-settings" class="tab-content"></section>
</div>
<div id="modalRoot"></div>
<input type="file" id="filePecs" accept=".xlsx,.xls" style="display:none" onchange="handlePecsFile(this)">
<input type="file" id="filePca" accept=".xlsx,.xls" style="display:none" onchange="handlePcaFile(this)">

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function el(id){return document.getElementById(id)}

// Indian-system amount in words (Rupees … and … Paise Only)
function amountInWords(amount){
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=n=>n<20?a[n]:b[Math.floor(n/10)]+(n%10?' '+a[n%10]:'');
  const three=n=>(n>=100?a[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?two(n%100):'');
  const words=n=>{if(n===0)return'Zero';let s='';const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
    if(cr)s+=(cr>=100?words(cr):two(cr))+' Crore ';if(lk)s+=two(lk)+' Lakh ';if(th)s+=two(th)+' Thousand ';if(n)s+=three(n);return s.trim()};
  const rupees=Math.floor(Math.abs(amount)),paise=Math.round((Math.abs(amount)-rupees)*100);
  return 'Rupees '+words(rupees)+(paise?' and '+two(paise)+' Paise':'')+' Only';
}

  const query=new URLSearchParams(window.location.search);
  const handoffSession=fragment.get('sess')||query.get('sess');
  try{sess=sessionStorage.getItem('dqap_sess')}catch(e){}
  if(!sess){try{const bridge=JSON.parse(localStorage.getItem('dqap_proms_handoff')||'null');if(bridge&&bridge.session&&Date.now()-Number(bridge.ts||0)<10*60*1000)sess=bridge.session}catch(e){}}
  if(!sess)sess=handoffSession;
  if(sess){try{sessionStorage.setItem('dqap_sess',sess);localStorage.setItem('dqap_proms_handoff',JSON.stringify({session:sess,ts:Date.now()}))}catch(e){} if(handoffSession)history.replaceState(null,document.title,window.location.pathname+window.location.search)}

// ═══════════════════════════════════════════════════════════════════════
// PCA WORKBOOK PARSER  (DQAP PCA format: Summary + 7 detail sheets)
// Header-text driven so it survives column moves between PCA versions.
// ═══════════════════════════════════════════════════════════════════════
const NON_PROCURABLE_RX=/\b(gst|igst|cgst|sgst|tax|finance cost|interest|margin)\b/i;
function sheetRows(ws){return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true})}
function cellText(v){return String(v??'').replace(/\s+/g,' ').trim()}
function mapHeader(row){
  const m={};
  (row||[]).forEach((c,i)=>{
    const t=cellText(c).toLowerCase();if(!t)return;
    if(/^s\.?\s*no|^sr/.test(t)&&m.sno==null)m.sno=i;
    else if(/description|^scope|^item/.test(t)&&m.desc==null)m.desc=i;
    else if(/^make|specification|^model|part\s*no|^vendor/.test(t)&&m.make==null)m.make=i;
    else if((/^unit$|^uom/.test(t))&&m.unit==null)m.unit=i;
    else if(/^qty|^quantity/.test(t)&&m.qty==null)m.qty=i;
    else if(/^currency/.test(t))m.cur=i;
    else if(/unit rate.*foreign/.test(t))m.fxRate=i;
    else if(/exchange/.test(t))m.fx=i;
    else if(/^duty\s*%/.test(t))m.duty=i;
    else if(/^rate/.test(t)&&m.rate==null)m.rate=i;
    else if(/^amount/.test(t)&&/₹|inr|rs/.test(t))m.amount=i;
    else if(/^amount/.test(t)&&m.amount==null&&!/foreign/.test(t))m.amount=i;
    else if(/^remark/.test(t)&&m.rem==null)m.rem=i;
    else if(/categor|^head|^group|^type/.test(t)&&m.cat==null)m.cat=i;
  });
  return m;
}
function findHeaderRow(rows,maxScan=20){
  for(let i=0;i<Math.min(rows.length,maxScan);i++){const m=mapHeader(rows[i]);if(m.desc!=null&&(m.qty!=null||m.amount!=null))return{idx:i,map:m}}
  return null;
}
function parsePcaWorkbook(wb,fileName){
  const items=[],heads=[],meta={};
  const summaryHeads={};
  wb.SheetNames.forEach(name=>{
    const ws=wb.Sheets[name];const rows=sheetRows(ws);const lname=name.toLowerCase();
    if(lname.includes('summary')){
      rows.forEach(r=>{
        const label=cellText(r[0]).toLowerCase();const vals=(r||[]).slice(1).filter(v=>v!=null&&cellText(v)!=='');
        const first=vals[0];
        if(/rfp|tender ref/.test(label))meta.ref=cellText(first);
        else if(/^project description/.test(label))meta.description=cellText(first);
        else if(/^customer/.test(label))meta.customer=cellText(first);
        else if(/^end customer/.test(label))meta.endCustomer=cellText(first);
        else if(/^location/.test(label))meta.location=cellText(first);
        else if(/^total input cost/.test(label))meta.totalInputCost=num(vals.find(v=>typeof v==='number'));
        else if(/^gross profit\s*\(%\)|^gross profit +\(%\)/.test(label.replace(/\s+/g,' ')))meta.gpPct=num(first);
        else if(/^selling price/.test(label))meta.sellingPrice=num(first);
        else if(/^approval status/.test(label))meta.approvalStatus=cellText(first);
        // cost-head table: S.No | Cost Head | Amount | % | | Source Worksheet
        if(typeof r[0]==='number'&&r[1]&&typeof r[2]==='number'){
          const src=cellText(r[5]).match(/'([^']+)'/);summaryHeads[(src?src[1]:cellText(r[1])).toLowerCase()]={label:cellText(r[1]),amount:r[2]};
        }
      });
      return;
    }
    const isMgmt=/mgmt|management|supervision|manpower/.test(lname);
    const isOther=/other cost/.test(lname);
    if(isOther){
      let section='';
      rows.forEach((r,ri)=>{
        const a=r?.[0];const at=cellText(a);
        const next=rows[ri+1];
        if(at&&typeof a!=='number'&&next&&/^s\.?\s*no/i.test(cellText(next[0]))){section=at;return}
        if(typeof a==='number'){
          const hdr=findHeaderRow(rows.slice(Math.max(0,ri-6),ri),6);const m=hdr?hdr.map:{desc:1,amount:3,rem:4};
          const amt=num(r[m.amount??3]);if(!amt)return;
          const desc=cellText(r[m.desc??1])||section||'Other cost';
          const basis=cellText(r[2]);
          items.push({key:safeId(name)+'_r'+(ri+1),head:name,sheet:name,row:ri+1,description:desc+(cellText(r[m.desc??1])&&section?` (${section})`:''),make:basis,unit:'Lot',qty:1,rate:r2(amt),amount:r2(amt),procurable:!NON_PROCURABLE_RX.test(desc+' '+section)});
        }
      });
      return;
    }
    if(isMgmt){
      // Internal manpower — not procured through POs. Capture total only (Summary value preferred below).
      let total=0;for(let i=0;i<rows.length;i++){const r=rows[i];if(/^total/i.test(cellText(r?.[0]))){const n=(r||[]).filter(v=>typeof v==='number');total=n.length?n[n.length-1]:0;break}}
      heads.push({name,sheet:name,total:r2(total),procurable:false});return;
    }
    const hdr=findHeaderRow(rows);
    if(!hdr)return;
    const m=hdr.map;
    for(let i=hdr.idx+1;i<rows.length;i++){
      const r=rows[i]||[];const a=cellText(r[0]);
      if(/total/i.test(a))break;
      const desc=cellText(r[m.desc]),make=m.make!=null?cellText(r[m.make]):'';
      const qty=num(r[m.qty]);
      let rate=m.rate!=null?r[m.rate]:null;
      if(typeof rate!=='number'){ // formula without cached value → rebuild
        if(m.fxRate!=null)rate=num(r[m.fxRate])*num(r[m.fx]||1)*(1+num(r[m.duty]));else rate=num(rate);
      }
      let amount=m.amount!=null?r[m.amount]:null;if(typeof amount!=='number')amount=qty*rate;
      if(!desc&&!make)continue;
      if(!qty&&!amount)continue;
      items.push({key:safeId(name)+'_r'+(i+1),head:name,sheet:name,row:i+1,description:desc||make,make,unit:m.unit!=null?cellText(r[m.unit]):'',qty,rate:r2(rate),amount:r2(amount),
        currency:m.cur!=null?(cellText(r[m.cur])||'INR'):'INR',fxUnitRate:m.fxRate!=null?num(r[m.fxRate]):null,exRate:m.fx!=null?num(r[m.fx]):null,dutyPct:m.duty!=null?num(r[m.duty]):null,
        baseRateInr:m.fxRate!=null&&m.fx!=null?r2(num(r[m.fxRate])*num(r[m.fx])):null,remarks:m.rem!=null?cellText(r[m.rem]):'',procurable:!NON_PROCURABLE_RX.test(desc)});
    }
  });
  // head totals — prefer Summary sheet values, fall back to item sums
  const byHead={};items.forEach(it=>{byHead[it.head]=(byHead[it.head]||0)+it.amount});
  Object.keys(byHead).forEach(h=>{
    const s=summaryHeads[h.toLowerCase()];
    heads.push({name:h,sheet:h,label:s?.label||h,total:r2(byHead[h]),summaryTotal:s?r2(s.amount):null,procurable:true});
  });
  heads.forEach(h=>{if(!h.label){const s=summaryHeads[h.name.toLowerCase()];h.label=s?.label||h.name;if(s){h.summaryTotal=r2(s.amount);if(!h.total)h.total=h.summaryTotal}}});
  // Summary heads with no matching detail sheet (renamed sheets etc.) — keep them visible as non-itemised
  Object.keys(summaryHeads).forEach(k=>{if(!heads.some(h=>h.name.toLowerCase()===k)){const s=summaryHeads[k];heads.push({name:s.label,sheet:'',label:s.label,total:r2(s.amount),summaryTotal:r2(s.amount),procurable:false,notItemised:true})}});
  const procBudget=r2(items.filter(i=>i.procurable).reduce((s,i)=>s+i.amount,0));
  if(!meta.totalInputCost)meta.totalInputCost=r2(heads.reduce((s,h)=>s+(h.summaryTotal??h.total),0));
  return{fileName,meta,heads,items,procBudget};
}

// ═══════════════════════════════════════════════════════════════════════
// Aggregations used by comparison, PO check and dashboards
// ═══════════════════════════════════════════════════════════════════════
function pmProj(pid){return pmData[pid]||{boq:[],pca:null,salesPca:null,pecs:null,pecsPending:null}}
function pcaItem(pid,key){return(pmProj(pid).pca?.items||[]).find(i=>i.key===key)}
function boqItem(pid,id){return(pmProj(pid).boq||[]).find(i=>i.id===id)}
function lineNetRate(l){return r2(num(l.rate)*(1-num(l.discPct)/100))}
function activePOs(pid,excludeId){return poData.filter(p=>p.projectId===pid&&ACTIVE_PO.includes(p.status)&&p.id!==excludeId)}
function orderedByBoq(pid,excludeId){const m={};activePOs(pid,excludeId).forEach(po=>(po.lines||[]).forEach(l=>{m[l.boqId]=(m[l.boqId]||0)+num(l.qty)}));return m}
function orderedByPca(pid,excludeId){
  const m={};activePOs(pid,excludeId).forEach(po=>{const fx=num(po.fxRate)||1;(po.lines||[]).forEach(l=>{if(!l.pcaKey)return;const x=m[l.pcaKey]||(m[l.pcaKey]={qty:0,value:0});x.qty+=num(l.qty);x.value+=num(l.qty)*lineNetRate(l)*fx})});return m;
}
function poInrValue(po){return r2((po.totals?.basic||0)*(num(po.fxRate)||1)+(num(po.freight)+num(po.otherCharges))*(num(po.fxRate)||1))}
function projectOrderedTotal(pid,excludeId){return r2(activePOs(pid,excludeId).reduce((s,po)=>s+poInrValue(po),0))}

// ═══════════════════════════════════════════════════════════════════════
// PECS CHECK — the core control (baseline = active PECS). Evaluated when a PO is drafted, re-evaluated
// (and frozen into the PO) at submission. All values ex-GST, in ₹.
// ═══════════════════════════════════════════════════════════════════════
function evaluatePca(pid,lines,opts={}){
  const pm=pmProj(pid),pca=pm.pca,tol=1+num(settings.pcaTolerancePct)/100,fx=num(opts.fxRate)||1;
  const flags=[],lineResults=[];
  const prior=orderedByPca(pid,opts.excludePoId);
  const addTo={};
  lines.forEach(l=>{if(l.pcaKey){const x=addTo[l.pcaKey]||(addTo[l.pcaKey]={qty:0,value:0});x.qty+=num(l.qty);x.value+=num(l.qty)*lineNetRate(l)*fx}});
  if(!pca){flags.push({type:'NO_PCA',msg:'No active PECS for this project — PO cannot be validated against the execution cost sheet'})}
  lines.forEach(l=>{
    const res={boqId:l.boqId,pcaKey:l.pcaKey||'',flags:[]};
    const rateInr=r2(lineNetRate(l)*fx);res.poRateInr=rateInr;
    const pi=pca&&l.pcaKey?pca.items.find(i=>i.key===l.pcaKey):null;
    if(pca&&!pi){const f={type:'NOT_IN_PCA',boqId:l.boqId,item:l.description,msg:`“${l.description}” is not in the active PECS`,overAmt:r2(rateInr*num(l.qty))};flags.push(f);res.flags.push(f)}
    if(pi){
      // Foreign-currency PO against an import line → compare ex-duty CIF rate (duty is paid separately to customs, not to the vendor)
      const foreignPo=fx!==1||(opts.currency&&opts.currency!=='INR');
      const benchRate=foreignPo&&pi.baseRateInr?pi.baseRateInr:pi.rate,benchAmt=r2(benchRate*pi.qty);
      res.pcaRate=benchRate;res.pcaQty=pi.qty;res.pcaAmount=benchAmt;res.benchBasis=benchRate!==pi.rate?'ex-duty':'landed';
      const p=prior[pi.key]||{qty:0,value:0},t=addTo[pi.key];
      res.cumQty=r2(p.qty+t.qty);res.cumValue=r2(p.value+t.value);res.priorQty=r2(p.qty);
      if(rateInr>benchRate*tol+0.005){const f={type:'RATE',boqId:l.boqId,item:l.description,msg:`Rate ${inr2(rateInr)} exceeds PECS rate ${inr2(benchRate)}${res.benchBasis==='ex-duty'?' (ex-duty)':''} (+${benchRate?fmt((rateInr/benchRate-1)*100,1):'∞'}%)`,overAmt:r2((rateInr-benchRate)*num(l.qty))};flags.push(f);res.flags.push(f)}
      if(res.cumQty>pi.qty+1e-9){const f={type:'QTY',boqId:l.boqId,item:l.description,msg:`Cumulative qty ${fmt(res.cumQty,2)} exceeds PECS qty ${fmt(pi.qty,2)} (already ordered ${fmt(p.qty,2)})`,overAmt:r2((res.cumQty-pi.qty)*rateInr)};flags.push(f);res.flags.push(f)}
      if(res.cumValue>benchAmt*tol+0.5){const f={type:'VALUE',boqId:l.boqId,item:l.description,msg:`Cumulative value ${inr(res.cumValue)} exceeds PECS amount ${inr(benchAmt)}`,overAmt:r2(res.cumValue-benchAmt)};if(!res.flags.length){flags.push(f)}res.flags.push(f)}
    }
    lineResults.push(res);
  });
  // project-level procurement budget
  const budget={procBudget:pca?.procBudget||0,orderedBefore:projectOrderedTotal(pid,opts.excludePoId),thisPo:r2(num(opts.thisPoValueInr))};
  budget.after=r2(budget.orderedBefore+budget.thisPo);
  if(pca&&budget.after>budget.procBudget*tol+0.5)flags.push({type:'BUDGET',msg:`Total procurement ${inr(budget.after)} will exceed PECS procurement budget ${inr(budget.procBudget)}`,overAmt:r2(budget.after-budget.procBudget)});
  const overAmt=r2(flags.filter(f=>f.type!=='BUDGET').reduce((s,f)=>s+num(f.overAmt),0));
  return{evaluatedAt:nowIso(),tolerancePct:num(settings.pcaTolerancePct),overPca:flags.length>0,flags,lines:lineResults,budget,overAmt};
}

// ═══════════════════════════════════════════════════════════════════════
// Google Drive (existing Cloud Run uploader) → project's "Procurement" folder
// Also registers the file against the project in DORBIT PMO documents.
// ═══════════════════════════════════════════════════════════════════════
// ── ProMS in Google Drive (hybrid model) ───────────────────────────────
// Each PMO project already has a Drive tree (created by DORBIT). ProMS keeps its documents in a
// "ProMS" folder inside it:  NN. ProMS / 01. PECS · 02. Sales PCA (reference) · 03. Quotations / <CS no> · 04. Purchase Orders / <PO no>
// Firestore keeps only small state records; Drive keeps files + a JSON snapshot of every issued PO version.
const PROMS_SUBS=[['pecs','01. PECS'],['pca','02. Sales PCA (reference)'],['quotes','03. Quotations'],['po','04. Purchase Orders']];
const safeName=x=>String(x||'').replace(/[\\/:*?"<>|]+/g,'_').trim();
async function driveCall(body){
  const r=await fetch(DRIVE_UPLOAD_API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||('Drive service error '+r.status))}
  return r.json();
}
const folderUrl=id=>id?`https://drive.google.com/drive/folders/${id}`:'';
const _driveLock={};
function oneAtATime(key,fn){const prev=_driveLock[key]||Promise.resolve();const run=prev.catch(()=>{}).then(fn);_driveLock[key]=run;return run}
// Find or create the project's ProMS folder and its four sub-folders. Cached on the ProMS project record.
function ensureProMsFolders(pid){
  return oneAtATime('root_'+pid,async()=>{
    const p=projectById(pid);if(!p?.driveFolderId)throw new Error('This project has no Drive folder yet — create the project Drive folders from DORBIT PMO first');
    let drive=pmProj(pid).drive;
    if(drive?.rootId&&PROMS_SUBS.every(([k])=>drive.subs?.[k]))return drive;
    // PMO checklist: read fresh so we never overwrite a concurrent PMO edit with a stale list
    const snap=await db.collection(PROJ_COL).doc(pid).get();const list=(snap.data()?.driveChecklist||[]).slice();
    let root=list.find(x=>/\bproms\b/i.test(x.label||''));
    if(!root){
      const label=String(list.length+1).padStart(2,'0')+'. ProMS';
      const d=await driveCall({action:'createSingleFolder',parentFolderId:p.driveFolderId,name:label});
      root={key:'proms',label,folderId:d.folderId,subfolders:[]};list.push(root);
      await db.collection(PROJ_COL).doc(pid).update({driveChecklist:list});
    }
    const subs={...(drive?.subs||{})};
    for(const[k,label]of PROMS_SUBS){if(!subs[k]){const d=await driveCall({action:'createSingleFolder',parentFolderId:root.folderId,name:label});subs[k]=d.folderId}}
    drive={rootId:root.folderId,rootKey:root.key||'proms',rootLink:folderUrl(root.folderId),subs,named:drive?.named||{}};
    await savePm(pid,{drive});return drive;
  });
}
// per-document sub-folder, e.g. CS/P-2627-07/01 under "03. Quotations", PO no. under "04. Purchase Orders"
function ensureSubFolder(pid,kind,sub){
  return oneAtATime('sub_'+pid+kind+sub,async()=>{
    const drive=await ensureProMsFolders(pid);if(!sub)return drive.subs[kind];
    const key=kind+'__'+safeName(sub).replace(/\s+/g,'_');const have=pmProj(pid).drive?.named?.[key];if(have)return have;
    const d=await driveCall({action:'createSingleFolder',parentFolderId:drive.subs[kind],name:safeName(sub)});
    await savePm(pid,{drive:{named:{[key]:d.folderId}}});
    pmBase[pid]={...(pmBase[pid]||{}),drive:{...(pmBase[pid]?.drive||{}),named:{...(pmBase[pid]?.drive?.named||{}),[key]:d.folderId}}};
    return d.folderId;
  });
}
const toBase64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
// upload a File/Blob into ProMS/<kind>[/<sub>]
async function uploadToProms(file,pid,kind,opts={}){
  if(!file)return null;
  if(file.size>MAX_UPLOAD_BYTES)throw new Error('File exceeds 15MB limit');
  const folderId=await ensureSubFolder(pid,kind,opts.sub);
  const base=opts.name||file.name||'file';const fileName=opts.tag&&!opts.name?`${opts.tag} - ${base}`:base;
  const data=await driveCall({action:'uploadProjectDoc',fileName,mimeType:file.type||opts.mime||'application/octet-stream',fileBase64:await toBase64(file),targetFolderId:folderId,uploadedByName:myName()});
  const rec={fileName:data.fileName||fileName,webViewLink:data.webViewLink||'',uploadedBy:me(),uploadedByName:myName(),uploadedAt:nowIso(),sizeKB:Math.round((data.sizeBytes||file.size||0)/1024),source:'ProMS'};
  const drive=pmProj(pid).drive;
  if(drive?.rootKey&&drive.rootKey!=='proms_legacy'&&!opts.noRegister){try{await db.collection(PROJ_COL).doc(pid).update({[`projectDocuments.${drive.rootKey}`]:firebase.firestore.FieldValue.arrayUnion(rec)})}catch(e){console.warn('PMO doc register failed',e)}}
  return rec;
}
// JSON snapshot (a complete, human-readable copy of a record) into Drive
function snapshotToDrive(pid,kind,sub,fileName,obj){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  return uploadToProms(blob,pid,kind,{sub,name:fileName,mime:'application/json',noRegister:true});
}
// compatibility wrapper
function uploadToProcurementFolder(file,pid,tag){return uploadToProms(file,pid,/pca/i.test(tag||'')?'pca':/pecs/i.test(tag||'')?'pecs':'quotes',{tag})}
// On release (or amendment release) file the PO in Drive: printable copy + JSON snapshot of this version
async function archivePoToDrive(poId){
  const po=poData.find(x=>x.id===poId);if(!po||po.status!=='RELEASED')return;
  const amd=po.amendmentNo||0;if((po.driveFiles||[]).some(f=>f.amd===amd))return;
  const base=`${safeName(po.poNumber)}${amd?' Amd '+amd:''}`;
  const html=poPrintHtml(po,undefined);
  const a=await uploadToProms(new Blob([html.html],{type:'text/html'}),po.projectId,'po',{sub:po.poNumber,name:base+' (print me to PDF).html',mime:'text/html',noRegister:true});
  const b=await snapshotToDrive(po.projectId,'po',po.poNumber,base+' - data snapshot.json',{po:{...po,driveFiles:undefined},archivedAt:nowIso(),archivedBy:me()});
  await db.collection(PM_PO).doc(poId).update({driveFiles:firebase.firestore.FieldValue.arrayUnion(clean({amd,at:nowIso(),by:me(),print:a.webViewLink,snapshot:b.webViewLink,folder:folderUrl(pmProj(po.projectId).drive?.named?.['po__'+safeName(po.poNumber).replace(/\s+/g,'_')]||'')}))});
}
function readWorkbook(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>{try{res(XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true}))}catch(err){rej(err)}};r.onerror=rej;r.readAsArrayBuffer(file)})}
// ═══════════════════════════════════════════════════════════════════════
// PECS — Project Execution Cost Sheet (prepared by PMO: actual items, qty, rates, PO value → project GM)
// The sales PCA is kept only as a read-only reference to measure estimating accuracy.
// The ACTIVE PECS is the control baseline: pm.boq / pm.pca are DERIVED from it (see derivePecsBaseline)
// so comparison, PO checks and budgets all run against PECS without a second data-entry step.
// ═══════════════════════════════════════════════════════════════════════
const UNASSIGNED='Items not assigned to a cost head';
const COST_HEADS=['Management, Supervision & Administration Cost','OEM Domestic Procurement','OEM Import Procurement','Local 3rd Party Items','Accessories','Sub-Contract Services','Other Costs'];
const NON_PO_HEADS=[COST_HEADS[0]];   // internal manpower is never procured through a PO
// map any free-text head (PECS cell or sales PCA label / sheet name) to one canonical head; '' = not recognised
function canonHead(t){
  const s=norm(t).replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();if(!s)return'';
  if(/unassigned|not assigned/.test(s))return UNASSIGNED;
  if(/mgmt|management|supervision|manpower|administration|admin cost/.test(s))return COST_HEADS[0];
  if(/import/.test(s))return COST_HEADS[2];
  if(/oem|domestic/.test(s))return COST_HEADS[1];
  if(/local|3rd|third/.test(s))return COST_HEADS[3];
  if(/accessor/.test(s))return COST_HEADS[4];
  if(/sub ?contract/.test(s))return COST_HEADS[5];
  if(/other/.test(s))return COST_HEADS[6];
  return'';
}
const HEAD_ORDER=[...COST_HEADS,UNASSIGNED];
function metaFromRows(rows){
  const m={};
  rows.slice(0,13).forEach(r=>{
    const lab=cellText(r?.[0]).toLowerCase();const val=(r||[]).slice(1).find(v=>v!=null&&cellText(v)!=='');if(!lab||val==null)return;
    if(/^project number|^project no/.test(lab))m.projectNumber=cellText(val);
    else if(/^project name/.test(lab))m.projectName=cellText(val);
    else if(/^client po no/.test(lab))m.clientPo=cellText(val);
    else if(/^client po date/.test(lab))m.clientPoDate=val instanceof Date?val.toISOString().slice(0,10):cellText(val);
    else if(/^client/.test(lab))m.client=cellText(val);
    else if(/^po value/.test(lab))m.poValue=num(val);
    else if(/^pecs version/.test(lab))m.sheetVersion=cellText(val);
    else if(/^prepared by/.test(lab))m.preparedBy=cellText(val);
  });
  return m;
}
function parsePecsWorkbook(wb,fileName){
  const name=wb.SheetNames.find(n=>/^pecs$/i.test(n.trim()))||wb.SheetNames.find(n=>/pecs/i.test(n)&&!/instruction/i.test(n));
  if(!name)throw new Error('No sheet named “PECS” found — please use the ProMS PECS template');
  const rows=sheetRows(wb.Sheets[name]);const meta=metaFromRows(rows);
  let hi=-1;for(let i=0;i<Math.min(rows.length,40);i++){const t=(rows[i]||[]).map(c=>cellText(c).toLowerCase());if(t.some(x=>/^cost head/.test(x))&&t.some(x=>/description/.test(x))){hi=i;break}}
  if(hi<0)throw new Error('Could not find the item header row (Cost head / Item description / Qty / Rate)');
  const col={};(rows[hi]||[]).forEach((c,i)=>{const t=cellText(c).toLowerCase();
    if(/^s\.?\s*no/.test(t))col.sno=i;else if(/^cost head/.test(t))col.head=i;else if(/description/.test(t))col.desc=i;else if(/^make/.test(t))col.make=i;
    else if(/^part/.test(t))col.part=i;else if(/^hsn/.test(t))col.hsn=i;else if(/^unit$|^uom/.test(t))col.unit=i;else if(/^qty|^quantity/.test(t))col.qty=i;
    else if(/^rate/.test(t))col.rate=i;else if(/^currency/.test(t))col.cur=i;else if(/^exch/.test(t))col.fx=i;else if(/^duty/.test(t))col.duty=i;
    else if(/^amount/.test(t))col.amount=i;else if(/^remark/.test(t))col.rem=i});
  if(col.desc==null||col.qty==null||col.rate==null)throw new Error('Template columns missing — need Item description, Qty and Rate (ex-GST)');
  const items=[],warnings=[],seen={};
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]||[];const desc=cellText(r[col.desc]);const qty=num(r[col.qty]),rate=num(r[col.rate]);
    if(!desc&&!qty&&!rate)continue;
    if(/^total/i.test(desc)||/^total/i.test(cellText(r[col.sno])))continue;
    const fx=num(r[col.fx])||1,duty=num(r[col.duty]);
    const amount=r2(qty*rate*fx*(1+duty/100));
    const rawHead=col.head!=null?cellText(r[col.head]):'';let head=canonHead(rawHead);
    if(rawHead&&!head)warnings.push(`Row ${i+1}: cost head “${rawHead}” is not a standard head — placed under “${UNASSIGNED}”`);
    if(!head)head=UNASSIGNED;
    if(!desc)warnings.push(`Row ${i+1}: amount ${inr(amount)} has no item description`);
    const make=col.make!=null?cellText(r[col.make]):'',part=col.part!=null?cellText(r[col.part]):'';
    let key=safeId(norm(desc+'|'+(part||make)).replace(/[^a-z0-9]+/g,'_')).slice(0,60)||'row'+(i+1);
    seen[key]=(seen[key]||0)+1;if(seen[key]>1)key+='_'+seen[key];
    items.push({key,sno:col.sno!=null?cellText(r[col.sno])||String(items.length+1):String(items.length+1),head,description:desc||'(no description)',make:make||part,part,hsn:col.hsn!=null?cellText(r[col.hsn]):'',
      unit:col.unit!=null?cellText(r[col.unit])||'Nos':'Nos',qty,rate:r2(rate),currency:col.cur!=null?(cellText(r[col.cur])||'INR'):'INR',fxRate:fx,dutyPct:duty,
      landedRate:r2(rate*fx*(1+duty/100)),baseRateInr:r2(rate*fx),amount,remarks:col.rem!=null?cellText(r[col.rem]):'',
      procurable:!NON_PO_HEADS.includes(head)&&!NON_PROCURABLE_RX.test(desc)});
    if(qty<=0&&desc)warnings.push(`Row ${i+1}: “${desc}” has no quantity`);
    if(rate<=0&&desc)warnings.push(`Row ${i+1}: “${desc}” has no rate`);
  }
  return{fileName,meta,items,warnings,...pecsTotals(items,meta.poValue)};
}
function pecsTotals(items,poValue){
  const byHead={};HEAD_ORDER.forEach(h=>byHead[h]={name:h,total:0,count:0});
  items.forEach(i=>{const h=byHead[i.head]||(byHead[i.head]={name:i.head,total:0,count:0});h.total+=i.amount;h.count++});
  const heads=HEAD_ORDER.map(h=>({...byHead[h],total:r2(byHead[h].total)}));
  const totalCost=r2(items.reduce((s,i)=>s+i.amount,0)),po=r2(num(poValue));
  const gm=r2(po-totalCost);
  return{heads,totalCost,poValue:po,gm,gmPct:po>0?gm/po:null,unassignedTotal:heads.find(h=>h.name===UNASSIGNED).total,unassignedCount:heads.find(h=>h.name===UNASSIGNED).count};
}
// ── sales PCA reference: totals per canonical head, selling price, GM ──
function salesPcaView(sp){
  if(!sp)return null;
  const byHead={};HEAD_ORDER.forEach(h=>byHead[h]=0);
  (sp.heads||[]).forEach(h=>{const c=canonHead(h.label||h.name)||UNASSIGNED;byHead[c]=(byHead[c]||0)+num(h.summaryTotal??h.total)});
  const total=r2(Object.values(byHead).reduce((a,b)=>a+b,0));
  const cost=num(sp.meta?.totalInputCost)||total;
  const sell=num(sp.meta?.sellingPrice);
  let gmPct=sp.meta?.gpPct!=null&&sp.meta.gpPct!==0?num(sp.meta.gpPct):(sell>0?(sell-cost)/sell:null);
  if(gmPct!=null&&gmPct>1.5)gmPct=gmPct/100;
  return{byHead,cost:r2(cost),sell,gmPct,gm:sell>0?r2(sell-cost):null,fileName:sp.fileName};
}
// head-wise PECS vs sales PCA
function pecsVsPca(pecs,sp){
  const v=salesPcaView(sp);if(!pecs)return null;
  const rows=HEAD_ORDER.map(h=>{const a=pecs.heads.find(x=>x.name===h)?.total||0,p=v?.byHead[h]||0;return{head:h,pecs:a,pca:p,diff:r2(a-p),pct:p?(a-p)/p:null}}).filter(r=>r.pecs||r.pca||r.head!==UNASSIGNED);
  const gmDrop=!!(v&&v.gmPct!=null&&pecs.gmPct!=null&&r2(pecs.gmPct*100)<r2(v.gmPct*100));
  return{rows,v,gmDrop,gmDelta:v&&v.gmPct!=null&&pecs.gmPct!=null?pecs.gmPct-v.gmPct:null,
    costDiff:v?r2(pecs.totalCost-v.cost):null,sellDiff:v&&v.sell?r2(pecs.poValue-v.sell):null};
}
// ── baseline for the PO/comparison engine, derived from the ACTIVE PECS ──
function derivePecsBaseline(pecs){
  if(!pecs)return{boq:[],pca:null};
  const items=pecs.items.map(i=>({...i,sheet:i.head}));
  const heads=pecs.heads.filter(h=>h.count||h.total).map(h=>({name:h.name,label:h.name,total:h.total,summaryTotal:h.total,procurable:!NON_PO_HEADS.includes(h.name)}));
  const procBudget=r2(items.filter(i=>i.procurable).reduce((s,i)=>s+i.amount,0));
  const boq=items.filter(i=>i.procurable).map(i=>({id:i.key,sno:i.sno,description:i.description,make:i.make,unit:i.unit,qty:i.qty,category:i.head,remarks:i.remarks,pcaKey:i.key,matchMode:'pecs',matchScore:1}));
  return{boq,pca:{fileName:pecs.fileName,meta:{gpPct:pecs.gmPct,sellingPrice:pecs.poValue,totalInputCost:pecs.totalCost,ref:pecs.meta?.clientPo||'',customer:pecs.meta?.client||''},
    heads,items,procBudget,version:pecs.version,uploadedAt:pecs.activatedAt||pecs.uploadedAt,uploadedBy:pecs.uploadedBy,uploadedByName:pecs.uploadedByName,driveLink:pecs.driveLink}};
}
// what changes between two PECS versions (item / qty / rate), and the effect on already-placed POs
function diffPecs(oldP,newP,pid){
  const o=Object.fromEntries((oldP?.items||[]).map(i=>[i.key,i])),n=Object.fromEntries(newP.items.map(i=>[i.key,i]));
  const added=newP.items.filter(i=>!o[i.key]),removed=(oldP?.items||[]).filter(i=>!n[i.key]);
  const changed=newP.items.filter(i=>o[i.key]&&(num(o[i.key].qty)!==num(i.qty)||num(o[i.key].landedRate)!==num(i.landedRate)||o[i.key].head!==i.head)).map(i=>({new:i,old:o[i.key]}));
  const ord=pid?orderedByPca(pid):{};const conflicts=[];
  removed.forEach(i=>{if(ord[i.key]?.qty)conflicts.push(`“${i.description}” was removed but ${fmt(ord[i.key].qty,2)} ${i.unit} is already on POs`)});
  changed.forEach(c=>{const q=ord[c.new.key]?.qty||0;if(q>c.new.qty+1e-9)conflicts.push(`“${c.new.description}”: qty reduced to ${fmt(c.new.qty,2)} but ${fmt(q,2)} is already ordered`)});
  return{added,removed,changed,conflicts};

async function savePm(pid,patch,action){
  const p=projectById(pid);patch={...patch};
  // Sales PCA (reference) and PECS (active + pending versions) are separate documents, each well under Firestore's 1 MiB limit
  const heavy=[];
  if('salesPca' in patch){heavy.push(db.collection(PM_DATA).doc(pid+'_pca').set(clean({projectId:pid,kind:'pca',pca:patch.salesPca||null,updatedAt:nowIso(),updatedBy:me()})));delete patch.salesPca}
  if('pecsDoc' in patch){heavy.push(db.collection(PM_DATA).doc(pid+'_pecs').set(clean({projectId:pid,kind:'pecs',active:patch.pecsDoc.active||null,pending:patch.pecsDoc.pending||null,updatedAt:nowIso(),updatedBy:me()})));delete patch.pecsDoc}
  const data={...patch,projectId:pid,projectNumber:p?.number||'',projectName:p?.name||'',updatedAt:nowIso(),updatedBy:me()};
  if(action)data.audit=firebase.firestore.FieldValue.arrayUnion(audit(null,action));
  await Promise.all([...heavy,db.collection(PM_PROJ).doc(pid).set(data,{merge:true})]);
}
function boqBalance(pid,b,excludePoId){const o=orderedByBoq(pid,excludePoId)[b.id]||0;return r2(num(b.qty)-o)}
function statusBadge(st,map){
  const cls={PENDING_PRATIM:'s-pratim',PENDING_UPDESH:'s-updesh',AMEND_PRATIM:'s-pratim',AMEND_UPDESH:'s-updesh',RELEASED:'s-ok',REJECTED:'s-rej',CANCELLED:'s-open',OPEN:'s-open',FINALIZED:'s-pratim',PO_RAISED:'s-ok'}[st]||'s-open';
  return`<span class="badge ${cls}">${esc((map||PO_STATUS)[st]||CS_STATUS[st]||st)}</span>`;
}
function pcaFlagBadge(po){return po.pcaCheck?.overPca?`<span class="badge s-rej" title="${esc((po.pcaCheck.flags||[]).map(f=>f.msg).join('\n'))}"><i class="ti ti-alert-triangle"></i>Over PECS</span>`:`<span class="badge s-ok"><i class="ti ti-circle-check"></i>Within PECS</span>`}
function myApprovalQueue(){
  return poData.filter(p=>((p.status==='PENDING_PRATIM'||p.status==='AMEND_PRATIM')&&canApproveL1())||((p.status==='PENDING_UPDESH'||p.status==='AMEND_UPDESH')&&canApproveL2()));
}
function projectsForSelect(){
  const q=norm(projectFilter);
  return projectsData.filter(p=>!p.archived&&(!q||norm(projLabel(p)+' '+projClient(p)).includes(q)));
}

// ═══════════════════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════════════════
function renderDashboard(){
  const pids=[...new Set([...Object.keys(pmData),...poData.map(p=>p.projectId)])].filter(projectById);
  const released=poData.filter(p=>p.status==='RELEASED');
  const pending=poData.filter(p=>['PENDING_PRATIM','PENDING_UPDESH','AMEND_PRATIM','AMEND_UPDESH'].includes(p.status));
  const overPca=poData.filter(p=>ACTIVE_PO.includes(p.status)&&p.pcaCheck?.overPca);
  const openCs=csData.filter(c=>c.status==='OPEN'||c.status==='FINALIZED');
  const noPca=pids.filter(id=>!pmData[id]?.pecs);const pecsWait=pids.filter(id=>pmData[id]?.pecsPending);
  const queue=myApprovalQueue().concat(isUpdesh()?pecsWait.map(id=>({pecs:id})):[]);
  const rows=pids.map(id=>{
    const p=projectById(id),pm=pmProj(id),bud=pm.pca?.procBudget||0,ord=projectOrderedTotal(id),pct=bud?ord/bud*100:0;
    const npo=poData.filter(x=>x.projectId===id&&ACTIVE_PO.includes(x.status)).length,nover=poData.filter(x=>x.projectId===id&&ACTIVE_PO.includes(x.status)&&x.pcaCheck?.overPca).length;
    return`<tr onclick="openProject('${id}')" style="cursor:pointer"><td><b>${esc(p.number||'')}</b><div class="muted">${esc(p.name||'')}</div></td><td>${esc(projClient(p))}</td>
      <td class="num">${pm.pca?inr(bud):'<span class="flag">No PECS</span>'}</td><td class="num">${inr(ord)}</td>
      <td><div class="bar ${pct>100?'over':''}"><span style="width:${Math.min(100,pct)}%"></span></div><div class="muted">${bud?fmt(pct,1)+'%':'-'}</div></td>
      <td class="num">${(pm.boq||[]).length}</td><td class="num">${npo}</td><td>${nover?`<span class="flag">${nover} over PECS</span>`:'<span class="okc">OK</span>'}</td></tr>`}).join('');
  el('tab-dashboard').innerHTML=`
  ${queue.length?`<div class="notice warn"><i class="ti ti-bell-ringing"></i><div><b>${queue.length} approval${queue.length>1?"s":""} awaiting you.</b> <a href="#" onclick="switchTab('approvals');return false">Open approvals →</a></div></div>`:''}
  <div class="stats">
    <div class="stat"><div class="stat-icon"><i class="ti ti-building-factory-2"></i></div><div><div class="stat-value">${pids.length}</div><div class="stat-label">Projects in ProMS</div></div></div>
    <div class="stat ${noPca.length?'alert':''}"><div class="stat-icon"><i class="ti ti-file-alert"></i></div><div><div class="stat-value">${noPca.length}</div><div class="stat-label">Projects without active PECS</div></div></div>
    <div class="stat"><div class="stat-icon"><i class="ti ti-scale"></i></div><div><div class="stat-value">${openCs.length}</div><div class="stat-label">Open comparisons</div></div></div>
    <div class="stat ${pending.length?'alert':''}"><div class="stat-icon"><i class="ti ti-hourglass"></i></div><div><div class="stat-value">${pending.length}</div><div class="stat-label">POs pending approval</div></div></div>
    <div class="stat"><div class="stat-icon"><i class="ti ti-file-check"></i></div><div><div class="stat-value">${inr(released.reduce((s,p)=>s+poInrValue(p),0))}</div><div class="stat-label">Released PO value (ex-GST)</div></div></div>
    <div class="stat ${overPca.length?'alert':''}"><div class="stat-icon"><i class="ti ti-alert-triangle"></i></div><div><div class="stat-value">${overPca.length}</div><div class="stat-label">Active POs over PECS</div></div></div>
  </div>
  <div class="card"><div class="card-header"><span><i class="ti ti-chart-bar"></i> Procurement vs PECS budget (ex-GST)</span><button class="btn sm primary" onclick="switchTab('project')"><i class="ti ti-plus"></i>Start / open a project</button></div>
    ${rows?`<div class="table-wrap"><table><thead><tr><th>Project</th><th>Client</th><th class="num">PECS procurement budget</th><th class="num">Ordered (active POs)</th><th>Consumed</th><th class="num">PECS items</th><th class="num">POs</th><th>PECS status</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No project has been set up in ProMS yet. Open <b>Project Procurement</b>, pick a PMO project and upload the sales PCA (reference) and the PECS.</div>'}
  </div>
  <div class="card"><div class="card-header"><span><i class="ti ti-clock"></i> Recent POs</span></div>${poTable(poData.slice(0,8))}</div>`;
}
function openProject(id){activeProjectId=id;projSubTab='overview';switchTab('project')}

// ═══════════════════════════════════════════════════════════════════════
// PROJECT PROCUREMENT
// ═══════════════════════════════════════════════════════════════════════
function renderProject(){
  const list=projectsForSelect();
  const p=projectById(activeProjectId);
  const head=`<div class="card"><div class="proj-head">
    <div style="flex:1;min-width:260px"><label class="muted strong">PMO PROJECT</label>
      <select id="projSel" onchange="activeProjectId=this.value;projSubTab='overview';renderProject()">
        <option value="">— Select project —</option>${list.map(x=>`<option value="${x.id}" ${x.id===activeProjectId?'selected':''}>${esc(projLabel(x))}${pmData[x.id]?' ●':''}</option>`).join('')}
      </select></div>
    <div style="width:220px"><label class="muted strong">FILTER</label><input id="projFilter" placeholder="Number / name / client" value="${esc(projectFilter)}" oninput="projectFilter=this.value;clearTimeout(window._pf);window._pf=setTimeout(()=>{renderProject();el('projFilter')?.focus();const f=el('projFilter');if(f)f.setSelectionRange(f.value.length,f.value.length)},350)"></div>
    ${p?`<div class="muted" style="align-self:flex-end">Client: <b>${esc(projClient(p))}</b>${projSites(p)?` · Site: ${esc(projSites(p))}`:''}${p.poNumber?` · Client PO: ${esc(p.poNumber)}`:''}</div>`:''}
  </div><div class="muted">● = already set up in ProMS. Projects come from DORBIT PMO (dqap_projects).</div></div>`;
  if(!p){el('tab-project').innerHTML=head;return}
  const pm=pmProj(p.id);
  const cs=csData.filter(c=>c.projectId===p.id),pos=poData.filter(x=>x.projectId===p.id);
  const tabs=[['overview','ti-info-circle','Overview'],['pecs','ti-table-column','PECS'+(pm.pecs?' v'+pm.pecs.version:' ⚠')+(pm.pecsPending?' ⏳':'')],['quotes','ti-scale','Quotations ('+cs.length+')'],['pos','ti-file-invoice','POs ('+pos.length+')']];
  let body='';
  if(projSubTab==='overview')body=projOverview(p,pm);
  else if(projSubTab==='pecs')body=projPecs(p,pm);
  else if(projSubTab==='quotes')body=projQuotes(p,pm,cs);
  else body=`<div class="card"><div class="card-header"><span>Purchase orders — ${esc(p.number)}</span></div>${poTable(pos)}</div>`;
  el('tab-project').innerHTML=head+`<div class="subtabs">${tabs.map(t=>`<button class="subtab ${projSubTab===t[0]?'active':''}" onclick="projSubTab='${t[0]}';renderProject()"><i class="ti ${t[1]}"></i>${t[2]}</button>`).join('')}</div>`+body;
}

function projOverview(p,pm){
  const bud=pm.pca?.procBudget||0,ord=projectOrderedTotal(p.id),bal=r2(bud-ord),gmv=pm.pecs?pecsVsPca(pm.pecs,pm.salesPca):null;
  const steps=[
    [!!pm.salesPca,'Sales PCA (reference)','pecs'],
    [!!pm.pecs,'PECS active','pecs'],
    [csData.some(c=>c.projectId===p.id),'Quotations recorded','quotes'],
    [poData.some(x=>x.projectId===p.id&&x.status==='RELEASED'),'PO released','pos']
  ];
  const heads=(pm.pca?.heads||[]).map(h=>{
    const ord=r2(poData.filter(x=>x.projectId===p.id&&ACTIVE_PO.includes(x.status)).reduce((s,po)=>s+(po.lines||[]).filter(l=>pcaItem(p.id,l.pcaKey)?.head===h.name).reduce((a,l)=>a+num(l.qty)*lineNetRate(l)*(num(po.fxRate)||1),0),0));
    const t=h.summaryTotal??h.total;
    return`<tr class="${h.procurable&&ord>t+0.5?'over':''}"><td>${esc(h.label||h.name)}</td><td class="num">${inr(t)}</td><td class="num">${h.procurable?inr(ord):'<span class="muted">not via PO</span>'}</td><td class="num">${h.procurable?inr(t-ord):'-'}</td></tr>`}).join('');
  return driveCard(p,pm)+(pm.pecsPending?`<div class="notice warn"><i class="ti ti-hourglass"></i><div><b>PECS v${pm.pecsPending.version} is awaiting Updesh's approval</b> (gross margin below sales PCA). ${pm.pecs?'Until approved, POs are checked against PECS v'+pm.pecs.version+'.':'POs cannot be raised until a PECS is active.'} <a href="#" onclick="projSubTab='pecs';renderProject();return false">Open PECS →</a></div></div>`:'')+`<div class="stats">
    <div class="stat"><div class="stat-icon"><i class="ti ti-calculator"></i></div><div><div class="stat-value">${pm.pca?inr(bud):'—'}</div><div class="stat-label">PECS procurement budget</div></div></div>
    <div class="stat"><div class="stat-icon"><i class="ti ti-shopping-cart"></i></div><div><div class="stat-value">${inr(ord)}</div><div class="stat-label">Ordered (active POs)</div></div></div>
    <div class="stat ${bal<0?'alert':''}"><div class="stat-icon"><i class="ti ti-wallet"></i></div><div><div class="stat-value">${pm.pca?inr(bal):'—'}</div><div class="stat-label">Balance vs PECS</div></div></div>
    <div class="stat ${gmv?.gmDrop?'alert':''}"><div class="stat-icon"><i class="ti ti-percentage"></i></div><div><div class="stat-value">${pm.pecs?.gmPct!=null?fmt(pm.pecs.gmPct*100,1)+'%':'—'}</div><div class="stat-label">PECS gross margin${gmv?.v?.gmPct!=null?' (sales PCA '+fmt(gmv.v.gmPct*100,1)+'%)':''}</div></div></div>
  </div>
  <div class="card"><div class="card-header"><span>Procurement workflow</span></div>
    <div class="btn-row">${steps.map((s,i)=>`<button class="btn ${s[0]?'ok':''}" onclick="projSubTab='${s[2]}';renderProject()"><i class="ti ${s[0]?'ti-circle-check':'ti-circle-dashed'}"></i>${i+1}. ${s[1]}</button>`).join('<i class="ti ti-chevron-right muted"></i>')}</div>
  </div>
  ${heads?`<div class="card"><div class="card-header"><span>PECS cost heads vs ordered (ex-GST, ₹)</span><span class="muted">PECS: ${esc(pm.pca.fileName||'')} · v${pm.pca.version||1}</span></div><div class="table-wrap"><table><thead><tr><th>Cost head</th><th class="num">PECS</th><th class="num">Ordered</th><th class="num">Balance</th></tr></thead><tbody>${heads}</tbody></table></div></div>`:''}
  <div class="card"><div class="card-header"><span>Activity log</span></div>${auditList(pm.audit)}</div>`;
}
function auditList(a){const list=(a||[]).slice().sort((x,y)=>String(y.time).localeCompare(String(x.time)));return list.length?list.slice(0,60).map(x=>`<div class="audit-row"><span class="muted">${fmtDateTime(x.time)}</span><b>${esc(x.actor)}</b><span>${esc(x.action)}</span></div>`).join(''):'<div class="empty">No activity yet</div>'}

// ── PO table (shared) ─────────────────────────────────────────────────
function poTable(list){
  if(!list.length)return'<div class="empty">No purchase orders</div>';
  return`<div class="table-wrap"><table><thead><tr><th>PO No.</th><th>Date</th><th>Project</th><th>Vendor</th><th class="num">Value (ex-GST ₹)</th><th class="num">Grand total</th><th>PECS check</th><th>Status</th><th></th></tr></thead><tbody>${list.map(po=>`<tr>
    <td><b>${esc(po.poNumber)}</b>${po.amendmentNo?`<div><span class="pill" style="background:#FFE0B2;color:#8a3b00">Amendment ${po.amendmentNo}</span></div>`:''}${po.revision?`<div class="muted">Rev ${po.revision}</div>`:''}</td><td>${fmtDate(po.poDate)}</td><td>${esc(po.projectNumber)}<div class="muted">${esc(po.projectName||'')}</div></td><td>${esc(po.vendorName)}</td>
    <td class="num">${inr(poInrValue(po))}</td><td class="num">${po.currency&&po.currency!=='INR'?esc(po.currency)+' '+fmt(po.totals?.grand,2):inr(po.totals?.grand)}</td><td>${pcaFlagBadge(po)}</td><td>${statusBadge(po.status)}</td>
    <td><button class="btn sm" onclick="viewPO('${po.id}')"><i class="ti ti-eye"></i>View</button></td></tr>`).join('')}</tbody></table></div>`;
}

function driveCard(p,pm){
  const d=pm.drive;
  if(!p.driveFolderId)return`<div class="notice warn"><i class="ti ti-folder-off"></i><div>This project has no Drive folder yet. Create the project Drive folders from DORBIT PMO — ProMS will then add its own <b>ProMS</b> folder inside it automatically.</div></div>`;
  const virt=window.offlineDriveListing?window.offlineDriveListing(p.id):'';
  return`<div class="notice info"><i class="ti ti-brand-google-drive"></i><div style="flex:1"><b>Documents are filed in Google Drive</b> — ${d?.rootLink?`<a target="_blank" href="${esc(d.rootLink)}">open the ProMS folder</a> (PECS · Sales PCA · Quotations · Purchase Orders)`:'the <b>ProMS</b> folder is created inside the project’s PMO folder on the first upload.'}
    ${virt}</div></div>`;
}
// ═══════════════════════════════════════════════════════════════════════
// PECS TAB — upload, head-wise comparison with sales PCA, GM approval, versions
// Rules: (1) every item belongs to a cost head, untagged → "Items not assigned to a cost head"
//        (2) PECS GM% below sales-PCA GM% → Updesh approves; equal or higher → active immediately
//        (3) any change in item / qty / cost = new PECS uploaded as a new version
// ═══════════════════════════════════════════════════════════════════════
function canUploadPecs(){return isBuyer()||isPratim()||isUpdesh()}
const pctS=(x,d=1)=>x==null?'—':fmt(x*100,d)+'%';
function varCls(p){return p>0.0005?'flag':p<-0.0005?'okc':'muted'}
function headCompareTable(cmp){
  if(!cmp)return'';
  const noPca=!cmp.v;
  const rows=cmp.rows.map(r=>{const unas=r.head===UNASSIGNED;
    return`<tr class="${unas&&r.pecs?'over':''}"><td>${esc(r.head)}</td><td class="num">${noPca?'—':inr(r.pca)}</td><td class="num"><b>${inr(r.pecs)}</b></td><td class="num ${varCls(r.diff)}">${noPca?'—':(r.diff>0?'+':'')+inr(r.diff)}</td><td class="num ${varCls(r.diff)}">${noPca||r.pct==null?'—':(r.diff>0?'+':'')+fmt(r.pct*100,1)+'%'}</td>
    <td class="muted">${noPca?'':unas?(r.pecs?'Tag these items to a head':''):r.diff>0.5?'Under-estimated by sales':r.diff<-0.5?'Over-estimated by sales':'On estimate'}</td></tr>`}).join('');
  return`<div class="table-wrap"><table><thead><tr><th>Cost head</th><th class="num">Sales PCA (estimate)</th><th class="num">PECS (actual)</th><th class="num">Variance ₹</th><th class="num">Variance %</th><th>Reading</th></tr></thead><tbody>${rows}
    <tr style="font-weight:700;background:#F5F7FA"><td>Total cost</td><td class="num">${cmp.v?inr(cmp.v.cost):'—'}</td><td class="num">${inr(cmp._pecs.totalCost)}</td><td class="num ${varCls(cmp.costDiff)}">${cmp.v?(cmp.costDiff>0?'+':'')+inr(cmp.costDiff):'—'}</td><td></td><td></td></tr>
    <tr style="font-weight:700"><td>Selling price / PO value</td><td class="num">${cmp.v?.sell?inr(cmp.v.sell):'—'}</td><td class="num">${inr(cmp._pecs.poValue)}</td><td class="num">${cmp.sellDiff!=null?(cmp.sellDiff>0?'+':'')+inr(cmp.sellDiff):'—'}</td><td></td><td></td></tr>
    <tr style="font-weight:700;background:#F5F7FA"><td>Gross margin ₹</td><td class="num">${cmp.v?.gm!=null?inr(cmp.v.gm):'—'}</td><td class="num">${inr(cmp._pecs.gm)}</td><td class="num">${cmp.v?.gm!=null?(cmp._pecs.gm-cmp.v.gm>0?'+':'')+inr(cmp._pecs.gm-cmp.v.gm):'—'}</td><td></td><td></td></tr>
    <tr style="font-weight:800"><td>Gross margin %</td><td class="num">${pctS(cmp.v?.gmPct,2)}</td><td class="num ${cmp.gmDrop?'flag':'okc'}">${pctS(cmp._pecs.gmPct,2)}</td><td class="num ${cmp.gmDrop?'flag':'okc'}">${cmp.gmDelta!=null?(cmp.gmDelta>0?'+':'')+fmt(cmp.gmDelta*100,2)+' pts':'—'}</td><td></td><td class="${cmp.gmDrop?'flag':'okc'}">${cmp.gmDrop?'BELOW sales PCA':cmp.gmDelta!=null?'Equal / higher':''}</td></tr></tbody></table></div>`;
}
function cmpOf(pecs,sp){const c=pecsVsPca(pecs,sp);if(c)c._pecs=pecs;return c}
function pecsStatsHtml(pecs,cmp){
  return`<div class="stats">
    <div class="stat"><div class="stat-icon"><i class="ti ti-file-invoice"></i></div><div><div class="stat-value">${inr(pecs.poValue)}</div><div class="stat-label">PO value (ex-GST)</div></div></div>
    <div class="stat"><div class="stat-icon"><i class="ti ti-calculator"></i></div><div><div class="stat-value">${inr(pecs.totalCost)}</div><div class="stat-label">PECS total cost</div></div></div>
    <div class="stat"><div class="stat-icon"><i class="ti ti-coin"></i></div><div><div class="stat-value">${inr(pecs.gm)}</div><div class="stat-label">Gross margin</div></div></div>
    <div class="stat ${cmp?.gmDrop?'alert':''}"><div class="stat-icon"><i class="ti ti-percentage"></i></div><div><div class="stat-value">${pctS(pecs.gmPct)}</div><div class="stat-label">GM % ${cmp?.v?.gmPct!=null?'(sales PCA '+pctS(cmp.v.gmPct)+')':''}</div></div></div>
  </div>`;
}
function projPecs(p,pm){
  const pecs=pm.pecs,pend=pm.pecsPending,sp=pm.salesPca;
  const ordered=orderedByPca(p.id);
  const canPca=sp?(canReplacePca()||(isBuyer()&&!pecs)):canUploadPecs();
  const hdr=`<div class="card"><div class="card-header"><span><i class="ti ti-table-column"></i> Project Execution Cost Sheet (PECS)</span><div class="btn-row">
    <button class="btn sm" onclick="downloadPecsTemplate()"><i class="ti ti-download"></i>PECS template</button>
    ${canUploadPecs()?`<button class="btn sm primary" onclick="${sp?`el('filePecs').value='';el('filePecs').click()`:`showToast('Upload the sales PCA (reference) first — PECS is measured against it','error')`}"><i class="ti ti-upload"></i>${pecs||pend?'Upload new PECS version':'Upload PECS'}</button>`:''}</div></div>
    <div class="muted">PMO's actual execution cost: items, quantities, rates, PO value and the resulting gross margin. Every PO is checked against the <b>active PECS</b>. Any change to an item, quantity or cost → upload a new version. A PECS whose GM% is below the sales PCA's goes to <b>Updesh</b> for approval; equal or higher is active at once.</div></div>`;
  const spCard=`<div class="card"><div class="card-header"><span><i class="ti ti-calculator"></i> Sales PCA — reference only</span><div class="btn-row">
    ${sp?.driveLink?`<a class="btn sm" target="_blank" href="${esc(sp.driveLink)}"><i class="ti ti-brand-google-drive"></i>File</a>`:''}
    ${canPca?`<button class="btn sm ${sp?'':'primary'}" onclick="el('filePca').value='';el('filePca').click()"><i class="ti ti-upload"></i>${sp?'Replace sales PCA':'Upload sales PCA'}</button>`:sp?'<span class="muted">Only Pratim/Updesh can replace it once a PECS exists</span>':''}</div></div>
    ${sp?(()=>{const v=salesPcaView(sp);return`<div class="detail-grid"><div class="detail-item"><div class="lbl">File</div><div class="val">${esc(sp.fileName)}</div></div><div class="detail-item"><div class="lbl">Uploaded</div><div class="val">${fmtDateTime(sp.uploadedAt)} by ${esc(sp.uploadedByName||'')}</div></div>
      <div class="detail-item"><div class="lbl">Estimated cost / selling price</div><div class="val">${inr(v.cost)} / ${v.sell?inr(v.sell):'—'}</div></div><div class="detail-item"><div class="lbl">Sales GM %</div><div class="val">${pctS(v.gmPct,2)}</div></div></div>`})()
      :'<div class="empty">Upload the DQAP sales PCA workbook. It is not used for control — only to measure how accurate the estimate was (by cost head and gross margin).</div>'}</div>`;
  // pending
  let pendHtml='';
  if(pend){
    const cmp=cmpOf(pend,sp),df=diffPecs(pecs,pend,p.id);
    pendHtml=`<div class="card" style="border:2px solid #F9A825"><div class="card-header"><span><i class="ti ti-hourglass"></i> PECS v${pend.version} — awaiting Updesh's approval</span><span class="badge s-updesh">Pending Updesh</span></div>
      <div class="notice warn"><i class="ti ti-trending-down"></i><div><b>Gross margin ${pctS(pend.gmPct,2)} is below sales PCA ${pctS(pend.salesGmPct,2)}</b> (${fmt((pend.gmPct-pend.salesGmPct)*100,2)} pts). Submitted by ${esc(pend.uploadedByName)} on ${fmtDateTime(pend.uploadedAt)}${pend.reason?` — reason: “${esc(pend.reason)}”`:''}. ${pecs?`POs continue to be checked against PECS v${pecs.version} until this is approved.`:'POs cannot be raised until a PECS is active.'}</div></div>
      ${pecsStatsHtml(pend,cmp)}${headCompareTable(cmp)}${diffSummaryHtml(df)}
      ${isUpdesh()?`<div class="form-group" style="margin-top:12px"><label>Remarks (required to reject; recommended on approval)</label><textarea id="pecsRem" style="min-height:56px"></textarea></div>
        <div class="btn-row"><button class="btn ok" onclick="approvePecs('${p.id}')"><i class="ti ti-check"></i>Approve &amp; activate v${pend.version}</button><button class="btn bad" onclick="rejectPecs('${p.id}')"><i class="ti ti-x"></i>Reject</button></div>`
       :(canUploadPecs()?`<div class="btn-row" style="margin-top:10px"><button class="btn sm" onclick="withdrawPecs('${p.id}')"><i class="ti ti-arrow-back-up"></i>Withdraw</button></div>`:'')}</div>`;
  }
  if(!pecs)return hdr+spCard+pendHtml+(pend?'':`<div class="card"><div class="empty">No PECS yet. ${sp?'Download the template, fill it (items, quantities, rates, PO value, cost head against every item) and upload.':'Upload the sales PCA first, then the PECS.'}</div></div>`);
  const cmp=cmpOf(pecs,sp);
  const unas=pecs.items.filter(i=>i.head===UNASSIGNED);

// ═══════════════════════════════════════════════════════════════════════
// QUOTATIONS / COMPARATIVE STATEMENT (CS)
// Value comparison is ex-GST landed INR (basic − discount + freight) × FX,
// because GST is recoverable as ITC. Only quotes covering every line are
// eligible to be overall L1.
// ═══════════════════════════════════════════════════════════════════════
function openSubModal(html){closeSubModal();const d=document.createElement('div');d.id='subModal';d.className='modal';d.style.zIndex=6000;d.innerHTML=`<div class="dialog narrow">${html}</div>`;d.onclick=e=>{if(e.target===d)closeSubModal()};document.body.appendChild(d)}
function closeSubModal(){el('subModal')?.remove()}
function vendorById(id){return vendorsData.find(v=>v.id===id)}
function quoteLine(q,boqId){return(q.rates||{})[boqId]||{}}
function quoteTotals(q,items){
  let basic=0,quoted=0;
  items.forEach(it=>{const r=quoteLine(q,it.boqId);if(num(r.rate)>0){quoted++;basic+=num(it.qty)*num(r.rate)*(1-num(r.discPct)/100)}});
  basic=r2(basic);const freight=r2(num(q.freight)),fx=num(q.fxRate)||1,gst=(q.currency||'INR')==='INR'?r2((basic+freight)*num(q.gstPct)/100):0;
  return{basic,freight,gst,grand:r2(basic+freight+gst),landedInr:r2((basic+freight)*fx),complete:quoted===items.length&&items.length>0,quoted};
}
function csAnalysis(cs){
  const items=cs.items||[],quotes=(cs.quotes||[]).filter(q=>q.vendorName||q.vendorId);
  const totals={};quotes.forEach(q=>totals[q.id]=quoteTotals(q,items));
  const eligible=quotes.filter(q=>totals[q.id].complete);
  let l1=null;eligible.forEach(q=>{if(!l1||totals[q.id].landedInr<totals[l1.id].landedInr)l1=q});
  const lineL1={};items.forEach(it=>{let best=null,bv=Infinity;quotes.forEach(q=>{const r=quoteLine(q,it.boqId);if(num(r.rate)>0){const v=num(r.rate)*(1-num(r.discPct)/100)*(num(q.fxRate)||1);if(v<bv){bv=v;best=q.id}}});lineL1[it.boqId]=best});
  return{quotes,totals,l1Id:l1?.id||'',lineL1,validCount:eligible.length};
}

function projQuotes(p,pm,list){
  const rows=list.map(c=>{const a=csAnalysis(c),sel=(c.quotes||[]).find(q=>q.id===c.selectedQuoteId),l1=(c.quotes||[]).find(q=>q.id===a.l1Id);
    return`<tr><td><b>${esc(c.csNo||'')}</b><div class="muted">${esc(c.title||'')}</div></td><td class="num">${(c.items||[]).length}</td><td class="num">${a.quotes.length}${a.quotes.length<MIN_QUOTES?' <span class="flag">!</span>':''}</td>
      <td>${l1?esc(l1.vendorName)+'<div class="muted">'+inr(a.totals[l1.id].landedInr)+'</div>':'-'}</td><td>${sel?esc(sel.vendorName)+(sel.id!==a.l1Id?' <span class="badge s-warn">not L1</span>':''):'-'}</td>
      <td>${statusBadge(c.status,CS_STATUS)}</td><td>${fmtDate(c.createdAt)}<div class="muted">${esc(userLabel(c.createdBy))}</div></td>
      <td><div class="btn-row"><button class="btn sm" onclick="openCsEditor('${c.id}')"><i class="ti ${c.status==='OPEN'&&isBuyer()?'ti-edit':'ti-eye'}"></i>${c.status==='OPEN'&&isBuyer()?'Edit':'View'}</button>
        ${c.status==='FINALIZED'&&isBuyer()?`<button class="btn sm primary" onclick="startPoFromCs('${c.id}')"><i class="ti ti-file-plus"></i>Raise PO</button>`:''}
        <button class="btn sm" onclick="printCS('${c.id}')" title="Print comparative statement"><i class="ti ti-printer"></i></button></div></td></tr>`}).join('');
  const pending=(pm.boq||[]).filter(b=>boqBalance(p.id,b)>0).length;
  return`<div class="card"><div class="card-header"><span>Quotation comparisons (min. ${MIN_QUOTES} quotes per purchase)</span>
    ${isBuyer()?`<button class="btn sm primary" onclick="newCsModal()" ${(pm.boq||[]).length?'':'disabled'}><i class="ti ti-plus"></i>New comparison</button>`:''}</div>
    ${!(pm.boq||[]).length?'<div class="notice info"><i class="ti ti-info-circle"></i><div>Upload and activate the PECS first — comparisons are built from PECS items.</div></div>':`<div class="muted" style="margin-bottom:8px">${pending} PECS item(s) still have balance quantity to order.</div>`}
    ${rows?`<div class="table-wrap"><table><thead><tr><th>CS No.</th><th class="num">Items</th><th class="num">Quotes</th><th>L1 (ex-GST landed)</th><th>Selected vendor</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No comparisons yet</div>'}</div>`;
}

async function saveCs(finalize){
  const c=csDraft,a=csAnalysis(c);
  const named=c.quotes.filter(q=>q.vendorId);
  if(c.quotes.some(q=>!q.vendorId&&Object.values(q.rates||{}).some(r=>num(r.rate)>0)))return showToast('Pick a vendor for every quote that has rates','error');
  const ids=named.map(q=>q.vendorId);if(new Set(ids).size!==ids.length)return showToast('Same vendor entered twice — each quote must be from a different vendor','error');
  if(finalize){
    const sel=c.quotes.find(q=>q.id===c.selectedQuoteId);
    if(!sel)return showToast('Select the vendor to finalise','error');
    if(!a.totals[sel.id]?.complete)return showToast('Selected quote must price every line','error');
    if(!sel.ref)return showToast('Enter the selected vendor’s quotation reference','error');
    if((sel.id!==a.l1Id||a.validCount<MIN_QUOTES)&&String(c.justification||'').trim().length<15)return showToast('Write a justification (min. 15 characters)','error');
  }
  showLoad(finalize?'Finalising…':'Saving…');
  try{
    if(!c.csNo&&!c.id)c.csNo=await nextCsNo(c.projectId);
    for(const q of c.quotes){const f=window._csFiles?.[q.id];if(f){try{const rec=await uploadToProms(f,c.projectId,'quotes',{sub:c.csNo||c.id,tag:`Quote ${q.vendorName||''} ${q.ref||''}`.trim()});q.attachment={fileName:rec.fileName,webViewLink:rec.webViewLink}}catch(e){showToast('Quote file not uploaded: '+e.message,'error')}delete window._csFiles[q.id]}delete q._fileName}
    c.quotes=c.quotes.filter(q=>q.vendorId||Object.keys(q.rates||{}).length);
    const sel=c.quotes.find(q=>q.id===c.selectedQuoteId);
    const data={projectId:c.projectId,projectNumber:projectById(c.projectId)?.number||'',projectName:projectById(c.projectId)?.name||'',title:c.title,items:c.items,quotes:c.quotes,
      selectedQuoteId:c.selectedQuoteId||'',l1QuoteId:a.l1Id,validQuoteCount:a.validCount,justification:c.justification||'',updatedAt:nowIso(),updatedBy:me()};
    if(finalize){data.status='FINALIZED';data.finalizedAt=nowIso();data.finalizedBy=me();data.selectedVendorId=sel.vendorId;data.selectedVendorName=sel.vendorName;data.selectedValueInr=a.totals[sel.id].landedInr}
    const act=finalize?`Vendor finalised: ${sel.vendorName} (${inr(a.totals[sel.id].landedInr)} ex-GST)${sel.id!==a.l1Id?' — NOT L1':''}; ${a.validCount} complete quote(s)`:`Saved draft with ${c.quotes.length} quote(s)`;
    if(c.id){await db.collection(PM_CS).doc(c.id).update({...data,audit:firebase.firestore.FieldValue.arrayUnion(audit(null,act))})}
    else{data.csNo=c.csNo||await nextCsNo(c.projectId);data.status=data.status||'OPEN';data.createdAt=nowIso();data.createdBy=me();data.poIds=[];data.audit=[audit(null,'Comparison created: '+c.title),audit(null,act)];const ref=await db.collection(PM_CS).add(data);c.id=ref.id;c.csNo=data.csNo}
    if(finalize)snapshotToDrive(c.projectId,'quotes',c.csNo||c.id,`${(c.csNo||'CS').replace(/\//g,'_')} - comparison snapshot.json`,{...data,csNo:c.csNo||data.csNo,analysis:{l1QuoteId:a.l1Id,validQuoteCount:a.validCount,totals:a.totals}}).catch(e=>console.warn('CS snapshot skipped:',e.message));
    hideLoad();showToast(finalize?'Vendor finalised — you can now raise the PO':'Comparison saved');
    if(finalize){csDraft=null;closeModal();projSubTab='quotes';renderAll(true)}else{Object.assign(c,data);renderCsEditor()}
  }catch(e){hideLoad();console.error(e);showToast('Save failed: '+e.message,'error')}
}

function fyOf(dateStr){const d=new Date(dateStr||today());const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return`${String(y).slice(2)}-${String(y+1).slice(2)}`}
async function nextPoNumber(dateStr){
  const fy=fyOf(dateStr),ref=db.collection(PM_CNT).doc('po_'+fy.replace('-',''));
  const seq=await db.runTransaction(async tx=>{const d=await tx.get(ref);const n=(d.exists?num(d.data().seq):0)+1;tx.set(ref,{seq:n,fy,updatedAt:nowIso(),updatedBy:me()},{merge:true});return n});
  return`${settings.poPrefix||'DQAP/PO'}/${fy}/${String(seq).padStart(4,'0')}`;
}
function startPoFromCs(csId){
  const cs=csData.find(c=>c.id===csId);if(!cs)return;const q=(cs.quotes||[]).find(x=>x.id===cs.selectedQuoteId);if(!q)return showToast('No finalised vendor on this comparison','error');

    return{boqId:it.boqId,pcaKey:b.pcaKey||it.pcaKey||'',description:it.description,make:it.make||'',unit:it.unit||'Nos',hsn:b.hsn||'',qty:Math.max(0,Math.min(num(it.qty),bal)),rate:num(r.rate),discPct:num(r.discPct),gstPct:num(q.gstPct)}}).filter(l=>l.qty>0);
  if(!lines.length)return showToast('Nothing left to order on this comparison — PECS balance is zero','error');
  const foreign=(q.currency||'INR')!=='INR';
  poDraft={id:null,csId,csNo:cs.csNo,projectId:pid,vendorId:q.vendorId,vendorName:q.vendorName,quoteRef:q.ref,quoteDate:q.date,currency:q.currency||'INR',fxRate:foreign?num(q.fxRate)||1:1,
    orderType:'PURCHASE',poDate:today(),lines,freight:num(q.freight),freightGstPct:num(q.gstPct),otherCharges:0,otherChargesLabel:'',
    paymentTerms:q.payTerms||v.defaultPayTerms||'',deliveryPeriod:q.delivery||'',warranty:q.warranty||'',priceBasis:foreign?'CIF / as per quotation':'F.O.R. site, inclusive of packing & forwarding',freightTerms:num(q.freight)?'Extra as above':'Inclusive',
    insurance:'Vendor’s scope till delivery at site',inspection:'At site on receipt',shipTo:[p?.name,projSites(p)].filter(Boolean).join(', '),billTo:settings.billTo||`${settings.company.name}\n${settings.company.address}`,
    contactPerson:myName(),specialNotes:'',tnc:[...(settings.tnc||[])],overPcaJustification:'',shipState:settings.company.state||'',scope:'',priceVariation:'Not Applicable',deliveryFrom:'',deliveryTo:'',orderExpiry:'',specialTerms:[]};
  closeModal();renderPoEditor();

function poCalc(d){
  const foreign=(d.currency||'INR')!=='INR',v=vendorById(d.vendorId)||{};
  const pos=d.shipState||settings.company.state||'';const inter=!foreign&&norm(v.state||'')&&norm(pos)&&norm(v.state)!==norm(pos);
  let basic=0,tax=0;const taxBy={};
  (d.lines||[]).forEach(l=>{const amt=r2(num(l.qty)*lineNetRate(l));l.amount=amt;basic+=amt;if(!foreign){const t=amt*num(l.gstPct)/100;tax+=t;taxBy[num(l.gstPct)]=(taxBy[num(l.gstPct)]||0)+t}});
  const ft=foreign?0:num(d.freight)*num(d.freightGstPct)/100,ot=foreign?0:num(d.otherCharges)*num(d.freightGstPct)/100;tax+=ft+ot;if(ft+ot)taxBy[num(d.freightGstPct)]=(taxBy[num(d.freightGstPct)]||0)+ft+ot;
  basic=r2(basic);tax=r2(tax);const taxable=r2(basic+num(d.freight)+num(d.otherCharges));
  return{basic,taxable,gst:tax,igst:inter?tax:0,cgst:!inter&&!foreign?r2(tax/2):0,sgst:!inter&&!foreign?r2(tax/2):0,interState:!!inter,taxBy,grand:r2(taxable+tax)};
}

function buildPoDoc(d){
  const t=poCalc(d),v=vendorById(d.vendorId)||{},p=projectById(d.projectId)||{};
  const chk=evaluatePca(d.projectId,d.lines,{fxRate:d.fxRate,currency:d.currency,excludePoId:d.id,thisPoValueInr:(t.basic+num(d.freight)+num(d.otherCharges))*(num(d.fxRate)||1)});
  const c={...d};['_chk','id','amendOf','amendReason'].forEach(k=>delete c[k]);
  return clean({...c,projectNumber:p.number||'',projectName:p.name||'',client:projClient(p),clientPoNo:d.clientPoNo||p.poNumber||'',
    vendorSnapshot:d.vendorSnapshot||{name:v.name||d.vendorName,address:v.address||'',city:v.city||'',state:v.state||'',pincode:v.pincode||'',gstin:v.gstin||'',pan:v.pan||'',contactName:v.contactName||'',phone:v.phone||'',email:v.email||''},
    companySnapshot:d.companySnapshot||{...settings.company},signatory:d.signatory||settings.signatory,totals:t,pcaCheck:chk,pcaVersion:pmProj(d.projectId).pca?.version||0,updatedAt:nowIso(),updatedBy:me()});
}
async function submitPO(){
  const d=poDraft;if(d.amendOf)return submitAmendment();
  const err=validatePoDraft(d);if(err)return showToast(err,'error');
  const doc=buildPoDoc(d);
  if(doc.pcaCheck.overPca&&String(d.overPcaJustification||'').trim().length<15)return showToast('Over-PECS justification required (min. 15 characters)','error');
  if(!confirm(`${d.id?'Resubmit':'Submit'} PO to ${d.vendorName} for ${d.currency==='INR'?inr2(doc.totals.grand):d.currency+' '+fmt(doc.totals.grand,2)}?\n${doc.pcaCheck.overPca?'⚠ Over PECS — will route Pratim → Updesh':'Within PECS — routes to Pratim'}`))return;
  showLoad('Submitting PO…');
  try{
    doc.status='PENDING_PRATIM';doc.submittedAt=nowIso();doc.submittedBy=me();doc.submittedByName=myName();doc.approvals=[];doc.amendmentNo=0;doc.amendmentDate='';
    if(d.id){
      const old=poData.find(x=>x.id===d.id);doc.revision=(old?.revision||0)+1;
      doc.revisionHistory=firebase.firestore.FieldValue.arrayUnion(clean({revision:old?.revision||0,grand:old?.totals?.grand||0,status:old?.status,rejectedReason:old?.rejectedReason||'',at:nowIso()}));
      doc.audit=firebase.firestore.FieldValue.arrayUnion(audit(null,`Revised & resubmitted (Rev ${doc.revision}) — ${inr(doc.totals.grand)}${doc.pcaCheck.overPca?' — OVER PCA':''}`));
      doc.rejectedReason='';
      await db.collection(PM_PO).doc(d.id).update(doc);
    }else{
      doc.poNumber=await nextPoNumber(d.poDate);doc.revision=0;doc.createdAt=nowIso();doc.createdBy=me();
      doc.audit=[audit(null,`PO ${doc.poNumber} generated & submitted — ${inr(doc.totals.grand)}${doc.pcaCheck.overPca?` — OVER PCA by ≈${inr(doc.pcaCheck.overAmt)}`:' — within PECS'}`)];
      const ref=await db.collection(PM_PO).add(doc);
      await db.collection(PM_CS).doc(d.csId).update({status:'PO_RAISED',poIds:firebase.firestore.FieldValue.arrayUnion(ref.id),audit:firebase.firestore.FieldValue.arrayUnion(audit(null,'PO raised: '+doc.poNumber))});
    }
    poDraft=null;closeModal();hideLoad();showToast(`PO ${doc.poNumber||d.poNumber} submitted for approval`);renderAll(true);
  }catch(e){hideLoad();console.error(e);showToast('Submit failed: '+e.message,'error')}
}
function previewDraftPO(){
  const d=poDraft;const err=validatePoDraft(d);if(err)return showToast(err,'error');
  const doc=buildPoDoc(d);
  if(d.amendOf){const old=poData.find(x=>x.id===d.amendOf),df=diffAmend(old,doc);
    const prev={...old,...doc,lines:df.lines,cancelledLines:df.cancelledLines,amendmentNo:df.no,amendmentDate:today(),status:'DRAFT',amendDraft:true,_amendReason:d.amendReason||'(reason not yet entered)',_changes:df.changes,_valueBefore:old.totals?.grand,id:old.id,poNumber:old.poNumber,amendments:old.amendments||[]};
    return printPO(prev)}
  printPO({...doc,poNumber:d.poNumber||'(to be generated)',status:'DRAFT'});
}
